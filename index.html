// 確認コードはサーバーが作り、サーバーが本人のメールアドレスへ送る。
// 画面側はコードの中身を一切受け取らない。
// 【動作の軽量化 8/15】
// 以前はメールの送信が終わるのを待ってから画面を切り替えていた。
// メール送信は外部のサーバーを経由するため数秒かかり、
// その間ずっとローディングのままで「重い」と感じる原因になっていた。
// 先に画面を出し、送信は裏側で進める形に変更した。
// 利用者はメールが届くまでどのみち待つので、画面を止めておく理由がない。
async function goEmailVerify(){
  go('email_verify');
  try{
    var s=await DB.auth.getSession();
    var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    if(token){
      // await を付けない（送信の完了を待たない）
      fetch('/api/send-email',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({action:'verify_code'})}).catch(function(){});
    }
  }catch(e){}
}

var _everifyChecking=false;
async function submitEmailVerify(){
  if(_everifyChecking)return;
  var inp=document.getElementById('everify-inp');
  var errEl=document.getElementById('everify-err');
  var btn=document.getElementById('everify-btn');
  var code=inp?inp.value.trim():'';
  if(!code){if(errEl)errEl.textContent='コードを入力してください';return;}
  // 【押した瞬間に反応を返す 8/15】
  // 以前はボタンを押しても見た目が変わらず、通信が終わるまで無反応だったため、
  // 押せていないのかと思って待つことになっていた。
  _everifyChecking=true;
  if(btn){btn.disabled=true;btn.style.opacity='.55';btn.textContent='確認中…';}
  if(errEl)errEl.textContent='';
  // 照合はサーバー側で行う。画面側は正解のコードを持たない
  var ok=false;
  try{
    var ses=await DB.auth.getSession();
    var tk=ses&&ses.data&&ses.data.session?ses.data.session.access_token:null;
    if(!tk){if(errEl)errEl.textContent='ログインし直してください';return;}
    var vr=await fetch('/api/send-email',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},
      body:JSON.stringify({action:'verify_check',code:code})});
    var vj=await vr.json();
    ok=!!(vj&&vj.success);
    if(!ok&&vj&&vj.error==='expired'){_everifyChecking=false;if(errEl)errEl.textContent='コードの有効期限が切れました。もう一度お送りします';await goEmailVerify();return;}
  }catch(e){
    _everifyChecking=false;
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent='確認する →';}
    if(errEl)errEl.textContent='通信に失敗しました。もう一度お試しください';return;
  }
  if(ok){
    markEmailVerified();
    if(S.profile){
      await DB.from('profiles').update({email_verified:true}).eq('user_id',S.user.id);
      S.profile.email_verified=true;
      go('splash');
    }else{
      S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};
      go('profile_new');
    }
  }else{
    _everifyChecking=false;
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent='確認する →';}
    if(errEl)errEl.textContent='コードが違います';
  }
}

async function restartSignUpWithNewEmail(){

// LINE連携が完了した後の共通処理。BAN照合してから先へ進む
async function afterLineLinked(lineUserId){
  var banned=await isLineBlacklisted(lineUserId);
  if(banned){
    await DB.auth.signOut();
    S.user=null;S.profile=null;S.registration=null;S.match=null;
    alert('ご利用いただけません。利用規約に違反したため、アカウントの作成を制限しています。');
    go('splash');
    return;
  }
  // 【順序を入れ替え 2026/8/22】LINE連携が先になったため、
  //   連携が終わった時点では本人確認がまだ済んでいないことがある。
  //   その場合は本人確認へ送る。済んでいればトップへ。
  var st=await getIdVerifyStatus();
  if(st!=='approved'){
    if(!st||st==='none'){ go('id_verify'); }
    else{ go('id_verify_pending'); }
    return;
  }
  S._showWelcomeToast=true;
  go('splash');
  maybeShowTicketGift();
}

async function checkLineLinkNow(){
  var res=await DB.from('profiles').select('line_user_id').eq('user_id',S.user.id).single();
  if(res.data&&res.data.line_user_id){
    if(S._lineLinkTimer){clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;}
    if(S.profile)S.profile.line_user_id=res.data.line_user_id;
    await afterLineLinked(res.data.line_user_id);
  }else{
    alert('まだ連携が確認できていません。\n\n番号を送っても進まない場合は、そのLINEアカウントが既に別のNomi Goアカウントで使われている可能性があります。');
  }

function startLineLinkPolling(){
  if(S._lineLinkTimer)clearInterval(S._lineLinkTimer);
  S._lineLinkTimer=setInterval(async function(){
    if(S.screen!=='line_connect'){clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;return;}
    var res=await DB.from('profiles').select('line_user_id').eq('user_id',S.user.id).single();
    if(res.data&&res.data.line_user_id){
      clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;
      if(S.profile)S.profile.line_user_id=res.data.line_user_id;
      await afterLineLinked(res.data.line_user_id);
    }
  },3000);
}

  S.pf={nickname:S.profile.nickname,age:String(S.profile.age),gender:S.profile.gender,job:S.profile.job,smoke:S.profile.smoke,alcohol:S.profile.alcohol,tags:(S.profile.tags||[]).slice()};

async function saveProfileEdit(){
  var p=S.pf;
  if(!p.nickname||!p.gender||!p.job||p.smoke===null||p.alcohol===null){S.error='すべての項目を入力してください';re('profile_edit');return;}
  if(p.gender==='male'&&!p.photoFile&&!(S.profile&&S.profile.photo_url)){S.error='男性はご本人の顔写真の登録が必須です';re('profile_edit');return;}
  go('loading');
  var photoUrl=S.profile.photo_url;
  if(p.photoFile){
    var uploaded=await uploadProfilePhoto(S.user.id,p.photoFile);
    if(uploaded)photoUrl=uploaded;
  }
  var upd=await DB.from('profiles').update({nickname:p.nickname,gender:p.gender,job:p.job,smoke:p.smoke,alcohol:p.alcohol,photo_url:photoUrl,tags:p.tags||[],updated_at:new Date().toISOString()}).eq('user_id',S.user.id);
  if(upd.error){S.error=friendlyError(upd.error,'保存に失敗しました。もう一度お試しください。');re('profile_edit');return;}
  S.profile.nickname=p.nickname;S.profile.gender=p.gender;S.profile.job=p.job;S.profile.smoke=p.smoke;S.profile.alcohol=p.alcohol;S.profile.photo_url=photoUrl;S.profile.tags=p.tags||[];
  go('splash');
}

function waitH(){
  var lineConnected=!!(S.profile&&S.profile.line_user_id);
  var showLineCta=!!S._waitShowLineCta&&!lineConnected;
  var rm=remainMinutes();
  var expired=(rm!=null&&rm<=0);

  var rows='';
  if(lineConnected){
    rows+=waitRowH('🔔','アプリは閉じて大丈夫です',nb('マッチしたら、')+nb('LINEでお知らせします。'));
  }
  rows+=poolLineH();
  var rowsHtml=(!expired&&rows)?'<div class="wait-info">'+rows+'</div>':'';

  var lineCtaHtml='';
  if(showLineCta&&!expired){
    lineCtaHtml='<div style="margin:14px 20px 0;padding:16px;background:var(--card);border:1.5px solid var(--wine);border-radius:14px">'
      +'<div style="font-size:14px;color:var(--cream);font-weight:800;line-height:1.5;margin-bottom:5px">LINEで通知を受け取る</div>'
      +'<div style="font-size:11.5px;color:var(--muted);line-height:1.7">'+nb('連携しておけば、')+nb('アプリを閉じていても通知が届きます。')+'</div>'
      +'<button class="btn btn-wine" style="padding:12px;margin-top:11px" onclick="goLineConnect()">連携する →</button>'
      +'</div>';
  }

  // 条件は4行の表ではなく、1行のタグにまとめる。画面の半分を占めていた領域を圧縮する。
  // タグは値だけで意味が通るため、絵文字は付けない。
  // 絵文字は「その行が何の話か」を示すアイコンとしてだけ使う（情報行の2つ）。
  var chips=[];
  if(S.form.area)chips.push(areaName(S.form.area));
  if(S.form.slot)chips.push(S.form.slot+(S.form.slot==='今すぐ'&&S.form.duration_pref?'・'+S.form.duration_pref:''));
  if(S.form.drink_style)chips.push(S.form.drink_style);
  chips.push(S.form.mode==='2v2'?'2対2':'1対1');
  var chipsHtml='<div class="cond-wrap"><div class="cond-label">今回の条件</div><div class="cond-row">'
    +chips.map(function(c){return '<span class="cond-chip">'+c+'</span>';}).join('')+'</div></div>';

  // 状態を示す表示は1つに絞る。以前は「マッチング中」が3か所に出て煩雑だった。
  var pill=expired
    ?'<span class="wait-pill" style="background:rgba(244,233,220,.08);border-color:var(--border);color:var(--muted)">受付終了</span>'
    :'<span class="wait-pill"><span class="wait-dot"></span>'+(rm!=null?'あと'+(rm>=60?(Math.floor(rm/60)+'時間'+(rm%60?(rm%60)+'分':'')):(rm+'分'))+'で自動終了':'募集中')+'</span>';

  return '<div class="screen"><div class="hdr"><button class="hdr-back" onclick="go(\'splash\')">← トップに戻る</button><div class="hdr-info"><div class="hdr-step">募集の状況</div><div class="hdr-title">'+(expired?'受付を終了しました':'募集中')+'</div></div></div><div class="body">'
    +'<div style="background:var(--hero);padding:26px 20px 24px;text-align:center">'
      +pill
      +'<div style="font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.35;margin:14px 0 8px">'+(expired?'募集を<br>終了しました':'今夜の相手を<br>探しています')+'</div>'
      +(expired
        ?'<div style="font-size:12.5px;color:rgba(237,229,224,.6);line-height:1.7">'+nb('時間が経ちすぎたお相手と')+nb('マッチしないための仕組みです。')+'</div>'
        :'<div id="wait-msg-text" style="font-size:12.5px;color:rgba(237,229,224,.6);line-height:1.6;min-height:20px">'+WAIT_MESSAGES[0]+'</div>')
    +'</div>'
    +(expired
      ?'<div style="padding:20px 20px 0"><button class="btn btn-wine" style="padding:15px;font-size:15px" onclick="cancelReg()">もう一度募集する →</button></div>'
      :rowsHtml+lineCtaHtml)
    +chipsHtml
    +(expired?''
      :'<div style="padding:6px 20px 28px;text-align:center">'
        +'<button style="background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:12px" onclick="cancelReg()">募集をキャンセルする</button>'
        +'<div style="font-size:11.5px;color:var(--lgray);line-height:1.7;margin-top:2px">'+nb('マッチが成立する前のキャンセルは')+nb('無料です。')+'</div>'
      +'</div>')
    +'</div></div>';

async function goSplashFromMatched(){
  if(S.match&&S.matchMembers.length===0){
    await loadMatchMembers();
  }
  await syncReportStatus();
  var savedMatch=S.match;
  var savedReg=S.registration;
  var savedMembers=S.matchMembers.slice();
  go('splash');
  if(savedMatch&&savedReg&&savedReg.status==='matched'){
    S.match=savedMatch;
    S.registration=savedReg;
    S.matchMembers=savedMembers;
    render();
  }
}

function goNoShowReport(){
  if(!confirm('相手が待ち合わせ場所に来なかったことを運営へ報告しますか？')){return;}
  var opponent=S.matchMembers.find(function(m){return m.user_id!==S.user.id;});
  S._reportTargetUserId=opponent?opponent.user_id:null;
  S._reportPresetReason='無断キャンセル';
  go('report');
}

  var reportBanner=S._hasReported?'<div style="padding:8px 16px;background:rgba(204,64,64,.1);border-bottom:1px solid rgba(204,64,64,.2);font-size:11px;color:var(--red);text-align:center">通報済み：運営が内容を確認中です</div>':'';
  return '<div class="screen" style="overflow:hidden"><div class="hdr"><button class="hdr-back" onclick="go(\'matched\')">← 戻る</button><div class="hdr-info"><div class="hdr-step">チャット</div></div><button style="background:transparent;color:var(--muted);border:1px solid var(--border);font-size:12px;padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer" onclick="go(\'review\')">飲み終わった</button></div>'+reportBanner+finishReminderBanner()+'<div class="chat-wrap"><div class="chat-msgs" id="chatmsgs">'+msgsHtml+'</div><div class="chat-input"><input class="chat-inp" id="cinput" type="text" placeholder="メッセージを送る..." onkeydown="if(event.key===\'Enter\')sendMsg()"><button class="chat-send" onclick="sendMsg()">↑</button></div></div></div>';
}

function reviewH(){
  var isLow=S.reviewStars>0&&S.reviewStars<=2;
  var checks=isLow?REVIEW_TAGS_LOW:REVIEW_TAGS;
  var otherIdx=checks.length-1;
  var starsHtml=[1,2,3,4,5].map(function(n){
    var gid='starGrad'+n,sid='starShadow'+n;
    var svg='<svg width="42" height="42" viewBox="0 0 24 24"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFE9B0"/><stop offset="55%" stop-color="var(--gold)"/><stop offset="100%" stop-color="#A9701E"/></linearGradient><filter id="'+sid+'" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#000" flood-opacity="0.65"/></filter></defs><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" fill="'+(n<=S.reviewStars?'url(#'+gid+')':'transparent')+'" stroke="var(--gold)" stroke-width="1.5" filter="url(#'+sid+')"/></svg>';
    return '<button class="star-btn" onclick="setReviewStars('+n+')">'+svg+'</button>';
  }).join('');
  var checksHtml=checks.map(function(c,i){return '<button class="tag-chip '+(S.reviewChecks[i]?'on':'')+'" onclick="S.reviewChecks['+i+']=!S.reviewChecks['+i+'];re(\'review\')">'+c+'</button>';}).join('');
  var otherInput=S.reviewChecks[otherIdx]?'<div style="padding:0 20px 16px"><input class="inp" id="review-other-inp" type="text" placeholder="自由に入力してください" maxlength="50" value="'+(S.reviewOtherText||'')+'" oninput="S.reviewOtherText=this.value;updateReviewSubmitBtn()"></div>':'';
  var checksSection=S.reviewStars>0?'<div style="padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px">'+checksHtml+'</div>'+otherInput:'';
  var anyTagSelected=S.reviewChecks.some(function(c){return c;});
  var otherOk=!S.reviewChecks[otherIdx]||(S.reviewOtherText&&S.reviewOtherText.trim().length>0);
  var canSubmit=S.reviewStars>0&&anyTagSelected&&otherOk&&!_reviewSubmitting;
  var submitBtnLabel=_reviewSubmitting?'送信中...':'評価を送信する';
  return '<div class="screen"><div class="hdr"><button class="hdr-back" onclick="go(\'chat\')">← 戻る</button><div class="hdr-info"><div class="hdr-title">今夜の評価</div></div></div><div class="body"><div style="padding:28px 20px 20px;text-align:center;border-bottom:1px solid var(--border2)"><div style="font-size:32px;margin-bottom:12px">🍺</div><div style="font-size:20px;font-weight:800;margin-bottom:6px">お疲れ様でした！</div></div><div style="padding:20px 20px 0;text-align:center"><div class="sec-label" style="padding:0 0 14px;text-align:center">総合評価</div><div style="display:flex;justify-content:center;gap:8px">'+starsHtml+'</div></div>'+checksSection+'</div><div class="ftr"><button class="btn btn-wine" id="review-submit-btn" '+(canSubmit?'':'disabled ')+'onclick="confirmSubmitReview()">'+submitBtnLabel+'</button></div></div>';
}

function updateRecruitSubmitBtn(){
  var btn=document.getElementById('recruit-submit-btn');
  if(!btn)return;
  var f=S.form;
  var isPair=f.mode==='2v2';
  // 2対2の条件は、お友だちの参加が確定しているかどうか（年齢の入力は廃止した）
  var allOk=f.area&&f.slot&&f.drink_style&&f.purpose&&(!isPair||!!(S._pair&&S._pair.status==='accepted'&&S._pair.partnerVerified));
  btn.disabled=!(allOk&&!_isSubmitting);
}

function updateReviewSubmitBtn(){
  var btn=document.getElementById('review-submit-btn');
  if(!btn)return;
  var isLow=S.reviewStars>0&&S.reviewStars<=2;
  var checks=isLow?REVIEW_TAGS_LOW:REVIEW_TAGS;
  var otherIdx=checks.length-1;
  var anyTagSelected=S.reviewChecks.some(function(c){return c;});
  var otherOk=!S.reviewChecks[otherIdx]||(S.reviewOtherText&&S.reviewOtherText.trim().length>0);
  var canSubmit=S.reviewStars>0&&anyTagSelected&&otherOk&&!_reviewSubmitting;
  btn.disabled=!canSubmit;
}

function termsH(){

+'本利用規約（以下「本規約」といいます。）は、TRP（以下「運営者」といいます。）が提供するサービス「Nomi Go」（以下「本サービス」といいます。）の利用条件を定めるものです。ユーザーは、本規約に同意のうえ、本サービスを利用するものとします。\n\n第1条（定義）\n1.「ユーザー」とは、本規約に同意し、本サービスの利用登録を行った個人をいいます。\n2.「チケット」とは、マッチの成立に使用するため、あらかじめ購入する電子的な利用権をいいます。\n3.「マッチ」とは、本サービスのしくみにより、ユーザー同士の組み合わせが成立することをいいます。\n\n第2条（サービスの概要）\n1. 本サービスは、ユーザー同士が飲食を伴う交流の機会を持つための、マッチングの機会を提供するものです。\n2. 運営者は、マッチングの機会を提供するにとどまり、実際に会うこと、会った結果、およびその後の関係について、いかなる保証も行いません。\n3. 本サービスは、飲食店の予約・手配・仲介を行うものではありません。\n\n第3条（利用資格）\n1. 次のすべてを満たす方に限り、本サービスを利用できます。\n・満20歳以上であること\n・本規約に同意していること\n・暴力団その他の反社会的勢力に該当せず、またこれらと関係を有しないこと\n・過去に本サービスの利用停止措置を受けていないこと\n2. 18歳未満の方は、本サービスを利用できません。\n3. 運営者は、公的な本人確認書類および顔写真により、年齢および本人性を確認します。確認ができない場合、利用をお断りすることがあります。\n\n第4条（アカウント数の制限）\n1. 本サービスの利用は、お一人につき1アカウントに限ります。同一人物が複数のアカウントを作成することを禁止します。\n2. 運営者は、本名・生年月日・LINEの識別情報等により同一人物と判断した場合、アカウントの作成を制限し、または既存のアカウントを停止することがあります。\n\n第5条（登録情報および本人確認）\n1. ユーザーは、真実かつ正確な情報を登録するものとします。\n2. 本人確認のために提出する書類は、有効な公的身分証に限ります。個人番号（マイナンバー）が記載された面は提出しないでください。誤って提出された場合、運営者は当該画像を速やかに削除します。\n3. 本名および生年月日は、年齢確認・本人確認・不正防止のためにのみ使用し、他のユーザーには表示しません。\n\n第6条（禁止事項）\nユーザーは、次の行為を行ってはなりません。\n・虚偽の情報を登録する行為、本人確認において虚偽の申告をする行為\n・他のユーザーへの迷惑行為、誹謗中傷、ハラスメント\n・営業、勧誘、宗教活動、政治活動、連鎖販売取引その他の宣伝を目的とする利用\n・金銭の要求、金銭の授受を伴う交際の申し込み、売春・買春につながる行為\n・なりすまし行為\n・複数アカウントの作成、および利用停止措置を回避する目的での再登録\n・他のユーザーの個人情報を、本人の同意なく第三者に開示する行為\n・本サービスで知り得た情報を、本サービスの目的以外に利用する行為\n・20歳未満の者への飲酒の勧誘、飲酒運転、飲酒の強要\n・法令または公序良俗に反する行為\n・本サービスの運営を妨害する行為、不正アクセス、自動化ツールの使用\n\n第7条（マッチングおよびユーザー間の責任）\n1. マッチの成立は、待ち合わせや飲食の約束の成立を保証するものではありません。\n2. 実際に会うかどうか、会った際の行動、費用の負担、およびその後の連絡は、すべてユーザー自身の判断と責任において行うものとします。\n3. 飲酒は各自の責任において行うものとします。\n4. ユーザー間で生じた紛争は、当事者間で解決するものとします。ただし、運営者は通報を受けた場合、第10条の措置をとることがあります。\n\n第8条（チケットおよび料金）\n1. 女性ユーザーは無料で利用できます。男性ユーザーはチケットを購入して利用します。\n2. チケットの価格その他の取引条件は、「特定商取引法に基づく表記」に定めるとおりです。\n3. チケットは、マッチの成立時に1枚消費されます。マッチが成立しなかった場合、チケットは消費されません。\n4. チケットの有効期限は、購入日から180日です。有効期限を過ぎた未使用のチケットは失効し、返金されません。\n5. チケットを現金に換えること、他のユーザーに譲渡または貸与することはできません。\n\n第9条（返金）\n1. ユーザーのご都合による返金は行いません。\n2. 本サービスのシステム不具合により、購入したチケットが正常に利用できなかった場合、運営者は内容を確 いての権利は、ユーザーに帰属します。ただし運営者は、本サービスの提供、不正利用の防止および紛争への対応のために必要な範囲で、これらを保存・確認・利用することができます。\n\n第16条（個人情報の取扱い）\n個人情報の取扱いは、別途定めるプライバシーポリシーに従います。\n\n第17条（通知・連絡）\n1. 運営者からユーザーへの連絡は、本サービス内の表示、登録されたメールアドレスへの送信、またはLINEを連携している場合はLINEのメッセージにより行います。\n2. ユーザーから運営者へのお問い合わせは、本サービス内のお問い合わせ機能により受け付けます。受付時間は11:00から23:00までとし、いただいた順に回答します。受付時間外のお問い合わせは、翌日以降の回答となります。内容の確認を要する場合、回答までに日数をいただくことがあります。\n\n第18条（本規約の変更）\n1. 運営者は、民法第548条の4の定めに従い、本規約を変更することがあります。\n2. 変更を行う場合、運営者は、変更後の内容および効力発生時期を、効力発生時期の7日前までに本サービス内で告知します。ユーザーに不利益となる重要な変更を行う場合は、30日前までに告知します。\n3. 告知の後、ユーザーが本サービスの利用を継続した場合、変更に同意したものとみなします。\n\n第19条（分離可能性）\n本規約のいずれかの条項が無効または執行不能と判断された場合であっても、その他の条項は引き続き効力を有します。\n\n第20条（準拠法および管轄）\n1. 本規約は日本法に準拠します。\n2. 本サービスに関して運営者とユーザーとの間に紛争が生じた場合、運営者の所在地を管轄する地方裁判所を第一審の合意管轄裁判所とします。ただし、消費者契約に関する法令により、ユーザーの住所地を管轄する裁判所に訴えを提起することを妨げるものではありません。\n\n制定日：2026年7月31日'

function goFaqBot(){
  S.faqMsgs=[{type:'bot',content:'こんにちは！よくある質問にお答えします。気になることを聞いてみてください。'}];
  go('faqbot');
}

function findFaqAnswer(text){
  for(var i=0;i<FAQ_QA.length;i++){
    var kws=FAQ_QA[i].keywords;
    for(var j=0;j<kws.length;j++){
      if(text.indexOf(kws[j])!==-1)return FAQ_QA[i].answer;
    }
  }
  return null;
}

function sendFaqMsg(){
  var inp=document.getElementById('faq-input');
  var txt=inp?inp.value.trim():'';
  if(!txt)return;
  inp.value='';
  S.faqMsgs.push({type:'user',content:txt});
  var answer=findFaqAnswer(txt);
  if(answer){
    S.faqMsgs.push({type:'bot',content:answer});
  }else{
    S.faqMsgs.push({type:'bot',content:'申し訳ありません、うまくお答えできませんでした。',showInquiryBtn:true});
    DB.from('faq_misses').insert({user_id:S.user?S.user.id:null,question:txt}).then(function(){}).catch(function(){});
  }
  re('faqbot');
  setTimeout(function(){var el=document.querySelector('.chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

function tapFaqQuestion(label,answer){
  S.faqMsgs.push({type:'user',content:label});
  S.faqMsgs.push({type:'bot',content:answer});
  re('faqbot');
  setTimeout(function(){var el=document.querySelector('.chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

function faqBotH(){
  var msgsHtml=(S.faqMsgs||[]).map(function(m){
    var isBot=m.type==='bot';
    var inquiryBtn=m.showInquiryBtn?'<button style="margin-top:8px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--wine);background:transparent;color:var(--wine);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer" onclick="go(\'inquiry\')">お問い合わせはこちら →</button>':'';
    return '<div class="msg-row '+(isBot?'':'mine')+'">'+(isBot?'<div class="msg-av" style="background:var(--wine-bg);color:var(--wine)">🤖</div>':'')+'<div><div class="msg-bubble" style="background:'+(isBot?'var(--card)':'var(--wine)')+';color:'+(isBot?'var(--cream)':'#fff')+'">'+escapeHtml(m.content)+'</div>'+inquiryBtn+'</div></div>';
  }).join('');
  var quickList=[
    {label:'料金はいくら?',ans:FAQ_QA[0].answer},
    {label:'キャンセルしたら?',ans:FAQ_QA[2].answer},
    {label:'2対2ってどういうこと?',ans:FAQ_QA[6].answer},
    {label:'対応エリアは?',ans:FAQ_QA[4].answer},

}

// ===== 背景に上品な泡を漂わせる（LPと同じ演出） =====
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var layer=document.createElement('div');
  layer.id='ngo-fx';
  document.body.appendChild(layer);
  for(var i=0;i<7;i++){
    var b=document.createElement('div');
    b.className='ngo-bubble';
    var size=4+Math.random()*9;
    b.style.width=size+'px';b.style.height=size+'px';
    b.style.left=(5+Math.random()*90)+'%';
    b.style.animationDuration=(10+Math.random()*10)+'s';
    b.style.animationDelay=(Math.random()*10)+'s';
    layer.appendChild(b);
  }
})();

// ===== マッチ成立の瞬間に乾杯エフェクトを一度だけ出す =====
var _lastScreenForFx='';
var _origRender=render;
render=function(){
  _origRender();
  if(S.screen==='matched'&&_lastScreenForFx!=='matched'&&_lastScreenForFx!=='chat'&&_lastScreenForFx!=='review'&&_lastScreenForFx!=='report'){
    showCheersFx();
  }
  _lastScreenForFx=S.screen;
};
function showCheersFx(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var wrap=document.createElement('div');
  wrap.className='cheers-burst';
  var html='<div class="glass">\ud83e\udd42</div>';
  for(var i=0;i<10;i++){
    var ang=(Math.PI*2/10)*i;
    var dist=70+Math.random()*60;
    html+='<div class="spark" style="--dx:'+Math.round(Math.cos(ang)*dist)+'px;--dy:'+Math.round(Math.sin(ang)*dist)+'px"></div>';
  }
  wrap.innerHTML=html;
  document.body.appendChild(wrap);
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);},1500);
}
