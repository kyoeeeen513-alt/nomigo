// 【2026/9/8 追加・No.296】退会・利用停止のアカウントを締め出す。
//
//   お知らせを出してからログアウトする。
//   黙ってログアウトすると「勝手に落ちた」という問い合わせになるため、
//   必ず理由を伝える。
//
//   'banned'（運営による利用停止）と 'withdrawn'（本人の申請による退会）で
//   文面を分ける。退会した方に「規約違反」と表示してはいけない。
async function handleDeactivated(status){
  var msg=(status==='banned')
    ? 'このアカウントはご利用を停止しています。\n\nお心当たりのない場合は、info@nomi-go.jp までご連絡ください。'
    : '退会のお手続きが完了しています。\n\nご利用ありがとうございました。\nまたご利用になりたくなったときは、あらためてご登録いただけます。';
  try{alert(msg);}catch(e){}
  try{await DB.auth.signOut();}catch(e){}
  S.user=null;S.profile=null;S.registration=null;S.match=null;
  go('splash');
}

async function loadProfile(){
  // 起動時の認証通知と通常処理が重なっても、プロフィール取得は1本だけにする。
  if(S._profileLoadPromise)return S._profileLoadPromise;
  var task=_loadProfileOnce();
  S._profileLoadPromise=task;
  try{return await task;}
  finally{if(S._profileLoadPromise===task)S._profileLoadPromise=null;}
}

async function _loadProfileOnce(){
  S._profileLoadFailed=false;
  var res=null;
  // LINE内ブラウザなどで通信が一瞬切れても、登録画面へ戻さず短時間だけ再試行する。
  // maybeSingle は未登録者の「0件」を正常として扱い、本当の通信失敗と区別する。
  for(var attempt=0;attempt<3;attempt++){
    res=await DB.from('profiles').select(PROFILE_COLS_SELF).eq('user_id',S.user.id).maybeSingle();
    if(!res.error)break;
    var inactiveNow=String(res.error.message||'').match(/account_inactive:(withdrawn|banned)/);
    if(inactiveNow)break;
    if(attempt<2)await new Promise(function(resolve){setTimeout(resolve,attempt===0?400:1000);});
  }
  // DB側で退会・利用停止アカウントを止めた場合も、単なる通信エラーとして
  // 登録画面へ進めず、理由を表示してこの端末のログイン情報を消す。
  if(res.error){
    var inactiveMatch=String(res.error.message||'').match(/account_inactive:(withdrawn|banned)/);
    if(inactiveMatch){
      await handleDeactivated(inactiveMatch[1]);
      return;
    }
    // 通信・DBの一時エラーを「プロフィール未作成」と扱うと、登録済みの人が
    // メール認証画面へ戻され、プロフィール編集も押せなくなる。
    S._profileLoadFailed=true;
    S.profile=null;
    return;
  }
  S.profile=res.data;
  if(!S.profile)return;

  // 【2026/9/8 追加・No.296】退会・利用停止のアカウントはここで止める。
  //   運営が管理ページから退会させると profiles.account_status が
  //   'withdrawn'（本人の申請による退会）または 'banned'（運営による利用停止）
  //   に変わる。その状態でアプリを使わせない。
  //
  //   なぜログインそのものではなくここで止めるか：
  //   ログイン自体はSupabaseの認証が行っており、こちらからは止められない。
  //   プロフィールを読んだ直後に必ずここを通るため、
  //   募集・マッチ・チャットのどの画面へ進む前にも確実に止まる。
  //
  //   'active' 以外のときだけ止める書き方にしてある。
  //   列を追加する前のデータベースでは undefined が返るが、
  //   その場合は通常どおり使えるため、このファイルを先にデプロイしても
  //   既存の利用者に影響は出ない。
  if(S.profile.account_status&&S.profile.account_status!=='active'){
    await handleDeactivated(S.profile.account_status);
    return;
  }

  var matchedReg=await DB.from('registrations').select(REG_COLS).eq('user_id',S.user.id).eq('status','matched').order('created_at',{ascending:false}).limit(1).single();
  if(matchedReg.data&&matchedReg.data.match_id){
    S.registration=matchedReg.data;
    S.form={area:matchedReg.data.area_id,slot:matchedReg.data.slot,mode:matchedReg.data.mode,drink_style:matchedReg.data.drink_style,purpose:matchedReg.data.purpose,ok_nodrink:matchedReg.data.ok_nodrink,duration_pref:matchedReg.data.duration_pref,timing:matchedReg.data.timing,age_min:matchedReg.data.age_min,age_max:matchedReg.data.age_max,age_any:matchedReg.data.age_any};
    var m=await DB.from('matches').select('*').eq('id',matchedReg.data.match_id).single();
    if(m.data)S.match=m.data;
    await loadMatchMembers();
    return;
  }

  // 2対2の組の状態も読み込む。
  // これを読まないと、アプリを閉じて開き直したときに
  // 「お友だちの参加が確定していない」と誤って表示されてしまう。
  await loadPairStatus();

  var reg=await DB.from('registrations').select(REG_COLS).eq('user_id',S.user.id).eq('status','waiting').order('created_at',{ascending:false}).limit(1).single();
  if(reg.data){
    S.registration=reg.data;
    S.form={area:reg.data.area_id,slot:reg.data.slot,mode:reg.data.mode,drink_style:reg.data.drink_style,purpose:reg.data.purpose,ok_nodrink:reg.data.ok_nodrink,duration_pref:reg.data.duration_pref,timing:reg.data.timing,age_min:reg.data.age_min,age_max:reg.data.age_max,age_any:reg.data.age_any};
  }
}

// ===== メール確認の状態 =====
// 【重要】これはセキュリティ上の証明ではない。
// 確認コードはブラウザ内で生成され、照合もブラウザ内で行っているため、
// メールアドレスの保有を証明するものではない（9月にSupabase標準のメール確認へ移行予定）。
// ここで行っているのは「登録の途中で確認画面をうっかり飛ばせないようにする」ことだけ。
// 打ち間違えたアドレスのまま登録が完了し、パスワード再設定も連絡も届かなくなるのを防ぐ目的。
function emailVerifiedKey(){
  return 'ngo_ev_'+(S.user&&S.user.id?S.user.id:'');
}
function isEmailVerified(){
  // サーバーに問い合わせた結果だけを信じる。
  // 端末内の記録（localStorage）は利用者が自由に書き換えられるため、根拠にしない。
  return S._emailVerified===true;
}
function markEmailVerified(){
  // 確認できた事実はサーバー側（email_verified_users）に記録される。
  // ここでは画面の状態だけを更新する。
  S._emailVerified=true;
}

// メール確認が済んでいるかをサーバーに確認する。ログイン直後に必ず呼ぶ。
async function loadEmailVerified(){
  S._emailVerified=false;
  try{
    var s0=await DB.auth.getSession();
    var tk=s0&&s0.data&&s0.data.session?s0.data.session.access_token:null;
    if(!tk)return;
    var r=await fetch('/api/send-email',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},
      body:JSON.stringify({action:'verify_status'})});
    var j=await r.json();
    S._emailVerified=!!(j&&j.success&&j.verified);
  }catch(e){}
}

async function routeAfterLoad(){
  if(S._profileLoadFailed){
    go('profile_load_error');
    return;
  }
  await loadEmailVerified();
  if(!S.profile){
    // プロフィール未作成＝登録の途中。メール確認を終えていない場合は必ず確認画面へ戻す。
    // 以前は、ログインし直す・再読み込みするだけで確認画面を素通りできていた。
    if(S.user&&!isEmailVerified()){
      go('email_verify');
      return;
    }
    var lastScreen0=sessionStorage.getItem('ngo_screen');
    if(lastScreen0==='email'){
      go('email');
      return;
    }
    if(lastScreen0==='profile_new'&&S.user){
      var savedPf=sessionStorage.getItem('ngo_pf');
      if(savedPf){
        try{S.pf=JSON.parse(savedPf);}catch(e){S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};}
      }else{
        S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};
      }
      go('profile_new');
      return;
    }
    S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};
    go('splash');
    return;
  }
  // LINE未連携のまま再読み込み・別タブ復帰した場合も、トップへ逃がさず
  // 必ずLINE連携画面へ戻す。iPhone/Android/PCで共通の判定にする。
  if(!S.profile.line_user_id){
    await goLineConnect();
    return;
  }
  // LINE連携後にアプリを閉じたり再読み込みした場合も、本人確認が未完了なら
  // ホームへ戻さず必ず登録の続きへ送る。Safari復帰時にタイマーが止まっても
  // 「募集する」を押すまで本人確認が出ない状態を作らない。
  if(S.profile.line_user_id&&S.profile.id_verify_status!=='approved'){
    var onboardingIdStatus=await getIdVerifyStatus();
    if(!onboardingIdStatus||onboardingIdStatus==='none'){go('id_verify');}
    else{go('id_verify_pending');}
    return;
  }
  // LINE通知から開いた募集は、通常のトップより先に応募確認画面へ送る。
  if(S._pendingRecruitmentId){
    await openRecruitmentInviteById(S._pendingRecruitmentId);
    return;
  }
  // 【カード登録の関門を撤去 8/15】
  // 以前はここで、カード未登録の利用者をログインのたびに
  // カード登録画面へ強制的に送っていた。PAY.JPを使う前提の名残であり、
  // CREDIXではカード番号の入力を決済ページ側で行うため不要。
  // 残しておくと動かない画面から先へ進めなくなる。
  if(S.registration&&S.registration.status==='waiting'){
    startPolling();
    go('waiting');
    return;
  }
  if(S.match&&S.registration&&S.registration.status==='matched'){
    await syncReportStatus();
    var lastScreen=sessionStorage.getItem('ngo_screen');
    if(lastScreen==='chat'){
      await initChat();
      go('chat');
    }else if(lastScreen==='review'){
      go('review');
    }else if(lastScreen==='matched'){
      go('matched');
    }else if(lastScreen==='report'){
      var opponentR=S.matchMembers.find(function(m){return m.user_id!==S.user.id;});
      S._reportTargetUserId=opponentR?opponentR.user_id:null;
      go('report');
    }else{
      go('splash');
    }
    return;
  }
  var lastScreen2=sessionStorage.getItem('ngo_screen');
  var restorable=['area_select','mode_select','recruit','profile_edit','drink_profile_setup','terms','privacy','inquiry','faqbot','forgot_password'];
  var recruitFlowScreens=['area_select','mode_select','recruit'];
  var lastActive=parseInt(sessionStorage.getItem('ngo_last_active')||'0');
  var awayMs=Date.now()-lastActive;
  var wasAwayLong=lastActive>0&&awayMs>2*60*1000;
  if(lastScreen2&&recruitFlowScreens.indexOf(lastScreen2)!==-1&&wasAwayLong){
    S.form={area:null,slot:null,drink_style:null,purpose:null,ok_nodrink:false,timing:null,age_min:null,age_max:null,age_any:false};
    go('splash');
    return;
  }
  if(lastScreen2&&restorable.indexOf(lastScreen2)!==-1){
    var savedForm=sessionStorage.getItem('ngo_form');
    if(savedForm){
      try{
        var parsed=JSON.parse(savedForm);
        S.form=Object.assign(S.form,parsed);
      }catch(e){}
    }
    if(lastScreen2==='profile_edit'){
      goProfileEdit();
    }else if(lastScreen2==='drink_profile_setup'){
      S.pf={nickname:S.profile.nickname,age:String(S.profile.age||''),gender:S.profile.gender,job:S.profile.job||null,smoke:S.profile.smoke==null?null:S.profile.smoke,alcohol:S.profile.alcohol==null?null:S.profile.alcohol,tags:(S.profile.tags||[]).slice()};
      go('drink_profile_setup');
    }else if(lastScreen2==='faqbot'){
      if(!S.faqMsgs||!S.faqMsgs.length){goFaqBot();}else{go('faqbot');}
    }else{
      go(lastScreen2);
    }
    return;
  }
  go('splash');
}

// ===== 写真の縮小 =====
// スマホの写真はそのままだと数MBあり、文字データに変換すると一時保存の上限を超える。
// またiPhoneのフォトライブラリの写真はHEIC形式のことがあり、そのままでは表示できない。
// 表示・保存・アップロードのすべてに使えるよう、長辺1200pxのJPEGに縮小してから扱う。
// 縮小に失敗した場合も、必ずcbを呼んで画面の動作を止めない。
function shrinkImage(file,maxSide,quality,cb){
  var done=false,url=null;
  function finish(f,d){
    if(done)return;done=true;
    if(url){try{URL.revokeObjectURL(url);}catch(e){}}
    cb(f,d);
  }
  var guard=setTimeout(function(){finish(null,null);},10000);
  try{
    url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      clearTimeout(guard);
      try{
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h){finish(null,null);return;}
        var scale=Math.min(1,maxSide/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
        var cv=document.createElement('canvas');
        cv.width=cw;cv.height=ch;
        cv.getContext('2d').drawImage(img,0,0,cw,ch);
        var dataUrl=cv.toDataURL('image/jpeg',quality);
        cv.toBlob(function(blob){
          var f=null;
          if(blob){
            try{f=new File([blob],'photo_'+Date.now()+'.jpg',{type:'image/jpeg'});}
            catch(e){f=blob;}
          }
          finish(f,dataUrl);
        },'image/jpeg',quality);
      }catch(e){finish(null,null);}
    };
    img.onerror=function(){clearTimeout(guard);finish(null,null);};
    img.src=url;
  }catch(e){clearTimeout(guard);finish(null,null);}
}

// 【2026/8/27修正 No.180関連】写真を選んだあと画面が固まり、ちらつくという報告への対応。
// 原因は3つあった。
//  ①縮小処理（数MBの写真をJPEGに変換する）に数秒かかるのに、その間の表示が何も
//    変わらないため、押しても効いていないように見えていた。
//  ②縮小が終わったあと re() で画面全体を作り直していた。作り直すと入力欄・
//    画像・タグがすべて描き直されるため、一瞬の白い点滅（ちらつき）が起き、
//    さらにスクロール位置と入力欄の focus が失われていた。
//  ③re() の前に saveInputs() を呼んでいなかったため、写真を選ぶと、それまでに
//    入力した本名・生年月日・ニックネーム・年齢が消えていた（画面の作り直しで
//    S.pf の値に戻るため）。これが登録途中での離脱につながっていた可能性がある。
// 対応：先に入力内容を保存し、処理中はボタンを「読み込み中…」にして押せなくし、
// 成功時は画面全体を作り直さずプレビュー画像だけを差し替える。
// 失敗時のみ、エラー文を出すために従来どおり作り直す（頻度が低いため）。
function handlePhotoSelect(inputEl,screenName){
  var file=inputEl.files&&inputEl.files[0];
  if(!file)return;
  // 入力済みの文字を先に控える。これをしないと画面の作り直しで消える
  saveInputs();
  var btn=document.getElementById('pf-pick-btn');
  var btnText=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.style.opacity='.55';btn.textContent='読み込み中…';}
  shrinkImage(file,1200,0.85,function(smallFile,dataUrl){
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent=btnText;}
    if(dataUrl){
      S.pf.photoFile=smallFile||file;
      S.pf.photoPreview=dataUrl;
      S.error='';
      sessionStorage.setItem('ngo_pf',JSON.stringify(S.pf));
      // 画面全体は作り直さず、丸いプレビューの中身だけを入れ替える。
      // ちらつきが起きず、スクロール位置も入力欄の状態もそのまま残る。
      var wrap=document.getElementById('pf-prev-wrap');
      if(wrap){
        wrap.innerHTML='<img src="'+dataUrl+'" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:block">';
      }else{
        re(screenName);
      }
    }else{
      // 読み込めない形式・壊れた画像の場合。画面は必ず動かし続ける
      S.pf.photoFile=null;
      S.pf.photoPreview=null;
      S.error='この写真は読み込めませんでした。別の写真を選ぶか、その場で撮影してください。';
      re(screenName);
    }
  });
}

// 【顔の自動判定は撤去 8/15】
// プロフィール写真に人の顔が写っているかを端末上で判定する仕組みを一度入れたが、
// 判定用のプログラムとモデルの読み込みに時間がかかり、その間ほかの項目にも
// 触れなくなった。初めて使う人にはバグと受け取られるため撤去した。
// プロフィール写真は一次的なものであり、本人性の確認は
// 年齢確認は身分証画像の目視確認が担う。
// 体験を損なってまでここで判定する必要はないと判断した。

async function uploadProfilePhoto(userId,file){
  if(!file)return null;

  async function send(accessToken){
    var controller=typeof AbortController!=='undefined'?new AbortController():null;
    var timeoutId=setTimeout(function(){if(controller)controller.abort();},45000);
    try{
      var response=await fetch('/api/profile-photo-upload',{
        method:'POST',
        headers:{
          'Authorization':'Bearer '+accessToken,
          'Content-Type':file.type||'image/jpeg'
        },
        body:file,
        signal:controller?controller.signal:undefined
      });
      var data={};
      try{data=await response.json();}catch(e){}
      return {ok:response.ok,status:response.status,data:data};
    }finally{
      clearTimeout(timeoutId);
    }
  }

  try{
    var sessionResult=await DB.auth.getSession();
    var session=sessionResult.data&&sessionResult.data.session;
    if(!session||!session.access_token)throw new Error('session_expired');
    var result=await send(session.access_token);
    if(result.status===401){
      var refreshed=await DB.auth.refreshSession();
      var fresh=refreshed.data&&refreshed.data.session;
      if(!fresh||!fresh.access_token)throw new Error('session_expired');
      result=await send(fresh.access_token);
    }
    if(!result.ok)throw new Error((result.data&&result.data.error)||'profile_photo_upload_failed');
    if(!result.data||!result.data.publicUrl)throw new Error('profile_photo_url_missing');
    return result.data.publicUrl;
  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('profile_photo_upload_timeout');
    throw e;
  }
}

// ===== エラー文の日本語化 =====
// DBやネットワークが返す英語のメッセージを、そのまま利用者に見せない。
// 内部構造を外に見せないためでもある。
function friendlyError(err,fallback){
  var m='';
  try{m=String((err&&(err.message||err.msg))||err||'');}catch(e){}
  var low=m.toLowerCase();
  // 【2026/8/24追加】以下の3つは、これまで下の「session」判定に巻き込まれて
  //   「ログインの有効期限が切れました」と誤って表示されていた。
  //   実際の原因と案内が食い違い、利用者が何をすればよいか分からなくなる。
  //   sessionの判定より前に置くこと。
  if(low.indexOf('should be different')!==-1||low.indexOf('same_password')!==-1){
    return '今お使いのパスワードと同じです。別のパスワードを入力してください。';
  }
  if(low.indexOf('aal2')!==-1||low.indexOf('insufficient_aal')!==-1||low.indexOf('mfa')!==-1){
    return 'このアカウントは二段階認証が設定されているため、こちらではパスワードを変更できません。お問い合わせください。';
  }
  if(low.indexOf('password should be at least')!==-1||low.indexOf('weak_password')!==-1){
    return 'パスワードが短すぎます。6文字以上で入力してください。';
  }
  if(low.indexOf('permission denied')!==-1||low.indexOf('row-level security')!==-1||low.indexOf('42501')!==-1){
    return 'この操作は許可されていません。時間をおいてもう一度お試しください。';
  }
  if(low.indexOf('duplicate key')!==-1||low.indexOf('23505')!==-1){
    return 'すでに登録があります。内容をご確認ください。';
  }
  if(low.indexOf('failed to fetch')!==-1||low.indexOf('networkerror')!==-1||low.indexOf('timeout')!==-1||low.indexOf('load failed')!==-1){
    return '通信に失敗しました。電波の良い場所でもう一度お試しください。';
  }
  if(low.indexOf('jwt')!==-1||low.indexOf('token')!==-1||low.indexOf('session')!==-1){
    return 'ログインの有効期限が切れました。もう一度ログインしてください。';
  }
  return fallback||'うまくいきませんでした。もう一度お試しください。';
}

function calculateProfileAge(birthdate){
  if(!birthdate)return null;
  var bd=new Date(birthdate+'T00:00:00');
  if(isNaN(bd.getTime()))return null;
  var today=new Date();
  var age=today.getFullYear()-bd.getFullYear();
  var mdiff=today.getMonth()-bd.getMonth();
  if(mdiff<0||(mdiff===0&&today.getDate()<bd.getDate()))age--;
  return age;
}
function profileBasicIssue(p){
  if(!p.realname||!p.realname.trim())return {message:'本名を入力してください',checkpoint:'real_name'};
  if(!p.birthdate)return {message:'生年月日を入力してください',checkpoint:'birthdate'};
  var age=calculateProfileAge(p.birthdate);
  if(age===null)return {message:'生年月日を正しく入力してください',checkpoint:'birthdate_invalid'};
  p.age=String(age);
  if(age<20)return {message:'Nomi Goは20歳以上の方がご利用いただけます',checkpoint:'under_20'};
  if(!p.nickname||!p.nickname.trim())return {message:'ニックネームを入力してください',checkpoint:'nickname'};
  if(!p.gender)return {message:'性別を選択してください',checkpoint:'gender'};
  if(PREFECTURES.indexOf(p.residence_prefecture)===-1)return {message:'居住都道府県を選択してください',checkpoint:'residence_prefecture'};
  if(p.gender==='male'&&!p.photoFile)return {message:'男性はご本人の顔写真の登録が必須です',checkpoint:'photo'};
  return null;
}

async function saveProfile(){
  S._jobOpen=false;
  saveInputs();
  var p=S.pf;
  var issue=profileBasicIssue(p);
  if(issue){profileValidationError(1,issue.message,issue.checkpoint);return;}
  if(!p.agreed){profileValidationError(2,'利用規約とプライバシーポリシーへの同意が必要です','terms');return;}
  trackOnboarding('profile_submit',2,'submit');
  go('loading');
  var photoUrl=null;
  try{
    photoUrl=p.photoFile?await uploadProfilePhoto(S.user.id,p.photoFile):null;
  }catch(e){
    setProfileStep(1);
    trackOnboarding('profile_error',1,'photo_upload');
    var photoErr=String(e&&e.message||e||'');
    if(photoErr==='session_expired')S.error='ログインの有効期限が切れました。もう一度ログインしてください。';
    else if(photoErr==='image_too_large')S.error='写真の容量が大きすぎます。別の写真を選んでください。';
    else if(photoErr==='unsupported_image')S.error='この画像形式には対応していません。その場で撮影するか、スクリーンショットを選んでください。';
    else if(photoErr==='profile_photo_upload_timeout')S.error='通信が時間内に完了しませんでした。電波の良い場所でもう一度お試しください。';
    else S.error='写真を保存できませんでした。時間をおいてもう一度お試しください。';
    re('profile_new');
    return;
  }
  // 【チケット枚数と確認レベルは画面から送らない 2026/8/21】
  //   以前はここで ticket_count:1（男性）を送っていたが、
  //   枚数を画面側が決めて送る作りは、送る値を書き換えられると
  //   いくらでもチケットを増やせてしまう。
  //   無料付与を行うかどうかはDB側（app_settings と trg_grant_welcome_ticket）が判断する。
  //   verified_level も同じ理由で送らない。DB側の既定値に任せる。
  var saved=await DB.from('profiles').upsert({user_id:S.user.id,nickname:p.nickname,age:parseInt(p.age),gender:p.gender,residence_prefecture:p.residence_prefecture,job:null,smoke:null,alcohol:null,photo_url:photoUrl,tags:p.tags||[],real_name:p.realname.trim(),birthdate:p.birthdate,email_verified:isEmailVerified(),id_verify_status:'none',updated_at:new Date().toISOString()});
  if(saved.error){
    // 同一人物（本名＋生年月日）での2つ目のアカウント作成は、DB側で禁止している。
    // お一人につき1アカウントという規約（第4条）を、実際に担保するための処理。
    var m=String(saved.error.message||'');
    if(m.indexOf('blacklisted_identity')!==-1){
      S.error='ご利用いただけません。利用規約に違反したため、アカウントの作成を制限しています。';
    }else if(saved.error.code==='23505'||m.indexOf('duplicate key')!==-1||m.indexOf('uniq_profiles_person')!==-1){
      S.error='この氏名・生年月日では既に登録があります。Nomi Goはお一人につき1アカウントまでです。心当たりがない場合は、お問い合わせからご連絡ください。';
    }else{
      S.error=friendlyError(saved.error,'登録に失敗しました。もう一度お試しください。');
    }
    trackOnboarding('profile_error',2,'profile_save');
    re('profile_new');return;
  }
  trackOnboarding('profile_complete',2,'complete');
  try{sessionStorage.removeItem('ngo_profile_step');sessionStorage.removeItem('ngo_pf');}catch(e){}
  S._profileStep=1;
  await saveUserAttribution();
  if(window.ngoTrackCompleteRegistration)window.ngoTrackCompleteRegistration(S.user.id);
  await DB.from('user_stats').upsert({user_id:S.user.id});
  // 実際に付与されたチケット枚数をDBから読み直す。
  // 画面側で枚数を決めていないため、DBに聞かないと本当の枚数が分からない。
  // 無料付与が行われるかは app_settings.welcome_ticket_male 次第であり、
  // 運営がSQLで切り替えられる（No.128）。
  var granted=0;
  try{
    var tc=await DB.from('profiles').select('ticket_count').eq('user_id',S.user.id).single();
    if(tc.data&&tc.data.ticket_count)granted=tc.data.ticket_count;
  }catch(e){}
  S.profile={user_id:S.user.id,nickname:p.nickname,age:parseInt(p.age),gender:p.gender,residence_prefecture:p.residence_prefecture,job:null,smoke:null,alcohol:null,photo_url:photoUrl,tags:p.tags||[],real_name:p.realname.trim(),birthdate:p.birthdate,email_verified:isEmailVerified(),id_verify_status:'none',ticket_count:granted};
  // 実際に配られたときだけ知らせる。配られていないのに文言を出すと嘘になる。
  // 【2026/8/22 表示時期を変更】以前はこの直後にお祝いを出していたが、
  //   本人確認もLINE連携もこれからという段階で出るため早すぎるとの指摘を受けた。
  //   ここでは印を残すだけにして、年齢確認の承認とLINE連携が両方とも
  //   終わったあと（splashへ移る直前）に出す形にしていた。
  // 【2026/9/1 元に戻した】奈良の指示により、プロフィール登録が終わった直後に出す。
  //   後ろに置くと、本人確認の承認は運営が手作業で行うため、承認までの時間が
  //   数時間から翌日になることがあり、その間まったく何も渡されないまま
  //   身分証の提出は登録の中で負荷が高い手続きになっていた。
  //   先に渡しておけば「もらったから続けよう」という動機になる。
  //   実際にDBで付与された枚数（granted）が1枚以上のときしか出さない点は変えていない。
  //   配っていないのに文言だけ出すと景品表示法上も問題になるため。
  if(p.gender==='male'&&granted>0){
    try{ sessionStorage.setItem('ngo_gift_pending',String(granted)); }catch(e){}
    maybeShowTicketGift();
  }
  S._freeTicketGranted=0;
  // 【カード登録の関門を撤去 8/15】
  // 以前はプロフィール登録の直後にカード登録画面へ送っていたが、
  // PAY.JP前提の画面であり、CREDIXでは不要。

function handleIdPhotoSelect(inputEl){
  var file=inputEl.files&&inputEl.files[0];
  if(!file)return;
  var btn=document.getElementById('id-photo-pick-btn');
  var btnText=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.style.opacity='.55';btn.textContent='写真を読み込み中…';}
  // 身分証は文字を読める解像度を保ちつつ、スマホの大容量写真をJPEGへ縮小する。
  shrinkImage(file,1800,0.88,function(smallFile,dataUrl){
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent=btnText;}
    if(smallFile&&dataUrl){
      S._idPhotoFile=smallFile;
      S._idPhotoPreview=dataUrl;
      S.error='';
      re('id_verify');
      return;
    }
    // HEIC等を端末で変換できない場合は、Storageが対応している元画像を使用する。
    // ただし上限を超える画像は送信せず、その場で撮り直せる案内を出す。
    if(file.size<=4*1024*1024){
      S._idPhotoFile=file;
      var reader=new FileReader();
      reader.onload=function(e){S._idPhotoPreview=e.target.result;S.error='';re('id_verify');};
      reader.onerror=function(){S._idPhotoFile=null;S.error='この写真は読み込めませんでした。別の写真を選ぶか、その場で撮影してください。';re('id_verify');};
      reader.readAsDataURL(file);
    }else{
      S._idPhotoFile=null;S._idPhotoPreview=null;
      S.error='写真の容量が大きすぎます。その場で撮影するか、別の写真を選んでください。';
      re('id_verify');
    }
  });
}

async function uploadIdPhoto(userId,file){
  if(!file)return {path:null,error:null};

  async function send(accessToken){
    var controller=typeof AbortController!=='undefined'?new AbortController():null;
    var timeoutId=setTimeout(function(){if(controller)controller.abort();},45000);
    try{
      var response=await fetch('/api/id-photo-upload',{
        method:'POST',
        headers:{
          'Authorization':'Bearer '+accessToken,
          'Content-Type':file.type||'image/jpeg'
        },
        body:file,
        signal:controller?controller.signal:undefined
      });
      var data={};
      try{data=await response.json();}catch(e){}
      return {ok:response.ok,status:response.status,data:data};
    }finally{
      clearTimeout(timeoutId);
    }
  }

  try{
    var sessionResult=await DB.auth.getSession();
    var session=sessionResult.data&&sessionResult.data.session;
    if(!session||!session.access_token)return {path:null,error:'session_expired'};

    var result=await send(session.access_token);
    // スマホで古いログイン情報が残った場合だけ、1回更新して再送する。
    if(result.status===401){
      var refreshed=await DB.auth.refreshSession();
      var freshSession=refreshed.data&&refreshed.data.session;
      if(!freshSession||!freshSession.access_token)return {path:null,error:'session_expired'};
      result=await send(freshSession.access_token);
    }
    if(!result.ok)return {path:null,error:(result.data&&result.data.error)||'upload_failed'};
    if(!result.data||!result.data.path)return {path:null,error:'invalid_response'};
    return {path:result.data.path,error:null};
  }catch(e){
    return {path:null,error:e&&e.name==='AbortError'?'upload_timeout':(e&&e.message?e.message:String(e))};
  }
}

var _idVerifySubmitting=false;
async function submitIdVerify(){
  if(_idVerifySubmitting)return;
  if(!S._idPhotoFile){S.error='身分証の写真を選んでください';re('id_verify');return;}
  _idVerifySubmitting=true;
  go('loading');
  var sessionCheck=await DB.auth.getSession();
  var hasSession=!!(sessionCheck.data&&sessionCheck.data.session);
  var result=await uploadIdPhoto(S.user.id,S._idPhotoFile);
  if(!result.path){
    _idVerifySubmitting=false;
    if(!hasSession||result.error==='session_expired'){
      S.error='ログインの有効期限が切れました。もう一度ログインしてください。';
    }else if(result.error==='image_too_large'){
      S.error='写真の容量が大きすぎます。その場で撮影するか、別の写真を選んでください。';
    }else if(result.error==='unsupported_image'){
      S.error='この画像形式には対応していません。その場で撮影するか、スクリーンショットを選んでください。';
    }else if(result.error==='account_unavailable'){
      S.error='このアカウントでは本人確認を申請できません。';
    }else if(result.error==='upload_timeout'){
      S.error='通信が時間内に完了しませんでした。電波の良い場所でもう一度お試しください。';
    }else{
      S.error='写真を保存できませんでした。時間をおいてもう一度お試しください。';
    }
    re('id_verify');
    return;
  }
  var path=result.path;
  var upd=await DB.from('profiles').update({id_photo_url:path,id_verify_status:'pending'}).eq('user_id',S.user.id).select('user_id,id_verify_status').single();
  _idVerifySubmitting=false;
  if(upd.error){S.error=friendlyError(upd.error,'保存に失敗しました。もう一度お試しください。');re('id_verify');return;}
  S.profile.id_photo_url=path;
  S.profile.id_verify_status='pending';
  S._idPhotoFile=null;S._idPhotoPreview=null;
  notifyIdVerifyPending();
  go('id_verify_pending');
  startIdVerifyPolling();
}

// 申請があったことを運営に知らせる。送り先と文面はサーバーが決めるため、ここでは渡さない。
// 失敗しても申請そのものには影響させない。
//
// 【2026/9/4 変更・No.275】呼び先を /api/admin から /api/notify-verify-worker へ移した。
//  以前は、この通信が失敗すると通知が飛ばず、しかも記録が一切残らなかった。
//  そのため2026/9/2の申請が約40時間放置されても誰も気づけなかった。
//  現在は、申請が確認待ちになった時点でデータベース側が受付台帳へ1行を残すため、
//  ここでの通信が失敗しても通知は失われない（1分おきの見張りが拾い直す）。
//  この呼び出しは「すぐ届かせる」ためのものであり、確実性はデータベース側が担保する。
//  ログイン証明は不要（送る係は台帳を見て動き、呼び出し側からは何も指定できない）。
async function notifyIdVerifyPending(){
  try{
    await fetch('/api/notify-verify-worker',{method:'POST'});
  }catch(e){}
}

function startIdVerifyPolling(){
  if(S._idVerifyTimer)clearInterval(S._idVerifyTimer);
  S._idVerifyTimer=setInterval(async function(){
    if(S.screen!=='id_verify_pending'){clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;return;}
    // 【2026/9/2 取得する列を追加・No.253】
    //   否認された瞬間に画面を切り替えるが、理由の種類とメモを持っていないと
    //   「何をすればよいか」を出せず、以前の行き止まりに戻ってしまう。
    var res=await DB.from('profiles').select('id_verify_status,reject_reason,id_verify_note').eq('user_id',S.user.id).single();
    if(res.data&&res.data.id_verify_status==='approved'){
      clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;
      S.profile.id_verify_status='approved';
      await goAfterIdApproved();
    }else if(res.data&&res.data.id_verify_status==='rejected'){
      clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;
      S.profile.id_verify_status='rejected';
      S.profile.reject_reason=res.data.reject_reason||null;
      S.profile.id_verify_note=res.data.id_verify_note||null;
      re('id_verify_pending');
    }
  },5000);
}

async function checkIdVerifyNow(){
  var res=await DB.from('profiles').select('id_verify_status,reject_reason,id_verify_note').eq('user_id',S.user.id).single();
  if(res.data&&res.data.id_verify_status==='approved'){
    if(S._idVerifyTimer){clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;}
    S.profile.id_verify_status='approved';
    await goAfterIdApproved();
  }else if(res.data&&res.data.id_verify_status==='rejected'){
    // 押した時点ですでに否認されていた場合。理由に応じた画面へ切り替える。
    if(S._idVerifyTimer){clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;}
    S.profile.id_verify_status='rejected';
    S.profile.reject_reason=res.data.reject_reason||null;
    S.profile.id_verify_note=res.data.id_verify_note||null;
    re('id_verify_pending');
  }else{
    alert('まだ確認中です。もうしばらくお待ちください。');
  }
}

var _fixSaving=false;
async function saveFixProfile(){
  if(_fixSaving)return;
  var p=S.profile||{};
  if(!(p.id_verify_status==='rejected'&&p.reject_reason==='mismatch')){
    S.error='いまは修正できません。お問い合わせからご連絡ください。';re('fix_profile');return;
  }
  var rn=document.getElementById('fx-rn');
  var bd=document.getElementById('fx-bd');
  var name=rn?rn.value.trim():'';
  var birth=bd?bd.value:'';
  if(!name){S.error='本名を入力してください';re('fix_profile');return;}
  if(!birth){S.error='生年月日を入力してください';re('fix_profile');return;}
  var a=calcAgeFromBirthdate(birth);
  if(a===null){S.error='生年月日が正しくありません';re('fix_profile');return;}
  if(a<20){S.error='Nomi Goは20歳以上の方がご利用いただけます';re('fix_profile');return;}
  _fixSaving=true;
  var btn=document.getElementById('fx-btn');
  if(btn){btn.disabled=true;btn.textContent='送信中...';}
  // 年齢はデータベース側が生年月日から計算し直すため、ここでは送らない。
  // 状態を pending に戻すと、運営の確認待ち一覧に再び並ぶ。
  var upd=await DB.from('profiles')
    .update({real_name:name,birthdate:birth,id_verify_status:'pending',updated_at:new Date().toISOString()})
    .eq('user_id',S.user.id)
    .select('user_id,real_name,birthdate,age,id_verify_status,reject_reason').single();
  _fixSaving=false;
  if(btn){btn.disabled=false;btn.textContent='修正して再確認を依頼する →';}
  if(upd.error){S.error=friendlyError(upd.error,'保存に失敗しました。もう一度お試しください。');re('fix_profile');return;}
  // 保存できたかを実際の値で確かめる。データベース側で書き換えが拒まれた場合に
  // 「直った」と誤って伝えないため。
  if(!upd.data||upd.data.birthdate!==birth){
    S.error='修正を保存できませんでした。お手数ですが、お問い合わせからご連絡ください。';re('fix_profile');return;
  }
  S.profile.real_name=upd.data.real_name;
  S.profile.birthdate=upd.data.birthdate;
  S.profile.age=upd.data.age;
  S.profile.id_verify_status='pending';
  S.profile.reject_reason=null;
  S.profile.id_verify_note=null;
  S.error='';
  notifyIdVerifyPending();
  go('id_verify_pending');
  startIdVerifyPolling();
}

async function loadStats(force){
  var now=Date.now();
  if(S._statsLoading)return S._statsLoading;
  if(!force&&S._statsLoadedAt&&now-S._statsLoadedAt<30000)return;
  S._statsLoading=(async function(){
  try{
    var results=await Promise.all([
      DB.from('registrations').select('gender').eq('status','waiting').gt('expires_at',new Date().toISOString()),
      DB.from('matches').select('*',{count:'exact',head:true}).gte('created_at',new Date().toISOString().split('T')[0]),
      DB.from('matches').select('*',{count:'exact',head:true})
    ]);
    var r1=results[0],r2=results[1],r3=results[2];
    if(r1.error)console.error('[loadStats] r1 error:',r1.error);
    if(r2.error)console.error('[loadStats] r2 error:',r2.error);
    var maleW=0,femaleW=0;
    if(r1.data){
      r1.data.forEach(function(x){
        if(x.gender==='male')maleW++;
        else if(x.gender==='female')femaleW++;
      });
    }
    S.stats.active=r1.data?r1.data.length:0;
    S.stats.maleWaiting=maleW;
    S.stats.femaleWaiting=femaleW;
    S.stats.todayMatches=r2.count!=null?r2.count:0;
    S.stats.totalMatches=r3.count!=null?r3.count:0;
    // SHOW_LIVE_COUNT が false のときは表示そのものが無いため、el は null になる。
    // 集計（S.stats）は動かし続けているので、true に戻した時点で正しい数字が出る。
    if(SHOW_LIVE_COUNT){var el=document.getElementById('live-n');if(el)el.textContent=S.stats.active;}
    if(S.screen==='splash')render();
    S._statsLoadedAt=Date.now();
  }catch(e){console.error('[loadStats] exception:',e);}
  })();
  try{return await S._statsLoading;}finally{S._statsLoading=null;}
}

// ===== トップ画面「今夜のノミゴー待ち」カード =====
// 実際に募集中の異性のデータを、テキストのみ（写真・アイコンなし）で数秒おきに入れ替え表示する。
// 年齢は「20代後半」のように丸めて個人特定を防ぐ。架空データは絶対に混ぜない（0人ならカード非表示）。
function ageBand(age){
  if(!age)return '';
  var dec=Math.floor(age/10)*10;
  var half=(age%10<5)?'前半':'後半';
  return dec+'代'+half;
}
async function loadWaitFeed(){
  try{
    // ログイン状態にかかわらず、個人が特定できない項目だけを返す
    // get_public_feed を使う。registrations の直接取得はRLSにより
    // ログイン中でも他人の募集を取得できず、人数だけ出てプロフィールが
    // 表示されない原因になるため使用しない。
    var pubRes=await DB.rpc('get_public_feed');
    if(pubRes&&pubRes.error)throw pubRes.error;
    var rows=(pubRes&&pubRes.data)||[];
    // ログイン中は相手候補（異性）だけ、未ログイン時は現在の募集全体を表示する。
    if(S.user&&S.profile&&S.profile.gender){
      var opp=S.profile.gender==='male'?'female':'male';
      rows=rows.filter(function(r){return r.gender===opp;});
    }
    S._waitFeed=rows.slice(0,6).map(function(r){
      return {
        live:true,
        band:r.band||'',
        gender:r.gender==='male'?'男性':'女性',
        job:r.job||'',
        area:areaName(r.area_id),
        slot:r.slot||'',
        style:r.drink_style||'',
        purpose:r.purpose?purposeLabel(r.purpose):'',
        tag:r.tag||''
      };
    });
  }catch(e){
    console.error('[loadWaitFeed] exception:',e);
    S._waitFeed=[];
  }
}
function waitFeedItemH(f){
  var line1=[f.band,f.gender,f.job].filter(function(x){return x;}).join('・');
  var line2=[f.area,f.style].filter(function(x){return x;}).join('｜');
  if(f.tag)line2+=(line2?'｜':'')+f.tag;
  var badge=f.live
    ?'<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:#7BE090;margin-left:6px"><span style="width:5px;height:5px;border-radius:50%;background:#7BE090;display:inline-block;animation:pulse 1.5s infinite"></span>募集中</span>'
    :'<span style="font-size:10px;color:rgba(237,229,224,.45);margin-left:6px">最近の募集</span>';
  // 何時からの募集かを目立つ位置に出す。slot が入っていないデータは何も出さない（推測で埋めない）。
  var timeH=f.slot
    ?'<div style="font-size:12.5px;font-weight:800;color:var(--gold);margin-top:4px">🕒 募集時間：'+escapeHtml(f.slot==='今すぐ'?'今すぐ':f.slot+'ごろから')+'</div>'
    :'';
  return '<div style="animation:fadeUp .4s ease both"><div style="font-size:13.5px;font-weight:800;color:var(--cream)">'+escapeHtml(line1)+badge+'</div>'+timeH+'<div style="font-size:11.5px;color:rgba(237,229,224,.7);margin-top:3px">'+escapeHtml(line2)+'</div>'+(f.purpose?'<div style="font-size:11px;color:var(--gold);font-weight:700;margin-top:3px">'+f.purpose+'</div>':'')+'</div>';
}
function startWaitFeed(){
  stopWaitFeed();
  loadWaitFeed().then(function(){
    if(S.screen==='splash'&&S._waitFeed&&S._waitFeed.length)render();
  });
  S._waitFeedIdx=0;
  S._waitFeedTimer=setInterval(function(){
    if(S.screen!=='splash'){stopWaitFeed();return;}
    if(!S._waitFeed||!S._waitFeed.length)return;
    S._waitFeedIdx=(S._waitFeedIdx+1)%S._waitFeed.length;
    var el=document.getElementById('wait-feed-body');
    if(el)el.innerHTML=waitFeedItemH(S._waitFeed[S._waitFeedIdx]);
  },4500);
  S._waitFeedReload=setInterval(function(){
    if(S.screen!=='splash'){stopWaitFeed();return;}
    loadWaitFeed();
  },60*1000);
}
function stopWaitFeed(){
  if(S._waitFeedTimer){clearInterval(S._waitFeedTimer);S._waitFeedTimer=null;}
  if(S._waitFeedReload){clearInterval(S._waitFeedReload);S._waitFeedReload=null;}
}
function waitFeedCardH(){
  if(!S._waitFeed||!S._waitFeed.length)return '';
  // 未ログインの人には、この一覧が「登録すると相手になり得る人」だと分かる一言を添える。
  var note=!S.user
    ?'<div style="font-size:11px;color:rgba(237,229,224,.6);margin-top:8px;padding-top:8px;border-top:1px solid rgba(237,229,224,.1);line-height:1.7">登録して本人確認が済むと、この方たちに募集を出せます。</div>'
    :'';
  return '<div class="home-feed"><div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="font-size:14px">🍷</span><span style="font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.08em">今夜のノミゴー待ち</span></div><div id="wait-feed-body" style="min-height:44px">'+waitFeedItemH(S._waitFeed[S._waitFeedIdx||0])+'</div>'+note+'</div>';
}

// エリアごとの現在募集中の人数を取得する（エリア選択画面で「今このエリアで◯人が募集中」を出すため）
async function loadAreaStats(){
  // 期限切れの募集の後片付け。
  // 期限切れで自動終了する処理は本人がアプリを開いている間しか動かないため、
  // 募集したまま閉じられた行が waiting のまま残り続ける。表示は各所で除外して
  // いるので利用者には見えないが、集計値が狂い、将来どこか1箇所で除外を
  // 書き忘れた際に実在しない待機者が表示される事故につながる。
  // エリア選択画面は誰かがアプリを使うたびに必ず開かれるため、ここで片付ける。
  // 失敗しても人数表示は続行させる（片付けは表示の前提条件ではない）。
  try{await DB.rpc('expire_stale_registrations');}catch(e){}
  try{
    var res=await DB.from('registrations').select('area_id').eq('status','waiting').gt('expires_at',new Date().toISOString());
    var counts={};
    AREAS.forEach(function(a){counts[a.id]=0;});
    if(res.data){
      res.data.forEach(function(r){
        if(counts[r.area_id]!=null)counts[r.area_id]++;
      });
    }
    S.areaStats=counts;
  }catch(e){S.areaStats=S.areaStats||{};}
}

// 押した直後に必ず反応を返すための簡易インジケーター。
// 画面全体を作り直さないので即座に出る。
// 【2026/8/21 起動画面と同じ見た目に統一】
//   以前は灰色の輪（spinner）だけだった。待機中に何も説明がないと、
//   利用者は「押せていない」と感じて何度も押したり離脱したりする。
//   とくに決済へ進む場面では外部サイトへ移るまでに間があるため影響が大きい。
//   起動画面（body直下のHTML直書き版・loadingH）と同じ構造にしてあるので、
//   グラス・ブランド名・バーの並びまで揃う。
//   見た目を変えるときは3箇所すべてを同時に直すこと。
function showBusy(){
  if(document.getElementById('ngo-busy'))return;
  var d=document.createElement('div');
  d.id='ngo-busy';
  d.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex';
  d.innerHTML='<div class="loading">'
    +'<div class="nl-glow"></div>'
    +'<div class="nl-cup">'
      +'<div class="nl-glass"><div class="nl-liquid"><div class="nl-wave"></div></div><div class="nl-shine"></div></div>'
      +'<div class="nl-stem"></div><div class="nl-foot"></div>'
    +'</div>'
    +'<div class="nl-brand">Nomi Go</div>'
    +'<div style="font-size:11.5px;color:var(--muted);letter-spacing:.02em">少しお待ちください</div>'
    +'<div style="width:180px;height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden">'
      +'<div class="nl-busy-bar"></div>'
    +'</div>'
  +'</div>';
  document.body.appendChild(d);
}
function hideBusy(){
  var d=document.getElementById('ngo-busy');
  if(d&&d.parentNode)d.parentNode.removeChild(d);
}

// 【外部サイトから戻ってきたときの後始末 8/15】

// ブラウザの「戻る」で復帰すると、ブラウザは離脱直前の状態をそのまま復元するため、

});

var _goRecruitBusy=false;
async function goRecruit(){
  if(_goRecruitBusy)return;
  if(!S.user){go('email');return;}
  if(!S.profile){
    // 登録が途中の状態。メール確認を終えていなければ確認画面へ戻す
    if(!isEmailVerified()){go('email_verify');return;}
    S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};go('profile_new');return;
  }
  if(S.match&&S.registration&&S.registration.status==='matched'){
    alert('現在マッチ中です。現在のマッチが終了すると、新しいお相手を探せます。');
    return;
  }
  if(S.profile.gender==='male'&&!S.profile.photo_url){
    alert('募集にはご本人の顔写真の登録が必要になりました。プロフィール編集から顔写真を登録してください。');
    goProfileEdit();
    return;
  }
  // 職業・喫煙・お酒の強さは、登録時ではなく初めて募集するときに設定する。
  // 既存ユーザーはすでに値があるため、この画面は表示されない。
  if(!S.profile.job||S.profile.smoke==null||S.profile.alcohol==null){
    S.pf={
      nickname:S.profile.nickname,
      age:String(S.profile.age||''),
      gender:S.profile.gender,
      job:S.profile.job||null,
      smoke:S.profile.smoke==null?null:S.profile.smoke,
      alcohol:S.profile.alcohol==null?null:S.profile.alcohol,
      tags:(S.profile.tags||[]).slice()
    };
    go('drink_profile_setup');
    return;
  }
  _goRecruitBusy=true;
  showBusy();
  try{
    // 以前は「キャンセル回数 → カード → 本人確認 → LINE → エリア人数」を1つずつ順番に
    // 問い合わせていたため、押してから画面が変わるまで2秒近くかかっていた。
    // 必要な情報をまとめて一度に取り、同時に実行することで待ち時間を短くする。
    var results=await Promise.all([
      // 【2026/9/2 列を追加・No.253】否認理由とメモも一緒に取り、
      //   否認画面へ飛ばしたときに理由に応じた案内を出せるようにする。
      DB.from('profiles').select('id_photo_url,id_verify_status,reject_reason,id_verify_note,line_user_id,photo_url').eq('user_id',S.user.id).single(),
      DB.from('registrations').select('id',{count:'exact',head:true}).eq('user_id',S.user.id).eq('status','cancelled').not('match_id','is',null),
      loadAreaStats(),
      // お友だちと組んでいるか（2対2が確定しているか）を毎回確かめる。
      // アプリを閉じて開き直しても正しく判定できるよう、画面の記憶ではなくDBを見る。
      DB.from('pair_invites').select('id').eq('status','accepted')
        .or('host_user_id.eq.'+S.user.id+',guest_user_id.eq.'+S.user.id).limit(1)
    ]);
    var me=results[0], cancelCheck=results[1], pairCheck=results[3];
    S._paired=!!(pairCheck&&!pairCheck.error&&pairCheck.data&&pairCheck.data.length>0);
    if(!me.error&&me.data&&S.profile){
      S.profile.id_photo_url=me.data.id_photo_url;
      S.profile.id_verify_status=me.data.id_verify_status;
      S.profile.reject_reason=me.data.reject_reason||null;
      S.profile.id_verify_note=me.data.id_verify_note||null;
      S.profile.line_user_id=me.data.line_user_id;
    }
    var d=(!me.error&&me.data)?me.data:{};

    // 【カード登録の関門を撤去 8/15】
    // 以前はここで「カードが登録されていなければ cardregister へ送る」判定があり、
    // 募集を始める前にカード登録を必須にしていた。
    // これはPAY.JPを使う前提で作られたもので、CREDIXでは成立しない。
    // CREDIXではカード番号の入力を決済ページ側で行うため、
    // 募集の前にカードを登録させる理由がなく、この関門があると
    // 利用者全員が動かない画面で詰んでしまう。
    // カードの取得はチケット購入時にCREDIX側で行われる（No.56で導線を作り直す）。

    // 【順序を入れ替え 2026/8/22】以前は「本人確認 → LINE連携」の順だった。
    //   本人確認は身分証の提出を求めるため負荷が高く、
    //   ここで離れた人とは連絡手段がないまま関係が切れてしまう。
    //   実際に女性の実ユーザー第1号が本人確認の未提出のまま止まり、
    //   LINE未連携のため声をかける手段がなかった（No.144）。
    //   LINEを先に済ませておけば、本人確認で止まっても後から呼び戻せる。
    // LINE連携は募集の前提条件。未連携なら連携画面へ。
    // LINEは1アカウントにつき1つしか紐づけられないため、複数アカウントの抑止にもなる。
    // マッチ成立の通知が確実に届くことは、無断キャンセルの判断の前提でもある。
    if(!d.line_user_id){await goLineConnect();return;}

    var idStatus=!d.id_photo_url?'none':(d.id_verify_status||'pending');
    if(idStatus!=='approved'){
      if(idStatus==='none'){go('id_verify');}else{go('id_verify_pending');}
      return;
    }

    // 確認の呼びかけは、画面を切り替える直前に出す（待ち時間中に出さない）
    if(cancelCheck.count!=null&&cancelCheck.count>=2){
      hideBusy();
      var proceed=confirm('過去にマッチ成立後のキャンセルが2回以上あります。マッチ成立後のキャンセルにはペナルティが発生します。このまま募集を続けますか？');
      if(!proceed)return;
    }
    go('area_select');
  }catch(e){
    alert('通信に失敗しました。もう一度お試しください。');
  }finally{
    _goRecruitBusy=false;
    hideBusy();
  }
}

function pairInviteUrl(){
  if(!S._pair||!S._pair.token)return '';
  return SITE_URL+'/?pair='+S._pair.token;
}

function copyPairInviteUrl(){
  var url=pairInviteUrl();
  if(!url)return;
  var done=function(){alert('招待リンクをコピーしました。LINEなどでお友だちに送ってください。');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done,function(){fallbackCopy(url,done);});
    }else{ fallbackCopy(url,done); }
  }catch(e){ fallbackCopy(url,done); }
}
function fallbackCopy(text,cb){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){ alert('コピーできませんでした。リンクを長押しして選択してください。'); }
}

  if(_isSubmitting)return;
  var f=S.form;
  if(!f.area||!f.slot||!f.drink_style||!f.purpose){S.error='すべて選択してください';re('recruit');return;}
  // 2対2は、お友だちの参加が確定していないと募集できない。
  // 以前は年齢を選ぶだけだったが、それでは一緒に来る方の年齢を確かめたことにならない。
  // 本人確認まで済ませた登録者どうしでなければ組めない仕組みに変えた。
  if(f.mode==='2v2'){
    if(!S._pair||S._pair.status!=='accepted'||!S._pair.partnerVerified){
      S.error='2対2は、お友だちの参加が確定してから募集できます';
      re('recruit');return;
    }
  }
  if(S.profile&&S.profile.gender==='male'){
    if(!S.profile.ticket_count||S.profile.ticket_count<1){S.error='ticket_zero';re('recruit');return;}
  }
  _isSubmitting=true;
  await doRegister();
}

// チケット購入の開始。
//
// 【以前の作りとの違い】
//  以前は、決済のあとブラウザから profiles.ticket_count を「現在値＋1」で
//  書き換えていました。しかしDB側のガードが、利用者によるチケットの自己加算を
//  打ち消すため、この更新は静かに無効化されていました。エラーは出ないため
//  画面には「購入完了」と表示され、実際には1枚も増えないという状態でした。
//  修正すべきはガードではなく、この画面側の処理のほうです。
//
//  現在は、チケットの付与はサーバー（/api/credix-notify）だけが行います。
//  この画面がすることは、次の2つだけです。
//   ① サーバーに購入の開始を伝え、決済ページへ送る値を受け取る
//   ② 受け取った値をそのままCREDIXの決済ページへ送る
//  金額をこの画面で決めることはありません。
async function chargeForTicket(){
  if(_ticketPurchasing)return;
  _ticketPurchasing=true;
  showBusy();
  try{
    var s=await DB.auth.getSession();
    var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    if(!token){
      _ticketPurchasing=false;hideBusy();
      alert('ログインの有効期限が切れています。もう一度ログインしてください。');
      return;
    }

    var res=await fetch('/api/credix-start',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      // 同意した事実と、同意した文面の版を伝える。
      // 文面そのものは送らない（書き換えられるため）。
      // サーバーは同じ版の文面を保存し、保存できた場合だけ決済へ進ませる。
      body:JSON.stringify({consent:true,consent_version:PAY_CONSENT_VERSION})
    });
    var data=null;
    try{ data=await res.json(); }catch(e){ data=null; }

    if(!res.ok||!data||!data.success){
      _ticketPurchasing=false;hideBusy();
      var msg='現在チケットを購入できません。時間をおいてお試しください。';
      if(data&&data.error==='sales_closed'){msg='ただいまチケットの販売を準備中です。開始まで今しばらくお待ちください。';}
      if(data&&data.error==='not_male'){msg='チケットのご購入は男性の方のみとなります。';}
      if(data&&data.error==='unauthorized'){msg='ログインの有効期限が切れています。もう一度ログインしてください。';}
      // 同意が届いていない、または同意の記録に失敗した場合。
      // この場合は決済へ進ませない（同意の記録がないまま決済されるのを防ぐため）。
      if(data&&data.error==='consent_required'){msg='個人情報の提供への同意が確認できませんでした。もう一度お試しください。';}
      if(data&&data.error==='consent_version_mismatch'){msg='同意いただく内容が更新されています。画面を再読み込みしてから、もう一度お試しください。';}
      if(data&&data.error==='consent_save_failed'){msg='同意の記録に失敗したため、決済を中止しました。時間をおいてお試しください。';}
      alert(msg);
      return;
    }

    // CREDIXの決済ページへ送り出す。
    // 送る値はすべてサーバーが作ったもので、この画面では作りません。
    var form=document.createElement('form');
    form.method='POST';
    form.action=data.action;
    form.style.display='none';
    // 【2つの決済方式に対応する 2026/8/17】
    // サーバーが「どちらの方式で進めるか」を決めて mode で教えてくれる。
    //
    //   repeater … 2回目以降。CREDIXが保存しているカード情報を使うため、
    //              カード番号の入力が不要。送るのは clientip と sid だけ。
    //              金額もカードIDもCREDIX側がセッションとして持っている。
    //   first    … 初回、またはカードの有効期限が切れている場合。
    //              カード番号の入力画面へ進むため、金額などを送る。
    //
    // どちらになるかを画面側で判断してはいけない。
    // カードが保存されているかどうかを正しく知っているのはCREDIXだけであり、
    // 画面側で推測すると実態とずれて購入できなくなる。
    var fields;
    if(data.mode==='repeater'&&data.sid){
      fields={clientip:data.clientip,sid:data.sid};
    }else{
      fields={clientip:data.clientip,money:data.money,sendid:data.sendid,sendpoint:data.sendpoint};
    }
    Object.keys(fields).forEach(function(k){
      var input=document.createElement('input');
      input.type='hidden';
      input.name=k;
      input.value=fields[k];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    // ここでCREDIXの決済ページへ移動します。
    // 戻ってきたときは、サーバーが受け取った決済結果にもとづいて
    // チケットの枚数が更新されています。
  }catch(e){
    _ticketPurchasing=false;hideBusy();
    alert(friendlyError(e,'通信に失敗しました。もう一度お試しください。'));
  }
}

async function doRegister(){
  go('loading');
  var timeoutFlag={hit:false};
  var timeoutId=setTimeout(function(){
    timeoutFlag.hit=true;
    _isSubmitting=false;
    S.error='通信に時間がかかっています。もう一度お試しください。';
    re('recruit');
  },10000);
  try{
    var existing=await DB.from('registrations').select(REG_COLS).eq('user_id',S.user.id).eq('status','waiting').single();
    if(timeoutFlag.hit)return;
    if(existing.data){clearTimeout(timeoutId);_isSubmitting=false;S.registration=existing.data;startPolling();go('waiting');return;}
    var ins=await DB.from('registrations').insert({
      user_id:S.user.id,
      area_id:S.form.area,
      slot:S.form.slot,
      mode:S.form.mode||'1v1',
      gender:S.profile.gender,
      drink_style:S.form.drink_style,
      purpose:S.form.purpose||null,
      ok_nodrink:!!S.form.ok_nodrink,
      timing:'どちらでもOK',
      duration_pref:S.form.slot==='今すぐ'?(S.form.duration_pref||null):null,
      age_any:!!S.form.age_any,
      age_min:S.form.age_any?null:parseInt(S.form.age_min),
      age_max:S.form.age_any?null:parseInt(S.form.age_max),
      age:S.profile.age,
      smoke:S.profile.smoke,
      alcohol:S.profile.alcohol,
      status:'waiting'
    }).select(REG_COLS).single();
    if(timeoutFlag.hit)return;
    if(ins.error){clearTimeout(timeoutId);_isSubmitting=false;S.error=friendlyError(ins.error,'募集の登録に失敗しました。もう一度お試しください。');re('recruit');return;}
    clearTimeout(timeoutId);
    S.registration=ins.data;
    // 運営への通知は募集処理と分離する。通知に失敗しても募集・マッチングは止めない。
    notifyRecruitmentCreated(ins.data.id);
    var matched=await tryMatch();
    if(matched==='choice'){_isSubmitting=false;return;}
    // 登録が成功した場合も「送信中」の札を必ず下ろす。
    // ここが抜けていると、次に募集画面へ戻ったとき、条件をすべて選んでも
    // 参加登録ボタンが光らないままになる。
    _isSubmitting=false;
    if(matched===true){go('matched');}else{startPolling();go('waiting');}
  }catch(e){clearTimeout(timeoutId);if(!timeoutFlag.hit){_isSubmitting=false;S.error=friendlyError(e,'募集の登録に失敗しました。もう一度お試しください。');re('recruit');}}
}

// ===== 飲みスタイルの相性判定 =====
// 同じスタイル同士はOK。片方が「ご飯メイン」でも、相手が「ご飯メインの人とでもOK」なら成立する
function drinkCompat(myStyle,myOk,theirStyle,theirOk){
  if(myStyle===theirStyle)return true;
  if(myStyle==='ご飯メイン'&&theirOk)return true;
  if(theirStyle==='ご飯メイン'&&myOk)return true;
  return false;
}

// 候補の優先度スコア：飲み方一致 > 目的一致 > 年齢の近さ
// 飲み方が違っても候補からは外さず、同じ場合だけ優先する。
function candidateScore(c){
  var score=0;
  var myStyle=S.registration&&S.registration.drink_style;
  var myPurpose=(S.registration&&S.registration.purpose)||S.form.purpose;
  if(myStyle&&c.drink_style&&c.drink_style===myStyle)score+=10000;
  if(myPurpose&&c.purpose&&c.purpose===myPurpose)score+=1000;
  var myAge=S.profile&&S.profile.age?S.profile.age:25;
  score-=Math.abs((c.age||myAge)-myAge);
  return score;
}

async function openRecruitmentInviteById(registrationId){
  if(!registrationId||!/^[0-9a-f-]{36}$/i.test(registrationId)){
    clearPendingRecruitment();go('splash');return;
  }
  go('loading');
  try{
    var res=await DB.from('registrations').select(REG_COLS).eq('id',registrationId)
      .eq('status','waiting').gt('expires_at',new Date().toISOString()).maybeSingle();
    var reg=res.data;
    if(res.error||!reg||reg.user_id===S.user.id||(S.profile&&reg.gender===S.profile.gender)){
      S._recruitmentInvite={ended:true};go('recruitment_invite');return;
    }
    var pr={};
    try{
      var prRes=await DB.rpc('get_candidate_profile',{p_user_id:reg.user_id});
      pr=(prRes.data&&prRes.data[0])||{};
    }catch(e){}
    // LINEのボタンを押した指が、画面切替直後の応募ボタンにも反応する
    // クリック持ち越しを防ぐため、表示直後は応募できない状態にする。
    S._recruitmentInvite={ended:false,registration:reg,profile:pr,submitting:false,ready:false};
    go('recruitment_invite');
    setTimeout(function(){
      if(S._recruitmentInvite&&S._recruitmentInvite.registration&&
         S._recruitmentInvite.registration.id===registrationId){
        S._recruitmentInvite.ready=true;
        if(S.screen==='recruitment_invite')re('recruitment_invite');
      }
    },1500);
  }catch(e){
    S._recruitmentInvite={ended:true,loadError:true};go('recruitment_invite');
  }
}

async function applyRecruitmentInvite(){
  var invite=S._recruitmentInvite;
  if(!invite||invite.ended||invite.submitting||!invite.ready||!invite.registration)return;
  if(!confirm('この募集に応募して、マッチを成立させますか？\n\n「応募する」を選ぶまでマッチは成立しません。'))return;
  invite.submitting=true;re('recruitment_invite');
  try{
    if(S.registration&&(S.registration.status==='waiting'||S.registration.status==='matched')){
      alert('すでに進行中の募集またはマッチがあります。');return;
    }
    if(S.profile&&S.profile.gender==='male'){
      await syncTicketCount();
      if(!S.profile.ticket_count||S.profile.ticket_count<1){alert('応募するにはチケットが1枚必要です。');return;}
    }
    var targetRes=await DB.from('registrations').select(REG_COLS).eq('id',invite.registration.id)
      .eq('status','waiting').gt('expires_at',new Date().toISOString()).maybeSingle();
    var target=targetRes.data;
    if(targetRes.error||!target){invite.ended=true;re('recruitment_invite');return;}
    if(target.mode==='2v2'){
      await loadPairStatus();
      if(!S._pair||S._pair.status!=='accepted'||S._pair.partnerVerified!==true){
        alert('2対2への応募には、同行するお友だちの登録と本人確認が必要です。');return;
      }
    }
    if(!ageMatches(target.age_any,target.age_min,target.age_max,S.profile.age)){
      invite.ended=true;re('recruitment_invite');return;
    }
    var ins=await DB.from('registrations').insert({
      user_id:S.user.id,area_id:target.area_id,slot:target.slot,mode:target.mode||'1v1',
      gender:S.profile.gender,drink_style:target.drink_style,purpose:target.purpose||null,
      ok_nodrink:!!target.ok_nodrink,timing:'どちらでもOK',duration_pref:target.duration_pref||null,
      age_any:false,age_min:target.age,age_max:target.age,age:S.profile.age,
      smoke:S.profile.smoke,alcohol:S.profile.alcohol,status:'waiting'
    }).select(REG_COLS).single();
    if(ins.error||!ins.data){alert(friendlyError(ins.error,'応募できませんでした。もう一度お試しください。'));return;}
    S.registration=ins.data;
    var lock=await DB.from('registrations').update({status:'processing'}).eq('id',target.id)
      .eq('status','waiting').select(REG_COLS).maybeSingle();
    if(lock.error||!lock.data){
      await DB.from('registrations').update({status:'cancelled'}).eq('id',ins.data.id).eq('status','waiting');
      S.registration=null;invite.ended=true;re('recruitment_invite');return;
    }
    var ok=await finalizeMatchWith(lock.data,null);
    if(!ok){
      await DB.from('registrations').update({status:'waiting'}).eq('id',target.id).eq('status','processing');
      await DB.from('registrations').update({status:'cancelled'}).eq('id',ins.data.id).eq('status','waiting');
      S.registration=null;alert(S.error||'応募できませんでした。もう一度お試しください。');return;
    }
    clearPendingRecruitment();go('matched');
  }catch(e){alert(friendlyError(e,'応募できませんでした。もう一度お試しください。'));}
  finally{if(S._recruitmentInvite){S._recruitmentInvite.submitting=false;if(S.screen==='recruitment_invite')re('recruitment_invite');}}
}

async function tryMatch(){
  if(!S.registration){dbgLog('S0: registration=null');return false;}
  var p=S.profile;
  if(!p){dbgLog('S0: profile=null');return false;}
  dbgLog('tryMatch開始 gender='+p.gender);

  // 男女どちらの端末からでも候補の照合を動かす。
  // 女性が先に募集して画面を閉じた後で男性が募集した場合も、1候補なら成立させる。
  // 男性側で候補が複数いる場合は女性の選択を優先し、男性には選択画面を出さない。

  // 検索条件は必ず S.registration（DBから読んだ自分の募集）から取る。
  // S.form は画面の入力状態なので、待機中の再読み込み等で消えることがある。
  var R=S.registration;
  if(R.expires_at&&new Date(R.expires_at).getTime()<=Date.now()){dbgLog('S2x: 自分の募集が期限切れ');return false;}
  dbgLog('S2: area='+R.area_id+' slot='+R.slot+' mode='+R.mode);
  if(!R.area_id||!R.slot){dbgLog('S2x: area/slot欠落');return false;}

  var candidates=await DB.from('registrations').select(REG_COLS).eq('status','waiting').eq('area_id',R.area_id).eq('mode',R.mode||'1v1').neq('gender',p.gender).neq('user_id',S.user.id);
  if(candidates.error){dbgLog('S3err: '+candidates.error.message);return false;}
  dbgLog('S3: 候補'+((candidates.data&&candidates.data.length)||0)+'件');
  if(!candidates.data||candidates.data.length===0){return false;}

  // 一度マッチした相手とは再度マッチさせない。
  // 会った後は連絡先を交換している前提のため、同じ相手を繰り返し出さない方針。
  // 取得に失敗した場合は空配列として扱い、マッチング自体は止めない。
  var pastIds={};
  try{
    var past=await DB.rpc('get_past_partner_ids');
    if(past.data){past.data.forEach(function(x){pastIds[x.user_id]=true;});}
  }catch(e){}
  dbgLog('S3b: 過去マッチ'+Object.keys(pastIds).length+'人を除外対象に');

  var nowMs=Date.now();
  var filtered=candidates.data.filter(function(c){
    // 期限が切れた募集は候補にしない。
    // 何時間も前の募集が生きていると、本人が忘れた頃にマッチが成立し、
    // 無断キャンセルの原因になる。
    if(c.expires_at&&new Date(c.expires_at).getTime()<=nowMs){dbgLog('  除外(期限切れ) '+c.id.slice(0,8));return false;}
    if(pastIds[c.user_id]){dbgLog('  除外(過去にマッチ済み) '+c.id.slice(0,8));return false;}
    var iWantThem=ageMatches(R.age_any,R.age_min?parseInt(R.age_min):null,R.age_max?parseInt(R.age_max):null,c.age);
    var theyWantMe=ageMatches(c.age_any,c.age_min,c.age_max,p.age);
    if(!iWantThem){dbgLog('  除外(自分の年齢希望) '+c.id.slice(0,8));return false;}
    if(!theyWantMe){dbgLog('  除外(相手の年齢希望) '+c.id.slice(0,8));return false;}
    return true;
  });
  dbgLog('S4: 条件通過'+filtered.length+'件');
  if(filtered.length===0){return false;}

  // 2対2では、相手も2人組で参加している。
  // そのまま並べると同じ組の2人が別々の候補として出てしまい、
  // 「どちらと飲むか」の選択肢に同じ組の2人が並んでしまう。
  // 組ごとに1件だけ残し、さらに2人そろっている組だけを候補にする。
  if((R.mode||'1v1')==='2v2'){
    var byPair={};
    filtered.forEach(function(c){
      if(!c.pair_id)return;
      if(!byPair[c.pair_id])byPair[c.pair_id]=[];
      byPair[c.pair_id].push(c);
    });
    var pairFiltered=[];
    Object.keys(byPair).forEach(function(pid){
      // 2人そろっていない組は、4人での飲み会が成立しないので候補にしない
      if(byPair[pid].length>=2){
        // 組を代表する1件だけを候補にする（募集した本人を優先）
        var host=byPair[pid].filter(function(x){return x.pair_role==='host';})[0];
        pairFiltered.push(host||byPair[pid][0]);
      }else{
        dbgLog('  除外(組が揃っていない) pair='+pid.slice(0,8));
      }
    });
    filtered=pairFiltered;
    dbgLog('S4b: 組に整理 '+filtered.length+'組');
    if(filtered.length===0){return false;}
  }

  // 女性側の2択という既存仕様を維持するため、男性側は候補が1人のときだけ成立処理へ進む。
  if(p.gender==='male'&&filtered.length>1){
    dbgLog('S4c: 男性側・候補複数のため女性の選択待ち');
    return false;
  }

  // 目的一致・年齢の近さで並べ替え
  filtered.sort(function(a,b){return candidateScore(b)-candidateScore(a);});

  // ----- 候補が1人：そのまま自動成立 -----
  if(filtered.length===1){
    var only=filtered[0];
    var lock1=await DB.from('registrations').update({status:'processing'}).eq('id',only.id).eq('status','waiting').select(REG_COLS).single();
    dbgLog('S5: 単独候補ロック '+(lock1.error?('失敗 '+lock1.error.message):(lock1.data?'成功':'データなし')));
    if(lock1.error||!lock1.data)return false;
    return await finalizeMatchWith(only,null);
  }

  // ----- 候補が2人以上：上位2人を確保して2択画面へ -----
  var c1=filtered[0],c2=filtered[1];
  var lockA=await DB.from('registrations').update({status:'processing'}).eq('id',c1.id).eq('status','waiting').select(REG_COLS).single();
  if(lockA.error||!lockA.data){return false;}
  var lockB=await DB.from('registrations').update({status:'processing'}).eq('id',c2.id).eq('status','waiting').select(REG_COLS).single();
  if(lockB.error||!lockB.data){
    // 2人目を確保できなかったら1人目とそのまま成立
    return await finalizeMatchWith(c1,null);
  }
  // マッチ前の候補確認用。本名・生年月日などは返さない関数を使う。
  var pr1r=await DB.rpc('get_candidate_profile',{p_user_id:c1.user_id});
  var pr2r=await DB.rpc('get_candidate_profile',{p_user_id:c2.user_id});
  var pr1={data:(pr1r.data&&pr1r.data[0])||null};
  var pr2={data:(pr2r.data&&pr2r.data[0])||null};
  c1.profileData=pr1.data||{};
  c2.profileData=pr2.data||{};
  S._choice={cands:[c1,c2],deadline:Date.now()+90*1000,submitting:false};
  if(S.pollTimer){clearInterval(S.pollTimer);S.pollTimer=null;}
  go('choose');
  startChoiceCountdown();
  return 'choice';
}

// ===== マッチ確定処理（選ばれた相手と成立させ、選ばれなかった相手は募集中に戻す）=====
// ===== マッチの成立 =====
// 【重要】成立の処理はすべてサーバー側の関数 finalize_match が行う。
//   理由は2つ。
//   ① 2対2では男性が2人いる。以前の作りは「1マッチにつき1枚」しか消費できず、
//      2人目のチケットが引かれないまま飲み会が成立してしまう状態だった。
//   ② 途中で失敗したとき、マッチだけできてチケットが引かれない、
//      といった中途半端な状態が残らないようにするため。
//   サーバー側では、参加者全員が本人確認済みであることと、
//   男性全員がチケットを持っていることを最後にもう一度確かめている。
async function finalizeMatchWith(bestReg,otherReg){
  var res=await DB.rpc('finalize_match',{p_partner_reg_id:bestReg.id});
  if(res.error){
    dbgLog('S6err: 成立失敗 '+res.error.message);
    // 選ばれなかった候補は募集中に戻す（本人には何も通知されない）
    if(otherReg)await DB.from('registrations').update({status:'waiting'}).eq('id',otherReg.id).eq('status','processing');
    S.error=friendlyError(res.error,'マッチの成立に失敗しました。もう一度お試しください。');
    return false;
  }
  var row=res.data&&res.data[0];
  if(!row||!row.out_match_id){
    if(otherReg)await DB.from('registrations').update({status:'waiting'}).eq('id',otherReg.id).eq('status','processing');
    return false;
  }
  var matchId=row.out_match_id;
  dbgLog('S8: マッチ成立 '+matchId.slice(0,8));

  // 選ばれなかった候補を募集中に戻す
  if(otherReg)await DB.from('registrations').update({status:'waiting'}).eq('id',otherReg.id).eq('status','processing');

  var m=await DB.from('matches').select('*').eq('id',matchId).single();
  if(m.data)S.match=m.data;

  var reg=await DB.from('registrations').select(REG_COLS).eq('user_id',S.user.id).eq('match_id',matchId).single();
  if(reg.data)S.registration=reg.data;

  await syncUserState();
  await loadMatchMembers();
  sendMatchLineNotify(matchId);
  render();
  return true;
}

// ===== 2択画面：カウントダウンと選択 =====
function startChoiceCountdown(){
  if(S._choiceTimer)clearInterval(S._choiceTimer);
  S._choiceTimer=setInterval(function(){
    if(!S._choice){clearInterval(S._choiceTimer);S._choiceTimer=null;return;}
    var remain=Math.max(0,Math.ceil((S._choice.deadline-Date.now())/1000));
    var el=document.getElementById('choice-timer');
    if(el)el.textContent=remain+'秒';
    if(remain<=0){
      clearInterval(S._choiceTimer);S._choiceTimer=null;
      // 時間切れ：条件一致度が高い方（1人目）と自動成立
      submitChoice(0,true);
    }
  },500);
}

async function submitChoice(idx,isAuto){
  if(!S._choice||S._choice.submitting)return;
  S._choice.submitting=true;
  if(S._choiceTimer){clearInterval(S._choiceTimer);S._choiceTimer=null;}
  var chosen=S._choice.cands[idx];
  var other=S._choice.cands[idx===0?1:0];
  go('loading');
  var ok=await finalizeMatchWith(chosen,other);
  S._choice=null;
  if(ok){go('matched');}
  else{
    // 成立に失敗したら募集中に戻る
    startPolling();
    go('waiting');
  }
}

function startPolling(){
  if(S.pollTimer)clearInterval(S.pollTimer);
  dbgLog('polling開始 reg='+(S.registration?S.registration.id.slice(0,8):'null'));
  S._procSince=null;
  S.pollTimer=setInterval(async function(){
    try{
      if(S.registration){
        var reg=await DB.from('registrations').select(REG_COLS).eq('id',S.registration.id).single();
        // 検索条件が消えないよう、毎回DBの内容で自分の募集情報を上書きしておく
        if(reg.data)S.registration=reg.data;
        // 相手（女性）の選択待ちで自分が processing のまま長時間経過した場合の自己復旧
        // （女性側のアプリが途中で閉じられた等の保険。4分で自動的に募集中へ戻す）
        if(reg.data&&reg.data.status==='processing'){
          if(!S._procSince)S._procSince=Date.now();
          if(Date.now()-S._procSince>4*60*1000){
            await DB.from('registrations').update({status:'waiting'}).eq('id',S.registration.id).eq('status','processing');
            S._procSince=null;
          }
        }else{S._procSince=null;}
        if(reg.data&&reg.data.status==='matched'&&reg.data.match_id){
          clearInterval(S.pollTimer);
          var m=await DB.from('matches').select('*').eq('id',reg.data.match_id).single();
          if(m.data){
            S.registration.status='matched';
            S.registration.match_id=reg.data.match_id;
            S.match=m.data;await loadMatchMembers();_isSubmitting=false;go('matched');return;
          }
        }
      }
      var matched=await tryMatch();
      if(matched==='choice'){_isSubmitting=false;return;}
      if(matched===true){clearInterval(S.pollTimer);_isSubmitting=false;go('matched');}
      loadStats();
    }catch(e){dbgLog('pollErr: '+e.message);}
  },8000);
}

async function setMatchResultOnce(matchId,newStatus,extraFields){
  if(!matchId)return false;
  var updateData=Object.assign({status:newStatus},extraFields||{});
  var res=await DB.from('matches').update(updateData).eq('id',matchId).eq('status','confirmed').select('id,status').single();
  if(res.error||!res.data){
    return false;
  }
  return true;
}

async function saveUserResult(matchId,userResult){
  if(!matchId||!S.user)return;
  var cur=await DB.from('matches').select('*').eq('id',matchId).single();
  if(cur.error||!cur.data)return;
  var m=cur.data;
  var updateData={};
  var otherResult=null;

  if(!m.result_a_user_id){
    updateData.result_a=userResult;
    updateData.result_a_user_id=S.user.id;
    otherResult=null;
  }else if(m.result_a_user_id===S.user.id){
    return;
  }else if(!m.result_b_user_id){
    updateData.result_b=userResult;
    updateData.result_b_user_id=S.user.id;
    otherResult=m.result_a;
  }else if(m.result_b_user_id===S.user.id){
    return;
  }else{
    return;
  }

  if(otherResult){
    var myResult=userResult;
    var theirResult=otherResult;
    if(myResult==='completed'&&theirResult==='completed'){
      updateData.verdict='normal';
    }else if(myResult==='cancelled'&&theirResult==='cancelled'){
      updateData.verdict='both_cancelled';
    }else{
      updateData.verdict='needs_review';
    }
  }

  if(Object.keys(updateData).length>0){
    await DB.from('matches').update(updateData).eq('id',matchId);
  }
}

// ===== 飲み終わり・結果回答 =====
// 「今すぐ」は成立2時間後、時間指定は開始時刻2時間後から回答できる。
function matchEndAvailableMs(){
  if(!S.match||!S.match.created_at)return null;
  var created=new Date(S.match.created_at);
  if(S.match.slot==='今すぐ')return created.getTime()+2*60*60*1000;
  var mt=String(S.match.slot||'').match(/^(\d{2}):(\d{2})$/);
  if(!mt)return created.getTime()+2*60*60*1000;
  var jst=new Date(created.getTime()+9*60*60*1000);
  var y=jst.getUTCFullYear(),mo=String(jst.getUTCMonth()+1).padStart(2,'0'),d=String(jst.getUTCDate()).padStart(2,'0');
  return new Date(y+'-'+mo+'-'+d+'T'+mt[1]+':'+mt[2]+':00+09:00').getTime()+2*60*60*1000;
}
function canAnswerMatchOutcome(){
  var t=matchEndAvailableMs();
  return !!(t&&Date.now()>=t&&S.match&&S.match.status==='confirmed');
}
function shouldRemindFinish(){
  return !!(S.registration&&S.registration.status==='matched'&&canAnswerMatchOutcome());
}

async function loadMatchMembers(){
  if(!S.match)return;
  var r=await DB.from('registrations').select(REG_COLS).eq('match_id',S.match.id);
  if(!r.data)return;
  // マッチ相手のプロフィールは profiles を直接読まず、サーバー側の関数から取得する。
  // 直接読むと、DB側の許可の都合で本名・生年月日・身分証の保存先・カード顧客番号まで
  // 端末に降りてしまうため。関数は安全な列だけを返し、そのマッチの参加者にしか応答しない。
  var partners=await DB.rpc('get_match_partners',{p_match_id:S.match.id});
  var byUser={};
  if(partners.data){
    partners.data.forEach(function(p){byUser[p.user_id]=p;});
  }
  for(var i=0;i<r.data.length;i++){
    r.data[i].profiles=byUser[r.data[i].user_id]||{};
  }
  S.matchMembers=r.data;
  await Promise.all([loadMeetingPlan(false),loadMeetingChangeHistory(false)]);
  await syncReportStatus();
  startFinishReminderTimer();
  startMeetingPlanTimer();
}

function applyMessages(data){
  var sys=[{type:'system',id:'sys-0',content:'マッチング成立！チャットが作成されました'}];
  if(S.match.ticket_consumed&&S.profile&&S.profile.gender==='male'){
    sys.push({type:'system',id:'sys-1',content:'🎫 チケットを1枚使用しました'});
  }
  var msgs=data.map(function(m){
    var nick='?';
    if(m.user_id===S.user.id&&S.profile){nick=S.profile.nickname;}
    else{var mm=S.matchMembers.find(function(x){return x.user_id===m.user_id;});if(mm&&mm.profiles)nick=mm.profiles.nickname||'?';}
    return {id:m.id,user_id:m.user_id,content:m.content,mine:m.user_id===S.user.id,nickname:nick};
  });
  var newMsgs=sys.concat(msgs);
  var currentIds=S.chatMsgs.map(function(m){return m.id;}).join(',');
  var newIds=newMsgs.map(function(m){return m.id;}).join(',');
  if(currentIds!==newIds){
    S.chatMsgs=newMsgs;
    if(S.screen==='chat'){
      render();
      setTimeout(function(){var el=document.querySelector('.chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
    }
  }
  // メッセージ取得と画面描画が終わった後にだけ、既読時刻を別通信で記録する。
  // この通信は待たないため、失敗・遅延してもチャットの表示や送信を止めない。
  if(S.screen==='chat'&&S.match&&S.match.id){
    var readMatchId=S.match.id;
    setTimeout(function(){
      if(S.screen!=='chat'||!S.match||S.match.id!==readMatchId)return;
      DB.rpc('mark_match_chat_read',{p_match_id:readMatchId}).then(function(){}).catch(function(){});
    },500);
  }
}

var _reviewSubmitting=false;

function setReviewStars(n){
  var wasLow=S.reviewStars>0&&S.reviewStars<=2;
  var isLow=n<=2;
  if(wasLow!==isLow){
    S.reviewChecks=REVIEW_TAGS.map(function(){return false;});
    S.reviewOtherText='';
  }
  S.reviewStars=n;
  re('review');
}

function confirmSubmitReview(){
  if(_reviewSubmitting)return;
  if(!S.match||S.reviewStars===0)return;
  var anyTagSelected=S.reviewChecks.some(function(c){return c;});
  if(!anyTagSelected){alert('評価タグを1つ以上選んでください');return;}
  var isLowNow=S.reviewStars>0&&S.reviewStars<=2;
  var checksNow=isLowNow?REVIEW_TAGS_LOW:REVIEW_TAGS;
  var otherIdxNow=checksNow.length-1;
  if(S.reviewChecks[otherIdxNow]&&(!S.reviewOtherText||!S.reviewOtherText.trim())){
    alert('「その他」を選んだ場合は内容を入力してください');
    return;
  }
  if(!confirm('評価を送信しますか？\nこの操作は送信後に変更できません。'))return;
  _reviewSubmitting=true;
  re('review');
  submitReview().catch(function(){}).finally(function(){_reviewSubmitting=false;});
}

async function submitReview(){
  if(!S.match||S.reviewStars===0)return;
  var matchId=S.match.id;
  var targets=S.matchMembers.filter(function(m){return m.user_id!==S.user.id;});
  for(var i=0;i<targets.length;i++){
    var tagSource=(S.reviewStars>0&&S.reviewStars<=2)?REVIEW_TAGS_LOW:REVIEW_TAGS;
    var otherIdxSubmit=tagSource.length-1;
    var selectedTags=S.reviewChecks.map(function(checked,idx){
      if(!checked)return null;
      if(idx===otherIdxSubmit&&S.reviewOtherText&&S.reviewOtherText.trim()){
        return S.reviewOtherText.trim();
      }
      return tagSource[idx];
    }).filter(function(t){return t!==null;});
    var isLowNow2=S.reviewStars>0&&S.reviewStars<=2;
    var legacyPunctual=isLowNow2?false:S.reviewChecks[0];
    var legacyFriendly=isLowNow2?false:S.reviewChecks[1];
    var legacyAgain=isLowNow2?false:S.reviewChecks[2];
    await DB.from('reviews').insert({match_id:matchId,reviewer_id:S.user.id,reviewee_id:targets[i].user_id,stars:S.reviewStars,tag_punctual:legacyPunctual,tag_friendly:legacyFriendly,tag_again:legacyAgain,review_tags:selectedTags});
  }
  var outcome=await DB.rpc('submit_match_outcome',{p_match_id:matchId,p_result:'completed'});
  if(outcome.error){
    alert(String(outcome.error.message||'').indexOf('match_not_ready')!==-1?'終了時刻になってから回答できます。':'結果を保存できませんでした。もう一度お試しください。');
    return;
  }
  S.registration=null;S.match=null;S.matchMembers=[];S.form={area:null,slot:null,drink_style:null,purpose:null,ok_nodrink:false,timing:null,age_min:null,age_max:null,age_any:false};_isSubmitting=false;
  S.reviewStars=0;S.reviewChecks=[false,false,false];S.reviewOtherText='';S.chatMsgs=[];S.chargeId=null;go('splash');
}

async function submitDeactivationRequest(){
  var reasonEl=document.getElementById('withdraw-reason');
  var otherEl=document.getElementById('withdraw-other');
  var errEl=document.getElementById('withdraw-err');
  var btn=document.getElementById('withdraw-submit');
  var reason=reasonEl?reasonEl.value:'';
  var detail=otherEl?otherEl.value.trim():'';
  if(!reason){if(errEl)errEl.textContent='退会理由を選択してください';return;}
  if(reason==='その他'&&!detail){if(errEl)errEl.textContent='その他の理由をご入力ください';return;}
  if(!confirm('退会を申請しますか？\\n運営が確認後、アカウントを利用できない状態にします。'))return;
  if(btn){btn.disabled=true;btn.textContent='送信中...';}
  // 【2026/9/10 修正】改行が '\\\\n'（文字列）として保存されていたので '\\n' に修正。
  // 【2026/9/10 追加】退会後に profiles が消えると誰の申請か追えなくなるため、
  //   申請の時点でニックネームとメールアドレスをスナップショットとして残す。
  //   照合自体は user_id で可能だが、一覧を見ただけで判別できるようにする目的。
  var wNick=(S.profile&&S.profile.nickname)?S.profile.nickname:'';
  var wMail=(S.user&&S.user.email)?S.user.email:'';
  var content='【退会申請】このアカウントの退会を希望します。\n【退会理由】'+reason;
  if(detail)content+='\n【詳細】'+detail;
  content+='\n【申請時のニックネーム】'+(wNick||'（未設定）');
  content+='\n【申請時のメールアドレス】'+(wMail||'（不明）');
  var res=await DB.from('inquiries').insert({
    user_id:S.user.id,
    name:wNick||null,
    email:wMail||null,
    content:content
  });
  if(res.error){
    if(errEl)errEl.textContent=friendlyError(res.error,'送信に失敗しました。もう一度お試しください。');
    if(btn){btn.disabled=false;btn.textContent='退会を申請する';}
    return;
  }
  alert('退会申請を受け付けました。運営が確認後、対応いたします。');
  go('splash');
}

async function submitInquiry(){
  var nameEl=document.getElementById('inquiry-name');
  var emailEl=document.getElementById('inquiry-email');
  var content=document.getElementById('inquiry-content');
  var btn=document.getElementById('inquiry-btn');
  var errEl=document.getElementById('inquiry-err');
  var email=emailEl?emailEl.value.trim():'';
  if(!email){if(errEl)errEl.textContent='メールアドレスを入力してください';return;}
  if(!content||!content.value.trim()){if(errEl)errEl.textContent='お問い合わせ内容を入力してください';return;}
  if(btn){btn.disabled=true;btn.textContent='送信中...';}
  // 問い合わせは本人でも読み返せない決まりのため、IDはこちらで先に作って渡す
  var inquiryId=newUuid();
  var res=await DB.from('inquiries').insert({
    id:inquiryId,
    user_id:S.user?S.user.id:null,
    name:nameEl?nameEl.value.trim():'',
    email:email,
    content:content.value.trim()
  });
  if(res.error){if(errEl)errEl.textContent='送信に失敗しました';if(btn){btn.disabled=false;btn.textContent='送信する';}return;}
  // 運営への通知。宛先も文面もサーバーが決めるため、ここでは問い合わせのIDだけを渡す
  fetch('/api/send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'inquiry_notice',inquiryId:inquiryId})}).catch(function(){});
  S._inquiryDone=true;re('inquiry');
}

async function retryProfileLoad(){
  if(!S.user){go('email');return;}
  go('loading');
  await loadProfile();
  if(S._profileLoadFailed){go('profile_load_error');return;}
  if(S.user)await routeAfterLoad();
}

// バーを少しずつ右へ進める。
// 最初は速く、あとになるほど遅くする（残りが少ないほど慎重に見える）。
// 90%で止め、実際に読み込みが終わった時点で画面が切り替わる。
var _loadBarTimer=null;
function startLoadBar(){
  if(_loadBarTimer)return;
  var pct=8;
  _loadBarTimer=setInterval(function(){
    var el=document.getElementById('load-bar');
    if(!el){
      // 読み込み画面から離れたら止める
      clearInterval(_loadBarTimer);_loadBarTimer=null;return;
    }
    if(pct<90){
      // 進むほど1回あたりの increment を小さくする
      pct+=Math.max(1,(90-pct)*0.18);
      if(pct>90)pct=90;
      el.style.width=pct.toFixed(1)+'%';
    }
  },400);
}

function stopLoadBar(){
  if(_loadBarTimer){clearInterval(_loadBarTimer);_loadBarTimer=null;}
  S._loadStartedAt=null;
}

async function saveNewPassword(){
  // 2026/8/24：押しても画面が変わらず、通信が途切れたように見えていた。
  // 再設定メールを送る側（sendPasswordReset）と同じく、
  // 二重押しの防止と「保存中…」の表示を入れる。
  // 連打すると通信が重なって本当に失敗するため、防止は必須。
  if(S._savingNewPass)return;
  if(!S._recoveryReady)return;
  var pass=document.getElementById('newpass-inp').value;
  var errEl=document.getElementById('newpass-err');
  if(!pass||pass.length<6){if(errEl)errEl.textContent='パスワードは6文字以上です';return;}
  if(errEl)errEl.textContent='';
  S._savingNewPass=true;
  var btn=document.getElementById('newpass-btn');
  if(btn){btn.disabled=true;btn.style.opacity='.55';btn.textContent='保存中…';}
  var res=await DB.auth.updateUser({password:pass});
  S._savingNewPass=false;
  if(res.error){
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent='保存する';}
    if(errEl)errEl.textContent=friendlyError(res.error,'エラーが発生しました。もう一度お試しください。');
    return;
  }
  alert('パスワードを変更しました。もう一度ログインしてください。');
  await DB.auth.signOut();
  S.user=null;S.profile=null;
  S._recovering=false;S._recoveryReady=false;S._recoveryFailed=false;
  go('splash');
}

// 確認コードはサーバーが作り、サーバーが本人のメールアドレスへ送る。
// 画面側はコードの中身を一切受け取らない。
// 【動作の軽量化 8/15】
// 以前はメールの送信が終わるのを待ってから画面を切り替えていた。
// メール送信は外部のサーバーを経由するため数秒かかり、
// その間ずっとローディングのままで「重い」と感じる原因になっていた。
// 先に画面を出し、送信は裏側で進める形に変更した。
// 利用者はメールが届くまでどのみち待つので、画面を止めておく理由がない。
async function goEmailVerify(){
  go('email_verify');
  try{
    var s=await DB.auth.getSession();
    var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    if(token){
      // await を付けない（送信の完了を待たない）
      fetch('/api/send-email',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
        body:JSON.stringify({action:'verify_code'})}).catch(function(){});
    }
  }catch(e){}
}

var _everifyChecking=false;
async function submitEmailVerify(){
  if(_everifyChecking)return;
  var inp=document.getElementById('everify-inp');
  var errEl=document.getElementById('everify-err');
  var btn=document.getElementById('everify-btn');
  var code=inp?inp.value.trim():'';
  if(!code){if(errEl)errEl.textContent='コードを入力してください';return;}
  // 【押した瞬間に反応を返す 8/15】
  // 以前はボタンを押しても見た目が変わらず、通信が終わるまで無反応だったため、
  // 押せていないのかと思って待つことになっていた。
  _everifyChecking=true;
  if(btn){btn.disabled=true;btn.style.opacity='.55';btn.textContent='確認中…';}
  if(errEl)errEl.textContent='';
  // 照合はサーバー側で行う。画面側は正解のコードを持たない
  var ok=false;
  try{
    var ses=await DB.auth.getSession();
    var tk=ses&&ses.data&&ses.data.session?ses.data.session.access_token:null;
    if(!tk){if(errEl)errEl.textContent='ログインし直してください';return;}
    var vr=await fetch('/api/send-email',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},
      body:JSON.stringify({action:'verify_check',code:code})});
    var vj=await vr.json();
    ok=!!(vj&&vj.success);
    if(!ok&&vj&&vj.error==='expired'){_everifyChecking=false;if(errEl)errEl.textContent='コードの有効期限が切れました。もう一度お送りします';await goEmailVerify();return;}
  }catch(e){
    _everifyChecking=false;
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent='確認する →';}
    if(errEl)errEl.textContent='通信に失敗しました。もう一度お試しください';return;
  }
  if(ok){
    markEmailVerified();
    if(S.profile){
      await DB.from('profiles').update({email_verified:true}).eq('user_id',S.user.id);
      S.profile.email_verified=true;
      go('splash');
    }else{
      S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};
      go('profile_new');
    }
  }else{
    _everifyChecking=false;
    if(btn){btn.disabled=false;btn.style.opacity='1';btn.textContent='確認する →';}
    if(errEl)errEl.textContent='コードが違います';
  }
}

// 失敗するとアカウントに入れなくなるため、確実さを優先した。
async function restartSignUpWithNewEmail(){
  if(!confirm('別のメールアドレスで登録し直します。\n\n入力中の内容は破棄され、最初の画面に戻ります。よろしいですか？'))return;
  showBusy();
  try{ await DB.auth.signOut(); }catch(e){}
  S.user=null;S.profile=null;S.registration=null;S.match=null;
  S.error='';S.info='';
  S.authTab='register';
  hideBusy();
  go('email');
}

function confirmResendEmailCode(){
  if(confirm('確認コードを再送信しますか？'))goEmailVerify();
}

// LINE連携が完了した後の共通処理。BAN照合してから先へ進む
async function afterLineLinked(){
  var banCheck=await DB.rpc('is_current_user_blacklisted');
  if(banCheck.error){
    alert('利用状態を確認できませんでした。通信環境を確認して、もう一度お試しください。');
    return;
  }
  if(banCheck.data===true){
    await DB.auth.signOut();
    S.user=null;S.profile=null;S.registration=null;S.match=null;
    alert('ご利用いただけません。利用規約に違反したため、アカウントの作成を制限しています。');
    go('splash');
    return;
  }
  // 【順序を入れ替え 2026/8/22】LINE連携が先になったため、
  //   連携が終わった時点では本人確認がまだ済んでいないことがある。
  //   その場合は本人確認へ送る。済んでいればトップへ。
  var st=await getIdVerifyStatus();
  if(st!=='approved'){
    if(!st||st==='none'){ go('id_verify'); }
    else{ go('id_verify_pending'); }
    return;
  }
  S._showWelcomeToast=true;
  go('splash');
  maybeShowTicketGift();
}

async function checkLineLinkNow(silent){
  var res=await DB.from('profiles').select('line_user_id').eq('user_id',S.user.id).single();
  if(res.data&&res.data.line_user_id){
    if(S._lineLinkTimer){clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;}
    if(S.profile)S.profile.line_user_id=res.data.line_user_id;
    await afterLineLinked();
  }else if(!silent){
    alert('まだ連携が確認できていません。\n\n番号を送っても進まない場合は、そのLINEアカウントが既に別のNomi Goアカウントで使われている可能性があります。');
  }
}

var _lineResumeChecking=false;
async function resumeLineLinkCheck(){
  if(document.hidden||!S.user||S.screen!=='line_connect'||_lineResumeChecking)return;
  _lineResumeChecking=true;
  try{await checkLineLinkNow(true);}finally{_lineResumeChecking=false;}
}

function startLineLinkPolling(){
  if(S._lineLinkTimer)clearInterval(S._lineLinkTimer);
  S._lineLinkTimer=setInterval(async function(){
    if(S.screen!=='line_connect'){clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;return;}
    var res=await DB.from('profiles').select('line_user_id').eq('user_id',S.user.id).single();
    if(res.data&&res.data.line_user_id){
      clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;
      if(S.profile)S.profile.line_user_id=res.data.line_user_id;
      await afterLineLinked();
    }
  },3000);
}

async function saveProfileEdit(){
  var p=S.pf;
  if(!p.nickname||!p.gender){S.error='ニックネームと性別を入力してください';re('profile_edit');return;}
  if(PREFECTURES.indexOf(p.residence_prefecture)===-1){S.error='居住都道府県を選択してください';re('profile_edit');return;}
  if(p.gender==='male'&&!p.photoFile&&!(S.profile&&S.profile.photo_url)){S.error='男性はご本人の顔写真の登録が必須です';re('profile_edit');return;}
  go('loading');
  var photoUrl=S.profile.photo_url;
  if(p.photoFile){
    try{
      var uploaded=await uploadProfilePhoto(S.user.id,p.photoFile);
      if(uploaded)photoUrl=uploaded;
    }catch(e){
      S.error='写真のアップロードに失敗しました。通信環境をご確認のうえ、写真を選び直してもう一度お試しください。';
      re('profile_edit');

  if(upd.error){S.error=friendlyError(upd.error,'保存に失敗しました。もう一度お試しください。');re('profile_edit');return;}
  S.profile.nickname=p.nickname;S.profile.gender=p.gender;S.profile.residence_prefecture=p.residence_prefecture;S.profile.job=p.job;S.profile.smoke=p.smoke;S.profile.alcohol=p.alcohol;S.profile.photo_url=photoUrl;S.profile.tags=p.tags||[];

}
