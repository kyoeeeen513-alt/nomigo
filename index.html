<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nomi Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 【起動を速くするための書き方 2026/8/18】
     以前はここで普通に読み込んでいたため、日本語フォント3書体（計11の太さ）の
     ダウンロードが終わるまで画面が一切表示されず、
     iPhoneのホーム画面から開くと6秒ほど何も出ない状態だった。

     media="print" を付けると、ブラウザは「印刷用だから今すぐは要らない」と判断し、
     画面の表示を止めずに裏側で読み込む。読み終わった時点で onload により
     media を all に戻し、フォントを適用する。
     これにより見た目は最終的に同じまま、表示までの待ち時間だけがなくなる。

     フォントの種類・太さは一切減らしていない。見た目は変わらない。
     ただし読み込みが終わるまでの一瞬だけ、端末の標準フォントで表示される。 -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet"></noscript>

<!-- 【Supabaseの部品：defer を付けてはいけない 2026/8/18】
     ページの一番下にある init() が supabase を直接使っており、
     defer を付けるとこの読み込みが後回しになって init() が先に走り、
     supabase が未定義のままアプリが起動しなくなる。
     ここは従来どおり同期的に読み込むこと。
     （将来 init() の呼び出しを DOMContentLoaded まで遅らせる形に直せば、
       defer を付けて更に速くできる余地がある） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 【PAY.JP の読み込みを削除 2026/8/18】
     決済はCREDIXへ移行しており、PAY.JPは使っていない。
     2026/8/15にカード登録画面への導線もすべて撤去済み（No.56）。
     読み込むだけ起動が遅くなるため削除した。 -->
<style>
/* ===== デザイントークン（LPと統一） ===== */
:root{
  --night:#150A0C;--hero:#3A0E14;--bg:#1D0D10;--surface:#2A1014;--card:#31131A;
  --border:#5A2A32;--border2:#3A181E;
  --wine:#C9A063;--wine-bg:rgba(201,160,99,.14);--wine-true:#6B1A24;
  --cream:#F4E9DC;--muted:#C4B2A1;--lgray:#8A6E60;
  --gold:#C9A063;--gold-bright:#F3D9A4;--gold-bg:rgba(201,160,99,.16);
  --green:#7BC98F;--red:#FF8A6C;--red-bg:rgba(255,138,108,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
  /* 【日本語の折り返し 8/15】
     既定のままだと、日本語は文字の途中どこでも改行されるため、
     「使いま／す。」のように単語が割れて読みにくくなっていた。
     line-break:strict で句読点や小書き文字が行頭に来ないようにし、
     text-wrap:pretty で行末に1文字だけ残るような折り返しを減らす。
     どちらも対応していないブラウザでは無視されるだけで、害はない。 */
  line-break:strict;text-wrap:pretty;overflow-wrap:normal}
#app{min-height:100%;max-width:430px;margin:0 auto;background:transparent;display:flex;flex-direction:column;position:relative;z-index:1}
#ngo-fx{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;pointer-events:none;z-index:0;overflow:hidden}
#ngo-fx::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 320px 240px at 12% 4%,rgba(201,160,99,.10),transparent 60%),
  radial-gradient(ellipse 380px 300px at 90% 20%,rgba(107,26,36,.45),transparent 60%),
  radial-gradient(ellipse 300px 260px at 50% 100%,rgba(201,160,99,.06),transparent 60%);}
.ngo-bubble{position:absolute;bottom:-24px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 35% 30%,rgba(243,217,164,.35),rgba(243,217,164,.04));animation:bubbleRise linear infinite}
@keyframes bubbleRise{0%{transform:translateY(0);opacity:0}10%{opacity:.6}90%{opacity:.3}100%{transform:translateY(-105vh) translateX(24px);opacity:0}}
.screen,.match-wrap,.loading{position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* 無料チケットのお祝い（全画面） 2026/8/22 */
@keyframes ngoGiftIn{from{opacity:0}to{opacity:1}}
@keyframes ngoGiftPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.88);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes shine{0%{left:-80%}45%{left:130%}100%{left:130%}}
@keyframes glowSoft{0%,100%{box-shadow:0 8px 30px rgba(201,160,99,.22)}50%{box-shadow:0 10px 42px rgba(201,160,99,.4)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s !important;transition-duration:.01s !important}}
.verify-waiting{position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.verify-waiting-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:verifyPulse 2.6s ease-out infinite}
.verify-waiting-ring2{animation-delay:1.3s}
@keyframes verifyPulse{0%{transform:scale(.55);opacity:.7}70%{opacity:0}100%{transform:scale(1);opacity:0}}
.verify-waiting-core{width:56px;height:56px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;animation:breathe 2.6s ease-in-out infinite}
.verify-dots span{opacity:0;animation:verifyDot 1.4s infinite}
.verify-dots span:nth-child(1){animation-delay:0s}
.verify-dots span:nth-child(2){animation-delay:.2s}
.verify-dots span:nth-child(3){animation-delay:.4s}
@keyframes verifyDot{0%,80%,100%{opacity:0}40%{opacity:1}}
.screen{flex:1;display:flex;flex-direction:column}
/* 画面遷移のときだけ演出する。選択のたびに再生すると重く感じるため */
.anim-in{animation:fadeUp .32s cubic-bezier(.2,.8,.2,1) both}
.hdr{padding:16px 20px;border-bottom:1px solid var(--border2);flex-shrink:0;background:#241016;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.hdr-back{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted);padding:4px 0;font-weight:600;flex-shrink:0;transition:color .2s}
.hdr-back:active{color:var(--gold-bright)}
.hdr-info{flex:1}
.hdr-step{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.24em;margin-bottom:3px;font-family:'Zen Kaku Gothic New',sans-serif}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:.01em;font-family:'Shippori Mincho',serif}
.body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
.ftr{padding:14px 20px 30px;flex-shrink:0;border-top:1px solid var(--border2);background:#241016}
.btn{display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:900;border-radius:999px;transition:transform .18s,box-shadow .25s,opacity .2s;font-size:16px;padding:16px 20px;width:100%;letter-spacing:.04em}
/* 【動作の軽量化 8/15】
   以前はボタンの影を3.2秒周期で明滅させ（glowSoft）、光沢を3.4秒周期で
   横切らせていた（shine）。box-shadow と left のアニメーションは描画コストが高く、
   画面に何もしていない間もブラウザが計算し続けるため、
   画面切替の処理が後回しになり「押してから反応が遅い」原因になっていた。
   見た目の金色と影はそのまま残し、動き続ける部分だけを止めている。 */
.btn-wine{position:relative;overflow:hidden;color:var(--night);background:linear-gradient(135deg,var(--gold-bright),var(--gold));
  box-shadow:0 8px 30px rgba(201,160,99,.28)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;animation:none;box-shadow:none}
.btn:disabled::after{display:none}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:rgba(244,233,220,.06);
  color:var(--cream);font-family:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
.inp::placeholder{color:rgba(196,178,161,.5)}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,160,99,.14);background:rgba(244,233,220,.09)}
.inp.filled{border-color:rgba(201,160,99,.6);background:rgba(201,160,99,.08)}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 18px) calc(50% + 2px),calc(100% - 13px) calc(50% + 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
select.inp option{color:#3A2020;background:#fff}
input[type=date].inp{color-scheme:dark}
.sel-btn{flex:1;padding:14px 8px;border-radius:14px;border:1.5px solid var(--border);background:rgba(244,233,220,.04);
  color:var(--muted);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .18s;font-size:13px;font-weight:700}
.sel-btn:active{transform:scale(.97)}
.sel-btn.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold-bright);box-shadow:0 0 16px rgba(201,160,99,.18)}
.choice-btn{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--border);background:rgba(244,233,220,.04);
  color:var(--muted);font-family:inherit;cursor:pointer;text-align:left;font-size:14px;font-weight:600;transition:all .18s;display:flex;align-items:center;justify-content:space-between}
.choice-btn:active{transform:scale(.98)}
.choice-btn.on{border-color:var(--gold);background:var(--gold-bg);color:var(--cream)}
.range-row{display:flex;gap:6px;padding:0 20px}
.range-btn{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);background:rgba(244,233,220,.04);
  color:var(--muted);font-family:inherit;cursor:pointer;font-size:11px;font-weight:700;text-align:center;transition:all .18s}
.range-btn.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold-bright)}
.check-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;width:100%;font-family:inherit;text-align:left}
.check-item.on{border-color:var(--gold);background:var(--gold-bg)}
.tag-chip{display:inline-flex;align-items:center;padding:9px 16px;border-radius:999px;background:rgba(244,233,220,.04);
  border:1.5px solid var(--border);cursor:pointer;transition:all .18s;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tag-chip:active{transform:scale(.95)}
.tag-chip.on{border-color:var(--gold);background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--night)}
.tab-btn{flex:1;padding:12px;border:none;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:all .2s;letter-spacing:.04em}
.sec-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.28em;padding:18px 20px 8px;font-family:'Zen Kaku Gothic New',sans-serif}
.err-msg{font-size:12px;color:var(--red);padding:4px 0;text-align:center}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
/* ===== 起動画面（グラスが満ちる演出） ===== */
/* 画像を使わずCSSのみで描く。起動を遅くしないための制約。 */
.nl-glow{position:absolute;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,160,99,.20) 0%,rgba(201,160,99,0) 68%);
  animation:nlGlow 3.2s ease-in-out infinite}
.nl-cup{display:flex;flex-direction:column;align-items:center;gap:0}
.nl-glass{position:relative;width:62px;height:52px;
  border:2px solid rgba(201,160,99,.55);border-top:none;
  border-radius:6px 6px 30px 30px;overflow:hidden;
  background:rgba(255,255,255,.03)}
.nl-liquid{position:absolute;left:0;right:0;bottom:0;height:12%;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  animation:nlFill 2.6s ease-in-out infinite}
.nl-wave{position:absolute;top:-4px;left:-25%;width:150%;height:8px;
  border-radius:50%;background:var(--gold-bright);opacity:.85;
  animation:nlWave 1.9s ease-in-out infinite}
.nl-shine{position:absolute;top:6px;left:9px;width:7px;height:26px;
  border-radius:99px;background:rgba(255,255,255,.16)}
.nl-stem{width:2.5px;height:22px;background:rgba(201,160,99,.5)}
.nl-foot{width:38px;height:3px;border-radius:99px;background:rgba(201,160,99,.5)}
.nl-brand{font-size:19px;font-weight:900;color:var(--cream);
  letter-spacing:.02em}
@keyframes nlFill{0%{height:12%}55%{height:76%}100%{height:12%}}
@keyframes nlWave{0%,100%{transform:translateX(-8%)}50%{transform:translateX(8%)}}
@keyframes nlGlow{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .nl-liquid,.nl-wave,.nl-glow{animation:none}
  .nl-liquid{height:60%}
}
/* 待機画面のバー。
   起動画面のバーは読み込みの進み具合に応じてJavaScriptが幅を伸ばすが、
   待機画面はいつ終わるか分からないため、繰り返し流れる形にする。
   幅で進捗を偽ると「もうすぐ終わる」と誤解させるため、あえて往復させている。 */
.nl-busy-bar{width:40%;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
  animation:nlBusyBar 1.4s ease-in-out infinite}
@keyframes nlBusyBar{
  0%{transform:translateX(-110%)}
  100%{transform:translateX(360%)}
}
@media(prefers-reduced-motion:reduce){
  .nl-busy-bar{animation:none;width:100%;opacity:.5}
}
/* 起動時のバー。JavaScriptが動く前から進むよう、CSSだけで動かす。
   9割で止め、残りは実際に読み込みが完了した時点で画面が切り替わることで埋まる。 */
@keyframes bootbar{0%{width:8%}35%{width:55%}70%{width:78%}100%{width:90%}}
.drow{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--border2)}
.drow-k{font-size:12px;color:var(--lgray);letter-spacing:.04em}
.drow-v{font-size:14.5px;font-weight:800;color:var(--cream)}
.match-wrap{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:0 0 40px}
.member-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border2)}
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.chat-msgs::-webkit-scrollbar{width:0}
.msg-system{text-align:center;font-size:11px;color:var(--muted);padding:7px 16px;background:rgba(244,233,220,.05);border:1px solid var(--border2);border-radius:20px;align-self:center}
.msg-row{display:flex;gap:10px;align-items:flex-end;animation:fadeUp .25s ease both}
.msg-row.mine{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.msg-bubble{padding:11px 14px;border-radius:18px;font-size:14px;max-width:210px;line-height:1.6}
.msg-row.mine .msg-bubble{background:linear-gradient(135deg,#7A2230,var(--wine-true)) !important;color:#fff !important;border-bottom-right-radius:6px;box-shadow:0 3px 12px rgba(107,26,36,.4)}
.msg-row:not(.mine) .msg-bubble{border-bottom-left-radius:6px;border:1px solid var(--border2)}
.chat-input{padding:12px 16px;border-top:1px solid var(--border2);display:flex;gap:10px;background:#241016;flex-shrink:0}
.chat-inp{flex:1 1 auto;min-width:0;padding:12px 16px;border-radius:24px;border:1.5px solid var(--border);background:rgba(244,233,220,.06);color:var(--cream);font-family:inherit;font-size:15px;outline:none;transition:border-color .2s}
.chat-inp:focus{border-color:var(--gold)}
.chat-send{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:18px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--night);font-weight:900;box-shadow:0 4px 14px rgba(201,160,99,.35);transition:transform .15s}
.chat-send:active{transform:scale(.88)}
.star-btn{cursor:pointer;background:none;border:none;padding:4px;outline:none;-webkit-appearance:none;appearance:none;display:inline-flex;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.star-btn:active{transform:scale(1.25)}
.star-btn:focus-visible{outline:2px solid var(--gold) !important;outline-offset:2px;border-radius:6px}
.mode-card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;border:1.5px solid rgba(228,198,138,.2);transition:transform .3s,box-shadow .3s;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.mode-card:active{transform:scale(.98)}
.mode-card img{width:100%;height:180px;object-fit:cover;object-position:center;display:block}
.mode-card-square img{object-position:center 25%}
.mode-card-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(10,5,7,.9));padding:22px 16px 14px}
.mode-card-title{font-size:18px;font-weight:800;color:#fff;font-family:'Shippori Mincho',serif;letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.card-selected{border-color:var(--gold-bright) !important;box-shadow:0 0 0 3px rgba(243,217,164,.15),0 0 34px rgba(243,217,164,.45) !important;transition:box-shadow .15s,border-color .15s}
.area-card img{filter:saturate(.75) contrast(1.06) brightness(.85)}
.area-card-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,10,12,.2),rgba(21,10,12,.1) 40%,rgba(10,5,7,.75));pointer-events:none}
.area-card-label{position:absolute;bottom:0;left:0;right:0;padding:16px}
.area-card-title{font-size:22px;font-weight:800;color:var(--cream);letter-spacing:.05em;font-family:'Shippori Mincho',serif;text-shadow:0 2px 10px rgba(0,0,0,.7)}
/* 準備中エリア：LPと同じ斜めリボン */
.area-soon{opacity:.72;filter:grayscale(.3)}
.area-soon img{filter:saturate(.35) contrast(1) brightness(.5)}
.area-soon .area-card-title{font-size:17px;color:rgba(244,233,220,.55)}
.area-soon-ribbon-wrap{position:absolute;inset:0;overflow:hidden;border-radius:20px;pointer-events:none;z-index:3}
.area-soon-ribbon{position:absolute;top:16px;right:-42px;width:160px;transform:rotate(40deg);text-align:center;
  background:linear-gradient(135deg,rgba(228,198,138,.95),rgba(196,163,90,.95));color:var(--night);
  font-family:'Zen Kaku Gothic New',sans-serif;font-size:11px;font-weight:900;letter-spacing:.12em;padding:5px 0;
  box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(0,0,0,.15)}
.area-live-badge{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;z-index:3;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--night);font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:11px;font-weight:900;letter-spacing:.04em;padding:5px 11px;border-radius:999px;box-shadow:0 3px 10px rgba(201,160,99,.4)}
.area-live-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--night);animation:pulse 1.6s infinite}

// 従来はここで例外が発生し、後続の「画面の描き直し」に到達しないため、
// 写真を選んだ時点で以降のボタンがすべて反応しなくなっていた。

// 保存はあくまで入力内容の一時退避であり、失敗しても画面の動作は続けてよい。
(function(){
  try{
    var _origSet=sessionStorage.setItem.bind(sessionStorage);
    sessionStorage.setItem=function(k,v){
      try{
        _origSet(k,v);

        try{
          var o=JSON.parse(v);

            delete o.photoPreview;

// ===== 日本語を意味の区切りで折り返すための部品 =====
//
// 日本語は単語の間にスペースがないため、ブラウザは
// 「どこで切ってよいか」を判断できず、文字の途中どこでも改行する。
// その結果「ご入力くださ／い。」のように語が割れて読みにくくなる。
//
// CSSの line-break や text-wrap では、この「文節で切る」制御はできない
// （それを行う word-break:auto-phrase は一部のブラウザにしか実装がない）。
//
// そこで、割りたくない塊を display:inline-block で囲む。
// inline-block は中身が入りきる限り内部で改行されないため、
// 塊ごとに折り返されるようになる。
// 長すぎる塊を渡すと結局その中で折り返されるので、
// 20文字前後を目安に区切って使うこと。
function nb(t){return '<span style="display:inline-block">'+t+'</span>';}

function escapeHtml(str){
  if(str==null)return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function calcAgeFromBirthdate(bd){
  if(!bd)return null;
  var b=new Date(bd);
  var today=new Date();
  var age=today.getFullYear()-b.getFullYear();
  var mdiff=today.getMonth()-b.getMonth();
  if(mdiff<0||(mdiff===0&&today.getDate()<b.getDate()))age--;
  return age;
}

function newUuid(){
  try{ if(window.crypto&&window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0, v=(c==='x')?r:((r&0x3)|0x8);
    return v.toString(16);
  });
}

function digitsOnly(el){
  var v=el.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  el.value=v.replace(/[^0-9]/g,'');
}

async function checkCandidatePool(){
  try{
    var res=await DB.rpc('count_new_candidates');
    var row=res.data&&res.data[0];
    if(!row)return;
    S._poolWaiting=row.waiting_total;
    S._poolNew=row.new_candidates;
    if(S.screen==='waiting')render();
  }catch(e){}
}
function startPoolCheck(){
  if(S._poolTimer)clearInterval(S._poolTimer);
  if(S._remainTimer)clearInterval(S._remainTimer);
  S._remainTimer=setInterval(function(){
    if(S.screen!=='waiting'){clearInterval(S._remainTimer);S._remainTimer=null;return;}
    render();
  },60000);
  checkCandidatePool();
  S._poolTimer=setInterval(function(){
    if(S.screen!=='waiting'){clearInterval(S._poolTimer);S._poolTimer=null;return;}
    expireMyRegistrationIfNeeded().then(function(ended){
      if(ended){render();return;}
      checkCandidatePool();
    });
  },30000);
}
function stopPoolCheck(){
  if(S._poolTimer){clearInterval(S._poolTimer);S._poolTimer=null;}

  // カード登録画面へ強制的に送っていた。PAY.JPを使う前提の名残であり、

      S._reportTargetUserId=opponentR?opponentR.user_id:null;
      go('report');
    }else{
      go('splash');
    }

  }
  var lastScreen2=sessionStorage.getItem('ngo_screen');
  var restorable=['area_select','mode_select','recruit','profile_edit','terms','privacy','inquiry','faqbot','forgot_password'];
  var recruitFlowScreens=['area_select','mode_select','recruit'];

// ===== 写真の縮小 =====
// スマホの写真はそのままだと数MBあり、文字データに変換すると一時保存の上限を超える。
// またiPhoneのフォトライブラリの写真はHEIC形式のことがあり、そのままでは表示できない。
// 表示・保存・アップロードのすべてに使えるよう、長辺1200pxのJPEGに縮小してから扱う。
// 縮小に失敗した場合も、必ずcbを呼んで画面の動作を止めない。
function shrinkImage(file,maxSide,quality,cb){
  var done=false,url=null;
  function finish(f,d){
    if(done)return;done=true;
    if(url){try{URL.revokeObjectURL(url);}catch(e){}}
    cb(f,d);
  }
  var guard=setTimeout(function(){finish(null,null);},10000);
  try{
    url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      clearTimeout(guard);
      try{
        var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h){finish(null,null);return;}
        var scale=Math.min(1,maxSide/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
        var cv=document.createElement('canvas');
        cv.width=cw;cv.height=ch;
        cv.getContext('2d').drawImage(img,0,0,cw,ch);
        var dataUrl=cv.toDataURL('image/jpeg',quality);
        cv.toBlob(function(blob){
          var f=null;
          if(blob){
            try{f=new File([blob],'photo_'+Date.now()+'.jpg',{type:'image/jpeg'});}
            catch(e){f=blob;}
          }
          finish(f,dataUrl);
        },'image/jpeg',quality);
      }catch(e){finish(null,null);}
    };
    img.onerror=function(){clearTimeout(guard);finish(null,null);};
    img.src=url;
  }catch(e){clearTimeout(guard);finish(null,null);}
}

// 【顔の自動判定は撤去 8/15】
// プロフィール写真に人の顔が写っているかを端末上で判定する仕組みを一度入れたが、
// 判定用のプログラムとモデルの読み込みに時間がかかり、その間ほかの項目にも
// 触れなくなった。初めて使う人にはバグと受け取られるため撤去した。
// プロフィール写真は一次的なものであり、本人性の確認は
// 身分証と自撮りの照合（永澤による目視承認）が担う。
// 体験を損なってまでここで判定する必要はないと判断した。

async function uploadProfilePhoto(userId,file){
  if(!file)return null;
  var ext=(file.name&&file.name.split('.').pop())||'jpg';
  var path=userId+'/'+Date.now()+'.'+ext;
  var up=await DB.storage.from('avatars').upload(path,file,{upsert:true});
  if(up.error)return null;
  var pub=DB.storage.from('avatars').getPublicUrl(path);
  return pub.data&&pub.data.publicUrl?pub.data.publicUrl:null;
}

// ===== エラー文の日本語化 =====
// DBやネットワークが返す英語のメッセージを、そのまま利用者に見せない。
// 内部構造を外に見せないためでもある。
function friendlyError(err,fallback){
  var m='';
  try{m=String((err&&(err.message||err.msg))||err||'');}catch(e){}
  var low=m.toLowerCase();
  if(low.indexOf('permission denied')!==-1||low.indexOf('row-level security')!==-1||low.indexOf('42501')!==-1){
    return 'この操作は許可されていません。時間をおいてもう一度お試しください。';
  }
  if(low.indexOf('duplicate key')!==-1||low.indexOf('23505')!==-1){
    return 'すでに登録があります。内容をご確認ください。';
  }
  if(low.indexOf('failed to fetch')!==-1||low.indexOf('networkerror')!==-1||low.indexOf('timeout')!==-1||low.indexOf('load failed')!==-1){
    return '通信に失敗しました。電波の良い場所でもう一度お試しください。';
  }
  if(low.indexOf('jwt')!==-1||low.indexOf('token')!==-1||low.indexOf('session')!==-1){
    return 'ログインの有効期限が切れました。もう一度ログインしてください。';
  }
  return fallback||'うまくいきませんでした。もう一度お試しください。';
}

// 本名+生年月日 で blacklist と突き合わせる。
// user_id だけでBANしてもメールを変えれば再登録できてしまうため、
// 変えにくい情報（身分証と一致する本名・生年月日）で照合する。

//   以前は oninput のたびに画面全体を作り直していた（re('profile_new')）。

async function isBlacklisted(realName,birthdate){
  if(!realName||!birthdate)return false;
  try{
    var res=await DB.from('blacklist').select('id')
      .eq('real_name',realName.trim())
      .eq('birthdate',birthdate)
      .limit(1);
    if(res.error)return false; // 照合に失敗しても登録は止めない（誤ブロック防止）
    return !!(res.data&&res.data.length>0);
  }catch(e){return false;}
}
// LINE IDでの照合（連携完了後にチェック）
async function isLineBlacklisted(lineUserId){
  if(!lineUserId)return false;
  try{
    var res=await DB.from('blacklist').select('id').eq('line_user_id',lineUserId).limit(1);
    if(res.error)return false;
    return !!(res.data&&res.data.length>0);
  }catch(e){return false;}
}

async function saveProfile(){
  var p=S.pf;
  if(!p.nickname||!p.age||!p.gender||!p.job||p.smoke===null||p.alcohol===null){S.error='すべての項目を入力してください';re('profile_new');return;}
  if(!p.realname||!p.realname.trim()){S.error='本名を入力してください';re('profile_new');return;}
  if(!p.birthdate){S.error='生年月日を入力してください';re('profile_new');return;}
  if(parseInt(p.age)<20){S.error='Nomi Goは20歳以上の方がご利用いただけます';re('profile_new');return;}
  var bd=new Date(p.birthdate);
  var today=new Date();
  var calcAge=today.getFullYear()-bd.getFullYear();
  var mdiff=today.getMonth()-bd.getMonth();
  if(mdiff<0||(mdiff===0&&today.getDate()<bd.getDate()))calcAge--;
  if(calcAge<20){S.error='生年月日から20歳未満と判定されました。Nomi Goは20歳以上限定です';re('profile_new');return;}
  if(parseInt(p.age)!==calcAge){S.error='年齢と生年月日が一致しません（生年月日からは'+calcAge+'歳です）。どちらかをご確認ください';re('profile_new');return;}
  if(p.gender==='male'&&!p.photoFile){S.error='男性はご本人の顔写真の登録が必須です';re('profile_new');return;}
  var banned=await isBlacklisted(p.realname,p.birthdate);
  if(banned){S.error='ご利用いただけません。利用規約に違反したため、アカウントの作成を制限しています。';re('profile_new');return;}
  go('loading');
  var photoUrl=p.photoFile?await uploadProfilePhoto(S.user.id,p.photoFile):null;
  // 【チケット枚数と確認レベルは画面から送らない 2026/8/21】
  //   以前はここで ticket_count:1（男性）を送っていたが、
  //   枚数を画面側が決めて送る作りは、送る値を書き換えられると
  //   いくらでもチケットを増やせてしまう。
  //   無料付与を行うかどうかはDB側（app_settings と trg_grant_welcome_ticket）が判断する。
  //   verified_level も同じ理由で送らない。DB側の既定値に任せる。
  var saved=await DB.from('profiles').upsert({user_id:S.user.id,nickname:p.nickname,age:parseInt(p.age),gender:p.gender,job:p.job,smoke:p.smoke,alcohol:p.alcohol,photo_url:photoUrl,tags:p.tags||[],real_name:p.realname.trim(),birthdate:p.birthdate,email_verified:isEmailVerified(),id_verify_status:'none',updated_at:new Date().toISOString()});
  if(saved.error){
    // 同一人物（本名＋生年月日）での2つ目のアカウント作成は、DB側で禁止している。
    // お一人につき1アカウントという規約（第4条）を、実際に担保するための処理。
    var m=String(saved.error.message||'');
    if(saved.error.code==='23505'||m.indexOf('duplicate key')!==-1||m.indexOf('uniq_profiles_person')!==-1){
      S.error='この氏名・生年月日では既に登録があります。Nomi Goはお一人につき1アカウントまでです。心当たりがない場合は、お問い合わせからご連絡ください。';
    }else{
      S.error=friendlyError(saved.error,'登録に失敗しました。もう一度お試しください。');
    }
    re('profile_new');return;
  }
  await DB.from('user_stats').upsert({user_id:S.user.id});
  // 実際に付与されたチケット枚数をDBから読み直す。
  // 画面側で枚数を決めていないため、DBに聞かないと本当の枚数が分からない。
  // 無料付与が行われるかは app_settings.welcome_ticket_male 次第であり、
  // 運営がSQLで切り替えられる（No.128）。
  var granted=0;
  try{
    var tc=await DB.from('profiles').select('ticket_count').eq('user_id',S.user.id).single();
    if(tc.data&&tc.data.ticket_count)granted=tc.data.ticket_count;
  }catch(e){}
  S.profile={user_id:S.user.id,nickname:p.nickname,age:parseInt(p.age),gender:p.gender,job:p.job,smoke:p.smoke,alcohol:p.alcohol,photo_url:photoUrl,tags:p.tags||[],real_name:p.realname.trim(),birthdate:p.birthdate,email_verified:isEmailVerified(),id_verify_status:'none',ticket_count:granted};
  // 実際に配られたときだけ知らせる。配られていないのに文言を出すと嘘になる。
  // 【2026/8/22 表示時期を変更】以前はこの直後にお祝いを出していたが、
  //   本人確認もLINE連携もこれからという段階で出るため早すぎるとの指摘を受けた。

// ===== 顔写真撮影機能（ここから追加） =====
var _faceStream=null;
var _faceDetectTimer=null;
var _faceStableCount=0;
var _faceCaptured=false;
var _faceCountdownTimer=null;
var _faceCountdownValue=0;

async function openFaceCamera(){
  S._faceCameraError='';
  S._faceCameraStatus='searching';
  _faceStableCount=0;
  _faceCaptured=false;
  _faceCountdownValue=0;
  if(_faceCountdownTimer){clearInterval(_faceCountdownTimer);_faceCountdownTimer=null;}
  re('id_verify');
  try{
    _faceStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  }catch(e){
    S._faceCameraError='カメラを起動できませんでした。カメラの利用を許可してください。';
    re('id_verify');
    return;
  }
  S._faceCameraOpen=true;
  re('id_verify');
  setTimeout(function(){
    var video=document.getElementById('face-camera-video');
    if(video){
      video.srcObject=_faceStream;
      video.play();
      startFaceDetectLoop(video);
    }
  },150);
}

// 枠の中央エリアを一定間隔でサンプリングし、「顔らしきもの（肌色・十分な明るさ）」が
// 安定して映っているかを簡易判定する。厳密な顔認識ではなく簡易的な近似判定。
function startFaceDetectLoop(video){
  if(_faceDetectTimer)clearInterval(_faceDetectTimer);
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  canvas.width=60;canvas.height=80;
  _faceDetectTimer=setInterval(function(){
    if(_faceCaptured||!video||video.readyState<2)return;
    try{
      ctx.drawImage(video,video.videoWidth*0.3,video.videoHeight*0.15,video.videoWidth*0.4,video.videoHeight*0.55,0,0,60,80);
      var data=ctx.getImageData(0,0,60,80).data;
      var skinPixels=0,totalBrightness=0,count=0;
      for(var i=0;i<data.length;i+=4){
        var r=data[i],g=data[i+1],b=data[i+2];
        var brightness=(r+g+b)/3;
        totalBrightness+=brightness;
        count++;
        // ざっくりとした肌色レンジ判定
        if(r>60&&g>35&&b>20&&r>g&&r>b&&(r-g)>10&&(r-b)>10){skinPixels++;}
      }
      var avgBrightness=totalBrightness/count;
      var skinRatio=skinPixels/count;
      var looksLikeFace=avgBrightness>40&&avgBrightness<235&&skinRatio>0.18;

      if(looksLikeFace){
        _faceStableCount++;
      }else{
        _faceStableCount=0;
        // 顔が外れたらカウントダウンを中断してやり直し
        if(_faceCountdownTimer){clearInterval(_faceCountdownTimer);_faceCountdownTimer=null;}
        S._faceCameraStatus='searching';
        updateFaceCameraStatusUI();
      }

      // 目安：判定間隔150msで4回連続安定 = 約0.6秒キープしたらカウントダウン開始
      if(_faceStableCount>=4&&!_faceCaptured&&!_faceCountdownTimer){
        startFaceCountdown();
      }
    }catch(e){}
  },150);
}

// 3→2→1のカウントダウンを表示し、0になったら撮影する
function startFaceCountdown(){
  _faceCountdownValue=3;
  S._faceCameraStatus='counting';
  updateFaceCameraStatusUI();
  _faceCountdownTimer=setInterval(function(){
    _faceCountdownValue--;
    if(_faceCountdownValue<=0){
      clearInterval(_faceCountdownTimer);_faceCountdownTimer=null;
      if(_faceCaptured)return;
      _faceCaptured=true;
      S._faceCameraStatus='captured';
      updateFaceCameraStatusUI();
      setTimeout(function(){captureFacePhoto();},200);
      return;
    }
    updateFaceCameraStatusUI();
  },800);
}

// 画面全体を再描画せず、状態テキスト・カウントダウン数字・ガイド枠の色だけを直接書き換える（カメラ映像の再マウントを防ぐ）
function updateFaceCameraStatusUI(){
  var label=document.getElementById('face-status-label');
  var ring=document.getElementById('face-guide-ring');
  var countEl=document.getElementById('face-countdown-num');
  var wrap=document.getElementById('face-guide-wrap');
  if(!label||!ring)return;
  if(S._faceCameraStatus==='counting'){
    label.innerHTML='⚠️ そのまま動かないでください';
    label.style.background='rgba(224,150,40,.92)';
    ring.style.borderColor='rgba(123,224,144,.95)';
    ring.style.borderWidth='4px';
    ring.classList.add('face-ring-counting');
    if(wrap)wrap.classList.add('face-wrap-counting');
    if(countEl){countEl.textContent=_faceCountdownValue>0?_faceCountdownValue:'';countEl.style.display='flex';}
  }else if(S._faceCameraStatus==='captured'){
    label.innerHTML='✓ 撮影しました！';
    label.style.background='rgba(123,224,144,.92)';
    ring.style.borderColor='rgba(123,224,144,.95)';
    ring.style.borderWidth='4px';
    ring.classList.remove('face-ring-counting');
    if(wrap)wrap.classList.remove('face-wrap-counting');
    if(countEl)countEl.style.display='none';
  }else{
    label.innerHTML='枠の中に顔を合わせてください';
    label.style.background='rgba(0,0,0,.5)';
    ring.style.borderColor='rgba(255,255,255,.85)';
    ring.style.borderWidth='3px';
    ring.classList.remove('face-ring-counting');
    if(wrap)wrap.classList.remove('face-wrap-counting');
    if(countEl)countEl.style.display='none';
  }
}

function closeFaceCamera(){
  if(_faceDetectTimer){clearInterval(_faceDetectTimer);_faceDetectTimer=null;}
  if(_faceCountdownTimer){clearInterval(_faceCountdownTimer);_faceCountdownTimer=null;}
  if(_faceStream){
    _faceStream.getTracks().forEach(function(t){t.stop();});
    _faceStream=null;
  }
  S._faceCameraOpen=false;
  re('id_verify');
}

function captureFacePhoto(){
  var video=document.getElementById('face-camera-video');
  if(!video)return;
  if(_faceDetectTimer){clearInterval(_faceDetectTimer);_faceDetectTimer=null;}
  if(_faceCountdownTimer){clearInterval(_faceCountdownTimer);_faceCountdownTimer=null;}
  var canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  var ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  canvas.toBlob(function(blob){
    if(!blob)return;
    S._facePhotoFile=new File([blob],'face_'+Date.now()+'.jpg',{type:'image/jpeg'});
    S._facePhotoPreview=canvas.toDataURL('image/jpeg');
    closeFaceCamera();
  },'image/jpeg',0.9);
}

}

var _idVerifySubmitting=false;
async function submitIdVerify(){
  if(_idVerifySubmitting)return;
  if(!S._idPhotoFile){S.error='身分証の写真を選んでください';re('id_verify');return;}
  if(!S._facePhotoFile){S.error='顔写真も撮影してください';re('id_verify');return;}
  _idVerifySubmitting=true;
  go('loading');
  var sessionCheck=await DB.auth.getSession();
  var hasSession=!!(sessionCheck.data&&sessionCheck.data.session);
  var result=await uploadIdPhoto(S.user.id,S._idPhotoFile);
  if(!result.path){
    _idVerifySubmitting=false;
    S.error=hasSession?'写真のアップロードに失敗しました。電波の良い場所でもう一度お試しください。':'ログインの有効期限が切れました。もう一度ログインしてください。';
    re('id_verify');
    return;
  }
  var faceResult=await uploadFacePhoto(S.user.id,S._facePhotoFile);
  if(!faceResult.path){
    _idVerifySubmitting=false;
    S.error='顔写真のアップロードに失敗しました。もう一度お試しください。';
    re('id_verify');
    return;
  }
  var path=result.path;
  var facePath=faceResult.path;
  var upd=await DB.from('profiles').update({id_photo_url:path,face_photo_url:facePath,id_verify_status:'pending'}).eq('user_id',S.user.id).select('user_id,id_verify_status').single();
  _idVerifySubmitting=false;
  if(upd.error){S.error=friendlyError(upd.error,'保存に失敗しました。もう一度お試しください。');re('id_verify');return;}
  S.profile.id_photo_url=path;
  S.profile.face_photo_url=facePath;
  S.profile.id_verify_status='pending';
  S._idPhotoFile=null;S._idPhotoPreview=null;S._facePhotoFile=null;S._facePhotoPreview=null;
  notifyIdVerifyPending();
  go('id_verify_pending');
  startIdVerifyPolling();
}

// 申請があったことを運営に知らせる。送り先と文面はサーバーが決めるため、ここでは渡さない。
// 失敗しても申請そのものには影響させない。
async function notifyIdVerifyPending(){
  try{
    var s=await DB.auth.getSession();
    var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    if(!token)return;
    await fetch('/api/admin',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({action:'notify_pending'})
    });
  }catch(e){}
}

function startIdVerifyPolling(){
  if(S._idVerifyTimer)clearInterval(S._idVerifyTimer);
  S._idVerifyTimer=setInterval(async function(){
    if(S.screen!=='id_verify_pending'){clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;return;}
    var res=await DB.from('profiles').select('id_verify_status').eq('user_id',S.user.id).single();
    if(res.data&&res.data.id_verify_status==='approved'){
      clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;
      S.profile.id_verify_status='approved';
      await goAfterIdApproved();
    }else if(res.data&&res.data.id_verify_status==='rejected'){
      clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;
      S.profile.id_verify_status='rejected';
      re('id_verify_pending');
    }
  },5000);
}

async function checkIdVerifyNow(){

async function loadStats(){

// ===== トップ画面「今夜のノミゴー待ち」カード =====
// 実際に募集中の異性のデータを、テキストのみ（写真・アイコンなし）で数秒おきに入れ替え表示する。
// 年齢は「20代後半」のように丸めて個人特定を防ぐ。架空データは絶対に混ぜない（0人ならカード非表示）。
function ageBand(age){
  if(!age)return '';
  var dec=Math.floor(age/10)*10;
  var half=(age%10<5)?'前半':'後半';
  return dec+'代'+half;
}
async function loadWaitFeed(){
  try{
    if(!S.user||!S.profile||!S.profile.gender){S._waitFeed=[];return;}
    var opp=S.profile.gender==='male'?'female':'male';
    // 「今募集中」だけでなく、昨日〜今日（過去48時間）に実際に募集した人まで対象を広げる。
    // 架空データは絶対に混ぜない（実データのみ）。今募集中の人を先頭に出す。
    var since=new Date(Date.now()-48*60*60*1000).toISOString();
    var regs=await DB.from('registrations').select('user_id,area_id,drink_style,purpose,gender,age,status,created_at').eq('gender',opp).in('status',['waiting','matched','completed']).gte('created_at',since).order('created_at',{ascending:false}).limit(12);
    if(!regs.data||!regs.data.length){S._waitFeed=[];return;}
    // 同じ人が複数回募集していても1回だけ表示
    var seen={},uniq=[];
    regs.data.forEach(function(r){if(!seen[r.user_id]){seen[r.user_id]=true;uniq.push(r);}});
    // 今募集中を先頭に
    uniq.sort(function(a,b){return (b.status==='waiting'?1:0)-(a.status==='waiting'?1:0);});
    uniq=uniq.slice(0,6);
    var feed=[];
    for(var i=0;i<uniq.length;i++){
      var r=uniq[i];
      // 他人のプロフィールは直接読めない（RLS）。表示に必要な項目だけ関数経由で取得する。
      var prRes=await DB.rpc('get_feed_profile',{p_user_id:r.user_id});
      var pr={data:(prRes.data&&prRes.data[0])||null};
      feed.push({
        live:r.status==='waiting',
        band:ageBand(r.age),
        gender:r.gender==='male'?'男性':'女性',
        job:pr.data&&pr.data.job?pr.data.job:'',
        area:areaName(r.area_id),
        style:r.drink_style||'',
        purpose:r.purpose?purposeLabel(r.purpose):'',
        tag:pr.data&&pr.data.tags&&pr.data.tags.length?pr.data.tags[0]:''
      });
    }
    S._waitFeed=feed;
  }catch(e){S._waitFeed=[];}
}
function waitFeedItemH(f){
  var line1=[f.band,f.gender,f.job].filter(function(x){return x;}).join('・');
  var line2=[f.area,f.style].filter(function(x){return x;}).join('｜');
  if(f.tag)line2+=(line2?'｜':'')+f.tag;
  var badge=f.live
    ?'<span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:#7BE090;margin-left:6px"><span style="width:5px;height:5px;border-radius:50%;background:#7BE090;display:inline-block;animation:pulse 1.5s infinite"></span>募集中</span>'
    :'<span style="font-size:10px;color:rgba(237,229,224,.45);margin-left:6px">最近の募集</span>';
  return '<div style="animation:fadeUp .4s ease both"><div style="font-size:13.5px;font-weight:800;color:var(--cream)">'+escapeHtml(line1)+badge+'</div><div style="font-size:11.5px;color:rgba(237,229,224,.7);margin-top:3px">'+escapeHtml(line2)+'</div>'+(f.purpose?'<div style="font-size:11px;color:var(--gold);font-weight:700;margin-top:3px">'+f.purpose+'</div>':'')+'</div>';
}
function startWaitFeed(){
  stopWaitFeed();
  loadWaitFeed().then(function(){
    if(S.screen==='splash'&&S._waitFeed&&S._waitFeed.length)render();
  });
  S._waitFeedIdx=0;
  S._waitFeedTimer=setInterval(function(){
    if(S.screen!=='splash'){stopWaitFeed();return;}
    if(!S._waitFeed||!S._waitFeed.length)return;
    S._waitFeedIdx=(S._waitFeedIdx+1)%S._waitFeed.length;
    var el=document.getElementById('wait-feed-body');
    if(el)el.innerHTML=waitFeedItemH(S._waitFeed[S._waitFeedIdx]);
  },4500);
  S._waitFeedReload=setInterval(function(){
    if(S.screen!=='splash'){stopWaitFeed();return;}
    loadWaitFeed();
  },60*1000);
}
function stopWaitFeed(){
  if(S._waitFeedTimer){clearInterval(S._waitFeedTimer);S._waitFeedTimer=null;}
  if(S._waitFeedReload){clearInterval(S._waitFeedReload);S._waitFeedReload=null;}
}
function waitFeedCardH(){
  if(!S._waitFeed||!S._waitFeed.length)return '';
  return '<div style="background:rgba(0,0,0,.22);border:1px solid rgba(201,160,99,.35);border-radius:12px;padding:14px 16px;margin-bottom:20px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="font-size:14px">🍷</span><span style="font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.08em">今夜のノミゴー待ち</span></div><div id="wait-feed-body" style="min-height:44px">'+waitFeedItemH(S._waitFeed[S._waitFeedIdx||0])+'</div></div>';
}

// エリアごとの現在募集中の人数を取得する（エリア選択画面で「今このエリアで◯人が募集中」を出すため）
async function loadAreaStats(){
  // 期限切れの募集の後片付け。
  // 期限切れで自動終了する処理は本人がアプリを開いている間しか動かないため、
  // 募集したまま閉じられた行が waiting のまま残り続ける。表示は各所で除外して
  // いるので利用者には見えないが、集計値が狂い、将来どこか1箇所で除外を
  // 書き忘れた際に実在しない待機者が表示される事故につながる。
  // エリア選択画面は誰かがアプリを使うたびに必ず開かれるため、ここで片付ける。
  // 失敗しても人数表示は続行させる（片付けは表示の前提条件ではない）。
  try{await DB.rpc('expire_stale_registrations');}catch(e){}
  try{
    var res=await DB.from('registrations').select('area_id').eq('status','waiting').gt('expires_at',new Date().toISOString());
    var counts={};
    AREAS.forEach(function(a){counts[a.id]=0;});
    if(res.data){
      res.data.forEach(function(r){
        if(counts[r.area_id]!=null)counts[r.area_id]++;
      });
    }
    S.areaStats=counts;
  }catch(e){S.areaStats=S.areaStats||{};}
}

// 押した直後に必ず反応を返すための簡易インジケーター。
// 画面全体を作り直さないので即座に出る。
// 【2026/8/21 起動画面と同じ見た目に統一】
//   以前は灰色の輪（spinner）だけだった。待機中に何も説明がないと、
//   利用者は「押せていない」と感じて何度も押したり離脱したりする。
//   とくに決済へ進む場面では外部サイトへ移るまでに間があるため影響が大きい。
//   起動画面（body直下のHTML直書き版・loadingH）と同じ構造にしてあるので、
//   グラス・ブランド名・バーの並びまで揃う。
//   見た目を変えるときは3箇所すべてを同時に直すこと。
function showBusy(){
  if(document.getElementById('ngo-busy'))return;
  var d=document.createElement('div');
  d.id='ngo-busy';
  d.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex';
  d.innerHTML='<div class="loading">'
    +'<div class="nl-glow"></div>'
    +'<div class="nl-cup">'
      +'<div class="nl-glass"><div class="nl-liquid"><div class="nl-wave"></div></div><div class="nl-shine"></div></div>'
      +'<div class="nl-stem"></div><div class="nl-foot"></div>'
    +'</div>'
    +'<div class="nl-brand">Nomi Go</div>'
    +'<div style="font-size:11.5px;color:var(--muted);letter-spacing:.02em">少しお待ちください</div>'
    +'<div style="width:180px;height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden">'
      +'<div class="nl-busy-bar"></div>'
    +'</div>'
  +'</div>';
  document.body.appendChild(d);
}
function hideBusy(){
  var d=document.getElementById('ngo-busy');
  if(d&&d.parentNode)d.parentNode.removeChild(d);
}

// 【外部サイトから戻ってきたときの後始末 8/15】
// CREDIXの決済ページへ移るとき、ぐるぐる（showBusy）を出したまま画面を離れる。
// ブラウザの「戻る」で復帰すると、ブラウザは離脱直前の状態をそのまま復元するため、
// ぐるぐるが出っぱなしになり、操作できなくなっていた。

  // 通常の読み込みでも念のため後始末しておく（出ていなければ何も起きない）。
  hideBusy();
  _ticketPurchasing=false;
  _isSubmitting=false;
});

var _goRecruitBusy=false;
async function goRecruit(){
  if(_goRecruitBusy)return;
  if(!S.user){go('email');return;}
  if(!S.profile){
    // 登録が途中の状態。メール確認を終えていなければ確認画面へ戻す
    if(!isEmailVerified()){go('email_verify');return;}
    S.pf={nickname:'',age:'',gender:null,job:null,smoke:null,alcohol:null};go('profile_new');return;
  }
  if(S.match&&S.registration&&S.registration.status==='matched'){
    alert('現在マッチ中です。現在のマッチが終了すると、新しいお相手を探せます。');
    return;
  }
  if(S.profile.gender==='male'&&!S.profile.photo_url){
    alert('募集にはご本人の顔写真の登録が必要になりました。プロフィール編集から顔写真を登録してください。');
    goProfileEdit();
    return;
  }
  _goRecruitBusy=true;
  showBusy();
  try{
    // 以前は「キャンセル回数 → カード → 本人確認 → LINE → エリア人数」を1つずつ順番に
    // 問い合わせていたため、押してから画面が変わるまで2秒近くかかっていた。
    // 必要な情報をまとめて一度に取り、同時に実行することで待ち時間を短くする。
    var results=await Promise.all([
      DB.from('profiles').select('stripe_customer_id,id_photo_url,id_verify_status,line_user_id,photo_url').eq('user_id',S.user.id).single(),
      DB.from('registrations').select('id',{count:'exact',head:true}).eq('user_id',S.user.id).eq('status','cancelled').not('match_id','is',null),
      loadAreaStats()
    ]);
    var me=results[0], cancelCheck=results[1];
    if(!me.error&&me.data&&S.profile){
      S.profile.stripe_customer_id=me.data.stripe_customer_id;
      S.profile.id_photo_url=me.data.id_photo_url;
      S.profile.id_verify_status=me.data.id_verify_status;
      S.profile.line_user_id=me.data.line_user_id;
    }
    var d=(!me.error&&me.data)?me.data:{};

    // 【カード登録の関門を撤去 8/15】
    // 以前はここで「カードが登録されていなければ cardregister へ送る」判定があり、
    // 募集を始める前にカード登録を必須にしていた。
    // これはPAY.JPを使う前提で作られたもので、CREDIXでは成立しない。
    // CREDIXではカード番号の入力を決済ページ側で行うため、
    // 募集の前にカードを登録させる理由がなく、この関門があると
    // 利用者全員が動かない画面で詰んでしまう。
    // カードの取得はチケット購入時にCREDIX側で行われる（No.56で導線を作り直す）。

    // 【順序を入れ替え 2026/8/22】以前は「本人確認 → LINE連携」の順だった。
    //   本人確認は身分証の撮影と自撮りの2つを求めるため負荷が高く、
    //   ここで離れた人とは連絡手段がないまま関係が切れてしまう。
    //   実際に女性の実ユーザー第1号が本人確認の未提出のまま止まり、
    //   LINE未連携のため声をかける手段がなかった（No.144）。
    //   LINEを先に済ませておけば、本人確認で止まっても後から呼び戻せる。
    // LINE連携は募集の前提条件。未連携なら連携画面へ。
    // LINEは1アカウントにつき1つしか紐づけられないため、複数アカウントの抑止にもなる。
    // マッチ成立の通知が確実に届くことは、無断キャンセルの判断の前提でもある。
    if(!d.line_user_id){await goLineConnect();return;}

    var idStatus=!d.id_photo_url?'none':(d.id_verify_status||'pending');
    if(idStatus!=='approved'){
      if(idStatus==='none'){go('id_verify');}else{go('id_verify_pending');}
      return;
    }

    // 確認の呼びかけは、画面を切り替える直前に出す（待ち時間中に出さない）
    if(cancelCheck.count!=null&&cancelCheck.count>=2){
      hideBusy();
      var proceed=confirm('過去にマッチ成立後のキャンセルが2回以上あります。マッチ成立後のキャンセルにはペナルティが発生します。このまま募集を続けますか？');
      if(!proceed)return;
    }
    go('area_select');
  }catch(e){
    alert('通信に失敗しました。もう一度お試しください。');
  }finally{
    _goRecruitBusy=false;
    hideBusy();
  }
}

async function getIdVerifyStatus(){
  if(!S.user)return 'none';
  var res=await DB.from('profiles').select('id_photo_url,id_verify_status').eq('user_id',S.user.id).single();
  if(res.error||!res.data)return 'none';
  if(S.profile){S.profile.id_photo_url=res.data.id_photo_url;S.profile.id_verify_status=res.data.id_verify_status;}
  if(!res.data.id_photo_url)return 'none';
  return res.data.id_verify_status||'pending';
}

// 一緒に来るお友だちにも、法律上、身分証による年齢確認が必要になる。
// そのため「年齢を選ぶ」方式をやめ、お友だちにも登録と本人確認を
// 済ませていただいたうえで、招待リンクから参加を確定してもらう形にした。
// 招待リンクの有効期限は発行から24時間。期限はサーバー側が決めるため、
// 利用者が延ばすことはできない。

// 自分の組の状態を読み込む
async function loadPairStatus(){
  S._pair=null;
  try{
    var res=await DB.rpc('my_pair_status');
    var row=res.data&&res.data[0];
    if(!row)return;
    S._pair={
      token:row.out_token,
      role:row.out_my_role,
      status:row.out_status,
      expiresAt:row.out_expires_at,
      partnerUserId:row.out_partner_user_id,
      partnerNickname:row.out_partner_nickname,
      partnerAge:row.out_partner_age,
      partnerPhotoUrl:row.out_partner_photo_url,
      partnerVerified:row.out_partner_verified===true
    };
  }catch(e){}
}

async function goPairInvite(){
  showBusy();
  try{ await loadPairStatus(); }finally{ hideBusy(); }
  go('pair_invite');
}

// 招待リンクを発行する
var _pairIssuing=false;
async function issuePairInvite(){
  if(_pairIssuing)return;
  _pairIssuing=true;
  showBusy();
  try{
    var res=await DB.rpc('create_pair_invite');
    if(res.error){
      alert(friendlyError(res.error,'招待リンクを作成できませんでした。'));
      return;
    }
    await loadPairStatus();
    re('pair_invite');
  }catch(e){
    alert(friendlyError(e,'招待リンクを作成できませんでした。'));
  }finally{
    _pairIssuing=false;hideBusy();
  }
}

function pairInviteUrl(){
  if(!S._pair||!S._pair.token)return '';
  return window.location.origin+'/?pair='+S._pair.token;
}

function copyPairInviteUrl(){
  var url=pairInviteUrl();
  if(!url)return;
  var done=function(){alert('招待リンクをコピーしました。LINEなどでお友だちに送ってください。');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done,function(){fallbackCopy(url,done);});
    }else{ fallbackCopy(url,done); }
  }catch(e){ fallbackCopy(url,done); }
}
function fallbackCopy(text,cb){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }catch(e){ alert('コピーできませんでした。リンクを長押しして選択してください。'); }
}

// 組を解除する
async function cancelPair(){
  if(!confirm('お友だちとの組を解除しますか？\n解除すると、もう一度招待からやり直しになります。'))return;
  showBusy();
  try{
    var res=await DB.rpc('cancel_pair_invite');

    if(res.error||!row||!row.out_ok){
      alert((row&&row.out_message)||friendlyError(res.error,'解除できませんでした。'));
      return;
    }
    await loadPairStatus();
    re('pair_invite');
  }finally{ hideBusy(); }
}

async function isCardRegistered(){
  if(!S.user)return false;
  var res=await DB.from('profiles').select('stripe_customer_id').eq('user_id',S.user.id).single();
  if(res.error||!res.data)return false;
  var hasCard=!!res.data.stripe_customer_id;
  if(S.profile)S.profile.stripe_customer_id=res.data.stripe_customer_id;
  return hasCard;
}

async function startRecruit(){
  if(_isSubmitting)return;
  var f=S.form;
  if(!f.area||!f.slot||!f.drink_style||!f.purpose){S.error='すべて選択してください';re('recruit');return;}
  // 2対2は、お友だちの参加が確定していないと募集できない。
  // 以前は年齢を選ぶだけだったが、それでは一緒に来る方の年齢を確かめたことにならない。
  // 本人確認まで済ませた登録者どうしでなければ組めない仕組みに変えた。
  if(f.mode==='2v2'){
    if(!S._pair||S._pair.status!=='accepted'||!S._pair.partnerVerified){
      S.error='2対2は、お友だちの参加が確定してから募集できます';
      re('recruit');return;
    }
  }
  if(S.profile&&S.profile.gender==='male'){
    if(!S.profile.ticket_count||S.profile.ticket_count<1){S.error='ticket_zero';re('recruit');return;}
  }
  _isSubmitting=true;
  await doRegister();
}

async function confirmCardRegister(){
  var btn=document.getElementById('cardreg-btn');
  var errEl=document.getElementById('cardreg-err');
  var alreadyRegistered=await isCardRegistered();
  if(alreadyRegistered){
    goAfterCardRegister();
    return;
  }
  if(!_payjp||!_payjpCardEl){if(errEl)errEl.textContent='カードが読み込まれていません';return;}
  if(btn){btn.disabled=true;btn.textContent='処理中...';}
  try{
    var r=await _payjp.createToken(_payjpCardEl);
    if(r.error){if(errEl)errEl.textContent=friendlyError(r.error,'カード情報をご確認ください。');if(btn){btn.disabled=false;btn.textContent='カードを登録する →';}return;}
    var regRes=await fetch('/api/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'register_card',token:r.id,description:'Nomi Go ユーザー'})});
    var regData=await regRes.json();
    if(!regData.success){if(errEl)errEl.textContent=regData.error||'カード登録に失敗しました';if(btn){btn.disabled=false;btn.textContent='カードを登録する →';}return;}
    var custUpd=await DB.from('profiles').update({stripe_customer_id:regData.customer_id}).eq('user_id',S.user.id);
    if(custUpd.error){if(errEl)errEl.textContent=friendlyError(custUpd.error,'カード情報の保存に失敗しました。もう一度お試しください。');if(btn){btn.disabled=false;btn.textContent='カードを登録する →';}return;}
    S.profile.stripe_customer_id=regData.customer_id;
    goAfterCardRegister();
  }catch(e){if(errEl)errEl.textContent=friendlyError(e,'エラーが発生しました。もう一度お試しください。');if(btn){btn.disabled=false;btn.textContent='カードを登録する →';}}
}

var _ticketPurchasing=false;

// ===== 決済前の個人情報の同意 =====
//
// 決済ページへ進む前に、決済代行事業者へ個人情報を提供することについて
// 本人の同意を取得します。
//
// 【設計の理由】
//  画面のチェックボックスだけで済ませると、あとから「同意を取った証拠」が
//  どこにも残りません。そこで同意の記録はサーバー（/api/credix-start）が行い、
//  記録できなければ決済セッションを発行しない作りにしています。
//  これにより、同意なしで決済に到達する経路が構造的に存在しなくなります。
//
// 【文面の版】
//  画面から文面そのものを送ると、ブラウザ側で書き換えられます。
//  そのため送るのは版の番号だけで、保存する文面はサーバーが持ちます。
//  文面を変えたときは、必ずこの版の番号とサーバー側の番号を同時に上げること。
//

// 画面を開いたとき、同意事項の枠が途中から表示されることがあるため、
// 描画の直後に必ず先頭（「1. 提供する先」）へ戻す。
// 冒頭が切れた状態で見えると、1番を見落としたまま同意されてしまう。
// あわせてチェックも外す（前回の状態が残らないようにするため）。
function resetPayConsentScroll(){
  setTimeout(function(){
    var el=document.getElementById('payconsent-scroll');
    if(el)el.scrollTop=0;
    var c=document.getElementById('payconsent-check');
    if(c)c.checked=false;
    updatePayConsentBtn();
  },0);
}

function updatePayConsentBtn(){  var c=document.getElementById('payconsent-check');
  var b=document.getElementById('payconsent-btn');
  if(!c||!b)return;
  b.disabled=!c.checked;
  b.style.opacity=c.checked?'1':'.45';
}

function proceedPayConsent(){
  var c=document.getElementById('payconsent-check');
  var errEl=document.getElementById('payconsent-err');
  if(errEl)errEl.textContent='';
  if(!c||!c.checked){
    if(errEl)errEl.textContent='同意のチェックを入れてください。';
    return;
  }
  chargeForTicket();
}

// チケット購入の開始。
//
// 【以前の作りとの違い】
//  以前は、決済のあとブラウザから profiles.ticket_count を「現在値＋1」で
//  書き換えていました。しかしDB側のガードが、利用者によるチケットの自己加算を
//  打ち消すため、この更新は静かに無効化されていました。エラーは出ないため
//  画面には「購入完了」と表示され、実際には1枚も増えないという状態でした。
//  修正すべきはガードではなく、この画面側の処理のほうです。
//
//  現在は、チケットの付与はサーバー（/api/credix-notify）だけが行います。
//  この画面がすることは、次の2つだけです。
//   ① サーバーに購入の開始を伝え、決済ページへ送る値を受け取る
//   ② 受け取った値をそのままCREDIXの決済ページへ送る
//  金額をこの画面で決めることはありません。
async function chargeForTicket(){
  if(_ticketPurchasing)return;
  _ticketPurchasing=true;
  showBusy();
  try{
    var s=await DB.auth.getSession();
    var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    if(!token){
      _ticketPurchasing=false;hideBusy();
      alert('ログインの有効期限が切れています。もう一度ログインしてください。');
      return;
    }

    var res=await fetch('/api/credix-start',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      // 同意した事実と、同意した文面の版を伝える。
      // 文面そのものは送らない（書き換えられるため）。
      // サーバーは同じ版の文面を保存し、保存できた場合だけ決済へ進ませる。
      body:JSON.stringify({consent:true,consent_version:PAY_CONSENT_VERSION})
    });
    var data=null;
    try{ data=await res.json(); }catch(e){ data=null; }

    if(!res.ok||!data||!data.success){
      _ticketPurchasing=false;hideBusy();
      var msg='現在チケットを購入できません。時間をおいてお試しください。';
      if(data&&data.error==='not_male'){msg='チケットのご購入は男性の方のみとなります。';}
      if(data&&data.error==='unauthorized'){msg='ログインの有効期限が切れています。もう一度ログインしてください。';}
      // 同意が届いていない、または同意の記録に失敗した場合。
      // この場合は決済へ進ませない（同意の記録がないまま決済されるのを防ぐため）。
      if(data&&data.error==='consent_required'){msg='個人情報の提供への同意が確認できませんでした。もう一度お試しください。';}
      if(data&&data.error==='consent_version_mismatch'){msg='同意いただく内容が更新されています。画面を再読み込みしてから、もう一度お試しください。';}
      if(data&&data.error==='consent_save_failed'){msg='同意の記録に失敗したため、決済を中止しました。時間をおいてお試しください。';}
      alert(msg);
      return;
    }

    // CREDIXの決済ページへ送り出す。
    // 送る値はすべてサーバーが作ったもので、この画面では作りません。
    var form=document.createElement('form');
    form.method='POST';
    form.action=data.action;
    form.style.display='none';
    // 【2つの決済方式に対応する 2026/8/17】
    // サーバーが「どちらの方式で進めるか」を決めて mode で教えてくれる。
    //
    //   repeater … 2回目以降。CREDIXが保存しているカード情報を使うため、
    //              カード番号の入力が不要。送るのは clientip と sid だけ。
    //              金額もカードIDもCREDIX側がセッションとして持っている。
    //   first    … 初回、またはカードの有効期限が切れている場合。
    //              カード番号の入力画面へ進むため、金額などを送る。
    //
    // どちらになるかを画面側で判断してはいけない。
    // カードが保存されているかどうかを正しく知っているのはCREDIXだけであり、
    // 画面側で推測すると実態とずれて購入できなくなる。
    var fields;
    if(data.mode==='repeater'&&data.sid){
      fields={clientip:data.clientip,sid:data.sid};
    }else{
      fields={clientip:data.clientip,money:data.money,sendid:data.sendid,sendpoint:data.sendpoint};
    }
    Object.keys(fields).forEach(function(k){
      var input=document.createElement('input');
      input.type='hidden';
      input.name=k;
      input.value=fields[k];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    // ここでCREDIXの決済ページへ移動します。
    // 戻ってきたときは、サーバーが受け取った決済結果にもとづいて
    // チケットの枚数が更新されています。
  }catch(e){
    _ticketPurchasing=false;hideBusy();
    alert(friendlyError(e,'通信に失敗しました。もう一度お試しください。'));
  }
}


async function doRegister(){
  go('loading');
  var timeoutFlag={hit:false};
  var timeoutId=setTimeout(function(){
    timeoutFlag.hit=true;
    _isSubmitting=false;
    S.error='通信に時間がかかっています。もう一度お試しください。';
    re('recruit');
  },10000);
  try{
    var existing=await DB.from('registrations').select(REG_COLS).eq('user_id',S.user.id).eq('status','waiting').single();
    if(timeoutFlag.hit)return;
    if(existing.data){clearTimeout(timeoutId);_isSubmitting=false;S.registration=existing.data;startPolling();go('waiting');return;}
    var ins=await DB.from('registrations').insert({
      user_id:S.user.id,
      area_id:S.form.area,
      slot:S.form.slot,
      mode:S.form.mode||'1v1',
      gender:S.profile.gender,
      drink_style:S.form.drink_style,
      purpose:S.form.purpose||null,
      ok_nodrink:!!S.form.ok_nodrink,
      timing:'どちらでもOK',
      duration_pref:S.form.slot==='今すぐ'?(S.form.duration_pref||null):null,
      age_any:!!S.form.age_any,
      age_min:S.form.age_any?null:parseInt(S.form.age_min),
      age_max:S.form.age_any?null:parseInt(S.form.age_max),
      age:S.profile.age,
      smoke:S.profile.smoke,
      alcohol:S.profile.alcohol,
      status:'waiting'
    }).select(REG_COLS).single();
    if(timeoutFlag.hit)return;
    if(ins.error){clearTimeout(timeoutId);_isSubmitting=false;S.error=friendlyError(ins.error,'募集の登録に失敗しました。もう一度お試しください。');re('recruit');return;}
    clearTimeout(timeoutId);
    S.registration=ins.data;
    var matched=await tryMatch();
    if(matched==='choice'){_isSubmitting=false;return;}
    // 登録が成功した場合も「送信中」の札を必ず下ろす。
    // ここが抜けていると、次に募集画面へ戻ったとき、条件をすべて選んでも
    // 参加登録ボタンが光らないままになる。
    _isSubmitting=false;
    if(matched===true){go('matched');}else{startPolling();go('waiting');}
  }catch(e){clearTimeout(timeoutId);if(!timeoutFlag.hit){_isSubmitting=false;S.error=friendlyError(e,'募集の登録に失敗しました。もう一度お試しください。');re('recruit');}}
}

// 画面へのデバッグ表示は本番では出さない。
// 調査が必要になったら NGO_DEBUG を true にすると画面下にログが出る。
var NGO_DEBUG=false;
function dbgLog(msg){
  if(!NGO_DEBUG)return;
  try{
    var box=document.getElementById('ngo-dbg');
    if(!box){
      box=document.createElement('div');
      box.id='ngo-dbg';
      box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:rgba(0,0,0,.88);color:#7CFC7C;font:11px/1.5 monospace;padding:8px 10px;z-index:99999;white-space:pre-wrap;word-break:break-all';
      document.body.appendChild(box);
    }
    var t=new Date();
    var hh=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
    box.textContent=hh+'  '+msg+'\n'+box.textContent;
  }catch(e){}
}

// ===== 飲みスタイルの相性判定 =====
// 同じスタイル同士はOK。片方が「ご飯メイン」でも、相手が「ご飯メインの人とでもOK」なら成立する
function drinkCompat(myStyle,myOk,theirStyle,theirOk){
  if(myStyle===theirStyle)return true;
  if(myStyle==='ご飯メイン'&&theirOk)return true;
  if(theirStyle==='ご飯メイン'&&myOk)return true;
  return false;
}

// 候補の優先度スコア：目的一致 > 年齢の近さ
function candidateScore(c){
  var score=0;
  var myPurpose=(S.registration&&S.registration.purpose)||S.form.purpose;
  if(myPurpose&&c.purpose&&c.purpose===myPurpose)score+=100;
  var myAge=S.profile&&S.profile.age?S.profile.age:25;
  score-=Math.abs((c.age||myAge)-myAge);
  return score;
}

async function tryMatch(){
  if(!S.registration){dbgLog('S0: registration=null');return false;}
  var p=S.profile;
  if(!p){dbgLog('S0: profile=null');return false;}
  dbgLog('tryMatch開始 gender='+p.gender);

  // マッチの実行は女性側の端末のみが行う（女性が候補を確認・選択する設計のため）。
  // 男性側は startPolling で自分の状態が matched になるのを待つだけ。
  if(p.gender!=='female'){dbgLog('S1: 男性のため待機');return false;}

  // 検索条件は必ず S.registration（DBから読んだ自分の募集）から取る。
  // S.form は画面の入力状態なので、待機中の再読み込み等で消えることがある。
  var R=S.registration;
  if(R.expires_at&&new Date(R.expires_at).getTime()<=Date.now()){dbgLog('S2x: 自分の募集が期限切れ');return false;}
  dbgLog('S2: area='+R.area_id+' slot='+R.slot+' mode='+R.mode);
  if(!R.area_id||!R.slot){dbgLog('S2x: area/slot欠落');return false;}

  var candidates=await DB.from('registrations').select(REG_COLS).eq('status','waiting').eq('area_id',R.area_id).eq('mode',R.mode||'1v1').neq('gender',p.gender).neq('user_id',S.user.id);
  if(candidates.error){dbgLog('S3err: '+candidates.error.message);return false;}
  dbgLog('S3: 候補'+((candidates.data&&candidates.data.length)||0)+'件');
  if(!candidates.data||candidates.data.length===0){return false;}

  // 一度マッチした相手とは再度マッチさせない。
  // 会った後は連絡先を交換している前提のため、同じ相手を繰り返し出さない方針。
  // 取得に失敗した場合は空配列として扱い、マッチング自体は止めない。
  var pastIds={};
  try{
    var past=await DB.rpc('get_past_partner_ids');
    if(past.data){past.data.forEach(function(x){pastIds[x.user_id]=true;});}
  }catch(e){}
  dbgLog('S3b: 過去マッチ'+Object.keys(pastIds).length+'人を除外対象に');

  var nowMs=Date.now();
  var filtered=candidates.data.filter(function(c){
    // 期限が切れた募集は候補にしない。
    // 何時間も前の募集が生きていると、本人が忘れた頃にマッチが成立し、
    // 無断キャンセルの原因になる。
    if(c.expires_at&&new Date(c.expires_at).getTime()<=nowMs){dbgLog('  除外(期限切れ) '+c.id.slice(0,8));return false;}
    if(pastIds[c.user_id]){dbgLog('  除外(過去にマッチ済み) '+c.id.slice(0,8));return false;}
    if(!drinkCompat(R.drink_style,R.ok_nodrink,c.drink_style,c.ok_nodrink)){dbgLog('  除外(飲み方) '+c.id.slice(0,8));return false;}
    var iWantThem=ageMatches(R.age_any,R.age_min?parseInt(R.age_min):null,R.age_max?parseInt(R.age_max):null,c.age);
    var theyWantMe=ageMatches(c.age_any,c.age_min,c.age_max,p.age);
    if(!iWantThem){dbgLog('  除外(自分の年齢希望) '+c.id.slice(0,8));return false;}
    if(!theyWantMe){dbgLog('  除外(相手の年齢希望) '+c.id.slice(0,8));return false;}
    return true;
  });
  dbgLog('S4: 条件通過'+filtered.length+'件');
  if(filtered.length===0){return false;}

  // 2対2では、相手も2人組で参加している。
  // そのまま並べると同じ組の2人が別々の候補として出てしまい、
  // 「どちらと飲むか」の選択肢に同じ組の2人が並んでしまう。
  // 組ごとに1件だけ残し、さらに2人そろっている組だけを候補にする。
  if((R.mode||'1v1')==='2v2'){
    var byPair={};
    filtered.forEach(function(c){
      if(!c.pair_id)return;
      if(!byPair[c.pair_id])byPair[c.pair_id]=[];
      byPair[c.pair_id].push(c);
    });
    var pairFiltered=[];
    Object.keys(byPair).forEach(function(pid){
      // 2人そろっていない組は、4人での飲み会が成立しないので候補にしない
      if(byPair[pid].length>=2){
        // 組を代表する1件だけを候補にする（募集した本人を優先）
        var host=byPair[pid].filter(function(x){return x.pair_role==='host';})[0];
        pairFiltered.push(host||byPair[pid][0]);
      }else{
        dbgLog('  除外(組が揃っていない) pair='+pid.slice(0,8));
      }
    });
    filtered=pairFiltered;
    dbgLog('S4b: 組に整理 '+filtered.length+'組');
    if(filtered.length===0){return false;}
  }

  // 目的一致・年齢の近さで並べ替え
  filtered.sort(function(a,b){return candidateScore(b)-candidateScore(a);});

  // ----- 候補が1人：そのまま自動成立 -----
  if(filtered.length===1){
    var only=filtered[0];
    var lock1=await DB.from('registrations').update({status:'processing'}).eq('id',only.id).eq('status','waiting').select(REG_COLS).single();
    dbgLog('S5: 単独候補ロック '+(lock1.error?('失敗 '+lock1.error.message):(lock1.data?'成功':'データなし')));
    if(lock1.error||!lock1.data)return false;
    return await finalizeMatchWith(only,null);
  }

  // ----- 候補が2人以上：上位2人を確保して2択画面へ -----
  var c1=filtered[0],c2=filtered[1];
  var lockA=await DB.from('registrations').update({status:'processing'}).eq('id',c1.id).eq('status','waiting').select(REG_COLS).single();
  if(lockA.error||!lockA.data){return false;}
  var lockB=await DB.from('registrations').update({status:'processing'}).eq('id',c2.id).eq('status','waiting').select(REG_COLS).single();
  if(lockB.error||!lockB.data){
    // 2人目を確保できなかったら1人目とそのまま成立
    return await finalizeMatchWith(c1,null);
  }
  // マッチ前の候補確認用。本名・生年月日などは返さない関数を使う。
  var pr1r=await DB.rpc('get_candidate_profile',{p_user_id:c1.user_id});
  var pr2r=await DB.rpc('get_candidate_profile',{p_user_id:c2.user_id});
  var pr1={data:(pr1r.data&&pr1r.data[0])||null};
  var pr2={data:(pr2r.data&&pr2r.data[0])||null};
  c1.profileData=pr1.data||{};
  c2.profileData=pr2.data||{};
  S._choice={cands:[c1,c2],deadline:Date.now()+90*1000,submitting:false};
  if(S.pollTimer){clearInterval(S.pollTimer);S.pollTimer=null;}
  go('choose');
  startChoiceCountdown();
  return 'choice';
}

// ===== マッチ確定処理（選ばれた相手と成立させ、選ばれなかった相手は募集中に戻す）=====
// ===== マッチの成立 =====
// 【重要】成立の処理はすべてサーバー側の関数 finalize_match が行う。
//   理由は2つ。
//   ① 2対2では男性が2人いる。以前の作りは「1マッチにつき1枚」しか消費できず、
//      2人目のチケットが引かれないまま飲み会が成立してしまう状態だった。
//   ② 途中で失敗したとき、マッチだけできてチケットが引かれない、
//      といった中途半端な状態が残らないようにするため。
//   サーバー側では、参加者全員が本人確認済みであることと、
//   男性全員がチケットを持っていることを最後にもう一度確かめている。
async function finalizeMatchWith(bestReg,otherReg){
  var res=await DB.rpc('finalize_match',{p_partner_reg_id:bestReg.id});
  if(res.error){
    dbgLog('S6err: 成立失敗 '+res.error.message);
    // 選ばれなかった候補は募集中に戻す（本人には何も通知されない）
    if(otherReg)await DB.from('registrations').update({status:'waiting'}).eq('id',otherReg.id).eq('status','processing');
    S.error=friendlyError(res.error,'マッチの成立に失敗しました。もう一度お試しください。');
    return false;
  }
  var row=res.data&&res.data[0];
  if(!row||!row.out_match_id){
    if(otherReg)await DB.from('registrations').update({status:'waiting'}).eq('id',otherReg.id).eq('status','processing');
    return false;
  }
  var matchId=row.out_match_id;
  dbgLog('S8: マッチ成立 '+matchId.slice(0,8));

  // 選ばれなかった候補を募集中に戻す
  if(otherReg)await DB.from('registrations').update({status:'waiting'}).eq('id',otherReg.id).eq('status','processing');

  var m=await DB.from('matches').select('*').eq('id',matchId).single();
  if(m.data)S.match=m.data;

  var reg=await DB.from('registrations').select(REG_COLS).eq('user_id',S.user.id).eq('match_id',matchId).single();
  if(reg.data)S.registration=reg.data;

  await syncUserState();
  await loadMatchMembers();
  sendMatchLineNotify(matchId);
  render();
  return true;
}

function startChoiceCountdown(){
  if(S._choiceTimer)clearInterval(S._choiceTimer);
  S._choiceTimer=setInterval(function(){
    if(!S._choice){clearInterval(S._choiceTimer);S._choiceTimer=null;return;}
    var remain=Math.max(0,Math.ceil((S._choice.deadline-Date.now())/1000));
    var el=document.getElementById('choice-timer');
    if(el)el.textContent=remain+'秒';
    if(remain<=0){
      clearInterval(S._choiceTimer);S._choiceTimer=null;
      // 時間切れ：条件一致度が高い方（1人目）と自動成立
      submitChoice(0,true);
    }
  },500);
}

async function submitChoice(idx,isAuto){
  if(!S._choice||S._choice.submitting)return;
  S._choice.submitting=true;
  if(S._choiceTimer){clearInterval(S._choiceTimer);S._choiceTimer=null;}
  var chosen=S._choice.cands[idx];
  var other=S._choice.cands[idx===0?1:0];
  go('loading');
  var ok=await finalizeMatchWith(chosen,other);
  S._choice=null;
  if(ok){go('matched');}
  else{
    // 成立に失敗したら募集中に戻る
    startPolling();
    go('waiting');
  }
}

async function consumeTicket(matchId,targetUserId){

  // サーバー側の関数に処理を任せる。二重消費の防止も関数内で行っている。
  var res=await DB.rpc('consume_ticket',{p_match_id:matchId,p_user_id:targetUserId});
  if(res.error){dbgLog('T1x: 消費失敗 '+res.error.message);return;}

function startPolling(){
  if(S.pollTimer)clearInterval(S.pollTimer);
  dbgLog('polling開始 reg='+(S.registration?S.registration.id.slice(0,8):'null'));
  S._procSince=null;
  S.pollTimer=setInterval(async function(){
    try{
      if(S.registration){
        var reg=await DB.from('registrations').select(REG_COLS).eq('id',S.registration.id).single();
        // 検索条件が消えないよう、毎回DBの内容で自分の募集情報を上書きしておく
        if(reg.data)S.registration=reg.data;
        // 相手（女性）の選択待ちで自分が processing のまま長時間経過した場合の自己復旧
        // （女性側のアプリが途中で閉じられた等の保険。4分で自動的に募集中へ戻す）
        if(reg.data&&reg.data.status==='processing'){
          if(!S._procSince)S._procSince=Date.now();
          if(Date.now()-S._procSince>4*60*1000){
            await DB.from('registrations').update({status:'waiting'}).eq('id',S.registration.id).eq('status','processing');
            S._procSince=null;
          }
        }else{S._procSince=null;}
        if(reg.data&&reg.data.status==='matched'&&reg.data.match_id){
          clearInterval(S.pollTimer);
          var m=await DB.from('matches').select('*').eq('id',reg.data.match_id).single();
          if(m.data){
            S.registration.status='matched';
            S.registration.match_id=reg.data.match_id;
            S.match=m.data;await loadMatchMembers();_isSubmitting=false;go('matched');return;
          }
        }
      }
      var matched=await tryMatch();
      if(matched==='choice'){_isSubmitting=false;return;}
      if(matched===true){clearInterval(S.pollTimer);_isSubmitting=false;go('matched');}
      loadStats();
    }catch(e){dbgLog('pollErr: '+e.message);}
  },8000);
}

async function setMatchResultOnce(matchId,newStatus,extraFields){
  if(!matchId)return false;
  var updateData=Object.assign({status:newStatus},extraFields||{});
  var res=await DB.from('matches').update(updateData).eq('id',matchId).eq('status','confirmed').select('id,status').single();
  if(res.error||!res.data){
    return false;
  }
  return true;
}

async function saveUserResult(matchId,userResult){
  if(!matchId||!S.user)return;
  var cur=await DB.from('matches').select('*').eq('id',matchId).single();
  if(cur.error||!cur.data)return;
  var m=cur.data;
  var updateData={};
  var otherResult=null;

  if(!m.result_a_user_id){
    updateData.result_a=userResult;
    updateData.result_a_user_id=S.user.id;
    otherResult=null;
  }else if(m.result_a_user_id===S.user.id){
    return;
  }else if(!m.result_b_user_id){
    updateData.result_b=userResult;
    updateData.result_b_user_id=S.user.id;
    otherResult=m.result_a;
  }else if(m.result_b_user_id===S.user.id){
    return;
  }else{
    return;
  }

  if(otherResult){
    var myResult=userResult;
    var theirResult=otherResult;
    if(myResult==='completed'&&theirResult==='completed'){
      updateData.verdict='normal';
    }else if(myResult==='cancelled'&&theirResult==='cancelled'){
      updateData.verdict='both_cancelled';
    }else{
      updateData.verdict='needs_review';
    }
  }

  if(Object.keys(updateData).length>0){
    await DB.from('matches').update(updateData).eq('id',matchId);
  }
}

// マッチから3時間経っても「飲み終わった」アクションが無い人に、アプリ内バナーとLINEで通知
var REMIND_AFTER_MS=3*60*60*1000;
function shouldRemindFinish(){
  if(!S.match||!S.registration)return false;
  if(S.registration.status!=='matched')return false;
  if(S.match.status!=='confirmed')return false;
  if(!S.match.created_at)return false;
  return (Date.now()-new Date(S.match.created_at).getTime())>=REMIND_AFTER_MS;
}
function finishReminderBanner(){
  if(!shouldRemindFinish())return '';
  return '<div style="margin:0 20px 12px;padding:14px 16px;background:var(--gold-bg);border:1.5px solid rgba(201,160,99,.5);border-radius:12px">'
    +'<div style="font-size:13px;font-weight:800;color:var(--gold-bright);margin-bottom:6px">飲み会は終わりましたか？</div>'
    +'<div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:10px">「飲み終わった」を押して評価すると、次の募集ができるようになります。</div>'
    +'<button class="btn btn-wine" style="padding:11px;font-size:13px" onclick="go(\'review\')">飲み終わった →</button></div>';
}
// LINE通知は1マッチにつき1回だけ。reminder_sent を排他更新して二重送信を防ぐ
async function sendFinishReminderOnce(){
  if(!shouldRemindFinish())return;
  var lock=await DB.from('matches').update({reminder_sent:true}).eq('id',S.match.id).eq('reminder_sent',false).select('id,reminder_sent').single();
  if(lock.error||!lock.data)return;
  S.match.reminder_sent=true;
  await pushLineNotify(S.match.id,'finish_reminder');
}
function startFinishReminderTimer(){
  if(S._remindTimer)clearInterval(S._remindTimer);
  S._remindTimer=setInterval(function(){
    if(!S.match||!S.registration||S.registration.status!=='matched'){
      clearInterval(S._remindTimer);S._remindTimer=null;return;
    }
    if(shouldRemindFinish()){
      sendFinishReminderOnce();
      if(S.screen==='matched'||S.screen==='chat'||S.screen==='splash')render();
    }
  },60*1000);
}

async function loadMatchMembers(){
  if(!S.match)return;
  var r=await DB.from('registrations').select(REG_COLS).eq('match_id',S.match.id);
  if(!r.data)return;
  // マッチ相手のプロフィールは profiles を直接読まず、サーバー側の関数から取得する。
  // 直接読むと、DB側の許可の都合で本名・生年月日・身分証の保存先・カード顧客番号まで
  // 端末に降りてしまうため。関数は安全な列だけを返し、そのマッチの参加者にしか応答しない。
  var partners=await DB.rpc('get_match_partners',{p_match_id:S.match.id});
  var byUser={};
  if(partners.data){
    partners.data.forEach(function(p){byUser[p.user_id]=p;});
  }
  for(var i=0;i<r.data.length;i++){
    r.data[i].profiles=byUser[r.data[i].user_id]||{};
  }
  S.matchMembers=r.data;
  await syncReportStatus();
  startFinishReminderTimer();
}

function applyMessages(data){
  var sys=[{type:'system',id:'sys-0',content:'マッチング成立！チャットが作成されました'}];
  if(S.match.ticket_consumed&&S.profile&&S.profile.gender==='male'){
    sys.push({type:'system',id:'sys-1',content:'🎫 チケットを1枚使用しました'});
  }
  var msgs=data.map(function(m){
    var nick='?';
    if(m.user_id===S.user.id&&S.profile){nick=S.profile.nickname;}
    else{var mm=S.matchMembers.find(function(x){return x.user_id===m.user_id;});if(mm&&mm.profiles)nick=mm.profiles.nickname||'?';}
    return {id:m.id,user_id:m.user_id,content:m.content,mine:m.user_id===S.user.id,nickname:nick};
  });
  var newMsgs=sys.concat(msgs);
  var currentIds=S.chatMsgs.map(function(m){return m.id;}).join(',');
  var newIds=newMsgs.map(function(m){return m.id;}).join(',');
  if(currentIds!==newIds){
    S.chatMsgs=newMsgs;
    if(S.screen==='chat'){
      render();
      setTimeout(function(){var el=document.querySelector('.chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
    }
  }
}

var _reviewSubmitting=false;

function setReviewStars(n){
  var wasLow=S.reviewStars>0&&S.reviewStars<=2;
  var isLow=n<=2;
  if(wasLow!==isLow){
    S.reviewChecks=REVIEW_TAGS.map(function(){return false;});
    S.reviewOtherText='';
  }
  S.reviewStars=n;
  re('review');
}

function confirmSubmitReview(){
  if(_reviewSubmitting)return;
  if(!S.match||S.reviewStars===0)return;
  var anyTagSelected=S.reviewChecks.some(function(c){return c;});
  if(!anyTagSelected){alert('評価タグを1つ以上選んでください');return;}
  var isLowNow=S.reviewStars>0&&S.reviewStars<=2;
  var checksNow=isLowNow?REVIEW_TAGS_LOW:REVIEW_TAGS;
  var otherIdxNow=checksNow.length-1;
  if(S.reviewChecks[otherIdxNow]&&(!S.reviewOtherText||!S.reviewOtherText.trim())){
    alert('「その他」を選んだ場合は内容を入力してください');
    return;
  }
  if(!confirm('評価を送信しますか？\nこの操作は送信後に変更できません。'))return;
  _reviewSubmitting=true;
  re('review');
  submitReview().catch(function(){}).finally(function(){_reviewSubmitting=false;});
}

async function submitReview(){
  if(!S.match||S.reviewStars===0)return;
  var matchId=S.match.id;
  var targets=S.matchMembers.filter(function(m){return m.user_id!==S.user.id;});
  for(var i=0;i<targets.length;i++){
    var tagSource=(S.reviewStars>0&&S.reviewStars<=2)?REVIEW_TAGS_LOW:REVIEW_TAGS;
    var otherIdxSubmit=tagSource.length-1;
    var selectedTags=S.reviewChecks.map(function(checked,idx){
      if(!checked)return null;
      if(idx===otherIdxSubmit&&S.reviewOtherText&&S.reviewOtherText.trim()){
        return S.reviewOtherText.trim();
      }
      return tagSource[idx];
    }).filter(function(t){return t!==null;});
    var isLowNow2=S.reviewStars>0&&S.reviewStars<=2;
    var legacyPunctual=isLowNow2?false:S.reviewChecks[0];
    var legacyFriendly=isLowNow2?false:S.reviewChecks[1];
    var legacyAgain=isLowNow2?false:S.reviewChecks[2];
    await DB.from('reviews').insert({match_id:matchId,reviewer_id:S.user.id,reviewee_id:targets[i].user_id,stars:S.reviewStars,tag_punctual:legacyPunctual,tag_friendly:legacyFriendly,tag_again:legacyAgain,review_tags:selectedTags});
  }
  await setMatchResultOnce(matchId,'completed',{completed_at:new Date().toISOString()});
  await saveUserResult(matchId,'completed');
  if(S.registration)await DB.from('registrations').update({status:'completed'}).eq('id',S.registration.id);
  S.registration=null;S.match=null;S.matchMembers=[];S.form={area:null,slot:null,drink_style:null,purpose:null,ok_nodrink:false,timing:null,age_min:null,age_max:null,age_any:false};_isSubmitting=false;
  S.reviewStars=0;S.reviewChecks=[false,false,false];S.reviewOtherText='';S.chatMsgs=[];S.chargeId=null;go('splash');
}

function goReport(){
  var opponent=S.matchMembers.find(function(m){return m.user_id!==S.user.id;});
  S._reportTargetUserId=opponent?opponent.user_id:null;
  go('report');
}

async function syncReportStatus(){
  S._hasReported=false;
  if(!S.user||!S.match||!S.match.id)return;
  try{
    var rep=await DB.from('reports').select('id').filter('reporter_id','eq',S.user.id).filter('match_id','eq',S.match.id);
    S._hasReported=!!(rep.data&&rep.data.length>0);
  }catch(e){S._hasReported=false;}
}

async function submitReport(){
  var reason=document.getElementById('report-reason');
  var desc=document.getElementById('report-desc');
  var btn=document.getElementById('report-btn');
  var errEl=document.getElementById('report-err');
  if(!reason||!reason.value){if(errEl)errEl.textContent='通報理由を選択してください';return;}
  if(btn){btn.disabled=true;btn.textContent='送信中...';}
  var res=await DB.from('reports').insert({
    reporter_id:S.user.id,
    reported_id:S._reportTargetUserId||null,
    match_id:S.match?S.match.id:null,
    category:reason.value,
    description:desc?desc.value:''
  });
  if(res.error){if(errEl)errEl.textContent=friendlyError(res.error,'エラーが発生しました。もう一度お試しください。');if(btn){btn.disabled=false;btn.textContent='通報する';}return;}
  S._reportDone=true;S._hasReported=true;re('report');
}

async function submitInquiry(){
  var nameEl=document.getElementById('inquiry-name');
  var emailEl=document.getElementById('inquiry-email');
  var content=document.getElementById('inquiry-content');
  var btn=document.getElementById('inquiry-btn');

}

//  進み具合が見えるバーが欲しい」との指摘を受けて作り替えた。
//
//  【なぜ進み具合を見せるのか】
//   ぐるぐるは回り続けるだけで、進んでいるのか止まっているのかが分からない。
//   人は「終わりが見えない待ち」を実際より長く感じる。
//   バーが右へ進んでいれば、同じ待ち時間でも「動いている」と受け取れる。
//
//  【このバーは実際の進捗ではない】
//   ブラウザの読み込み状況を正確に取る手段がないため、
//   時間の経過に応じて進む見せかけのバーである。
//   ただし嘘にならないよう、90%で止めて完了までは到達させない。
//   実際に準備が終わった時点で画面が切り替わる。
//   もし処理が長引いても、バーだけが先に100%になって
//   「終わったはずなのに進まない」という状態にはならない。
function loadingH(){
  // 描き直されるたびに最初から進み直さないよう、開始時刻は一度だけ記録する
  if(!S._loadStartedAt)S._loadStartedAt=Date.now();
  // 起動画面はサービスの第一印象になるため、汎用的な回転する輪ではなく
  // 「グラスが満ちていく」演出にしている。飲み会を待つ時間そのものを表す。

  return '<div class="loading">'
    +'<div class="nl-glow"></div>'
    +'<div class="nl-cup">'

}

// バーを少しずつ右へ進める。
// 最初は速く、あとになるほど遅くする（残りが少ないほど慎重に見える）。
// 90%で止め、実際に読み込みが終わった時点で画面が切り替わる。
var _loadBarTimer=null;
function startLoadBar(){
  if(_loadBarTimer)return;
  var pct=8;
  _loadBarTimer=setInterval(function(){
    var el=document.getElementById('load-bar');
    if(!el){
      // 読み込み画面から離れたら止める
      clearInterval(_loadBarTimer);_loadBarTimer=null;return;
    }
    if(pct<90){
      // 進むほど1回あたりの increment を小さくする
      pct+=Math.max(1,(90-pct)*0.18);
      if(pct>90)pct=90;
      el.style.width=pct.toFixed(1)+'%';
    }
  },400);
}

function stopLoadBar(){
  if(_loadBarTimer){clearInterval(_loadBarTimer);_loadBarTimer=null;}
  S._loadStartedAt=null;
}
