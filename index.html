// 開始まで30分を切っている時間枠は選べない（開始後のマッチを防ぐため）
function slotSelectable(t){
  if(t==='今すぐ')return true;
  var h=parseInt(String(t).replace(/[^0-9].*$/,''),10);
  if(isNaN(h))return true;
  var now=new Date();
  var jst=new Date(now.getTime()+(now.getTimezoneOffset()+540)*60000);
  var slot=new Date(jst.getFullYear(),jst.getMonth(),jst.getDate(),h,0,0,0);
  return (slot.getTime()-jst.getTime())>30*60*1000;
}

async function goSplashFromMatched(){
  if(S.match&&S.matchMembers.length===0){
    await loadMatchMembers();
  }
  await syncReportStatus();
  var savedMatch=S.match;
  var savedReg=S.registration;
  var savedMembers=S.matchMembers.slice();
  go('splash');
  if(savedMatch&&savedReg&&savedReg.status==='matched'){
    S.match=savedMatch;
    S.registration=savedReg;
    S.matchMembers=savedMembers;
    render();
  }
}

function goNoShowReport(){
  if(!confirm('相手が待ち合わせ場所に来なかったことを運営へ報告しますか？')){return;}
  var opponent=S.matchMembers.find(function(m){return m.user_id!==S.user.id;});
  S._reportTargetUserId=opponent?opponent.user_id:null;
  S._reportPresetReason='無断キャンセル';
  go('report');
}

function formatMeetingTime(value){
  if(!value)return '確認中';
  try{return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value));}
  catch(e){return String(value);}
}

function meetingInputValue(value){
  if(!value)return '';
  return new Date(new Date(value).getTime()+9*60*60*1000).toISOString().slice(0,16);
}

function jstInputToIso(value){
  if(!value)return null;
  var d=new Date(value+':00+09:00');
  return isNaN(d.getTime())?null:d.toISOString();
}

async function loadMeetingPlan(shouldRender){
  if(!S.match||!S.match.id)return;
  var res=await DB.from('match_meeting_plans').select('*').eq('match_id',S.match.id).single();
  if(res.error||!res.data)return;
  var before=S.meetingPlan?JSON.stringify(S.meetingPlan):'';
  S.meetingPlan=res.data;
  if(shouldRender&&before!==JSON.stringify(res.data)&&(S.screen==='matched'||S.screen==='chat'))render();
}

async function loadMeetingChangeHistory(shouldRender){
  if(!S.match||!S.match.id)return;
  var res=await DB.from('match_meeting_change_history')
    .select('proposal_id,match_id,proposed_by,status,proposed_at,responded_at')
    .eq('match_id',S.match.id)
    .order('proposed_at',{ascending:false})
    .limit(1)
    .maybeSingle();
  if(res.error)return;
  var before=S.meetingChangeHistory?JSON.stringify(S.meetingChangeHistory):'';
  S.meetingChangeHistory=res.data||null;
  if(shouldRender&&before!==JSON.stringify(S.meetingChangeHistory)&&(S.screen==='matched'||S.screen==='chat'))render();
}

  if(S._meetingPlanTimer)clearInterval(S._meetingPlanTimer);
  S._meetingPlanTimer=setInterval(function(){
    if((S.screen!=='matched'&&S.screen!=='chat')||!S.match||!S.registration||S.registration.status!=='matched'){

var _meetingPlanSubmitting=false;
async function submitMeetingChange(){
  if(_meetingPlanSubmitting||!S.match)return;
  var timeEl=document.getElementById('meeting-time-input');
  var placeEl=document.getElementById('meeting-place-input');
  var iso=jstInputToIso(timeEl&&timeEl.value);
  var place=placeEl?placeEl.value.trim():'';
  if(!iso){alert('待ち合わせ時間を選んでください。');return;}
  if(!place){alert('待ち合わせ場所を入力してください。');return;}
  if(!confirm('この時間・場所への変更をお相手に相談しますか？'))return;
  _meetingPlanSubmitting=true;
  var res=await DB.rpc('propose_match_meeting_change',{p_match_id:S.match.id,p_meeting_time:iso,p_meeting_place:place});
  _meetingPlanSubmitting=false;
  if(res.error){alert('変更相談を送れませんでした。もう一度お試しください。');return;}
  S._meetingEditOpen=false;
  await Promise.all([loadMeetingPlan(false),loadMeetingChangeHistory(false)]);
  render();
}

async function respondMeetingChange(accept){
  if(_meetingPlanSubmitting||!S.match)return;
  if(!confirm(accept?'この変更を承認しますか？':'元の時間・場所のままにしますか？'))return;
  _meetingPlanSubmitting=true;
  var res=await DB.rpc('respond_match_meeting_change',{p_match_id:S.match.id,p_accept:!!accept});
  _meetingPlanSubmitting=false;
  if(res.error){alert('回答を保存できませんでした。もう一度お試しください。');return;}
  await Promise.all([loadMeetingPlan(false),loadMeetingChangeHistory(false)]);
  render();
}

  var isPair=f.mode==='2v2';

  var allOk=f.area&&f.slot&&f.drink_style&&f.purpose&&(!isPair||!!(S._pair&&S._pair.status==='accepted'&&S._pair.partnerVerified));
  btn.disabled=!(allOk&&!_isSubmitting);
}

function updateReviewSubmitBtn(){
  var btn=document.getElementById('review-submit-btn');
  if(!btn)return;
  var isLow=S.reviewStars>0&&S.reviewStars<=2;
  var checks=isLow?REVIEW_TAGS_LOW:REVIEW_TAGS;
  var otherIdx=checks.length-1;
  var anyTagSelected=S.reviewChecks.some(function(c){return c;});
  var otherOk=!S.reviewChecks[otherIdx]||(S.reviewOtherText&&S.reviewOtherText.trim().length>0);
  var canSubmit=S.reviewStars>0&&anyTagSelected&&otherOk&&!_reviewSubmitting;
  btn.disabled=!canSubmit;
}

せん。\n4. チケットの有効期限は、購入日から180日です。有効期限を過ぎた未使用のチケットは失効し、返金されません。\n5. チケットを現金に換えること、他のユーザーに譲渡または貸与することはできません。\n\n第9条（返金）\n1. ユーザーのご都合による返金は行いません。\n2. 本サービスのシステム不具合により、購入したチケットが正常に利用できなかった場合、運営者は内容を確認のうえ、チケットの再付与または返金を行います。\n3. 運営者が本サービスを終了する場合、終了時点で有効期限内にある未使用のチケットについて、購入金額に相当する額を返金します。\n4. 運営者の責めに帰すべき事由により重複して決済が行われた場合、運営者は速やかに返金します。\n\n第9条の2（無断キャンセルおよび当日不参加）\n1. マッチが成立した後、連絡なく待ち合わせに現れなかった場合、または正当な理由なく直前に取りやめた場合を「無断キャンセル」といいます。\n2. 無断キャンセルをしたユーザーには、次の措置をとります。\n・男性ユーザー：マッチの成立時に消費したチケットは返還されません。\n・女性ユーザー：キャンセル料として3,980円（税込）をご負担いただきます。この金額は、無断キャンセルにより飲み会が実施されなかったことに伴い、運営者がお相手の男性ユーザーにチケット1枚（販売価格3,980円・税込）を再付与するために生じる費用に相当するものです。\n3. 無断キャンセルをされた側のユーザーには、次の対応を行います。\n・男性ユーザー：マッチの成立時に消費したチケット1枚を再付与します。\n・女性ユーザー：費用のご負担は生じません。\n4. 無断キャンセルが確認された場合、運営者は次の措置を段階的にとります。\n・1回目：警告を行い、キャンセル率に記録します。\n・2回目：1週間の利用停止\n・3回目以降：無期限の利用停止\n5. 無断キャンセルに当たるかどうかは、双方の申告、チャットの内容その他の事情をもとに運営者が判断します。相手方の申告のみをもって直ちに決定することはありません。\n6. 前項の判断に異議がある場合、通知を受けた日から7日以内に、本サービス内のお問い合わせ機能よりお申し出ください。運営者は内容を確認し、必要に応じて措置およびキャンセル料の請求を取り消します。\n\n第10条（評価・通報）\n1. ユーザーは、マッチの相手を評価し、また問題があった場合に通報することができます。\n2. 運営者は、通報の内容を確認し、必要に応じて、警告、機能の制限、アカウントの停止、登録の抹消を行うことがあります。\n3. 通報の内容、判断の理由および結果について、運営者は開示の義務を負いません。\n\n第11条（利用停止・登録抹消）\n1. 運営者は、ユーザーが本規約に違反した場合、または違反のおそれがあると判断した場合、事前の通知なく、機能の制限、アカウントの停止、登録の抹消を行うことができます。\n2. 前項の措置により未使用のチケットが失効した場合であっても、運営者は返金の義務を負いません。ただし、違反の事実が認められなかったときは、この限りではありません。\n\n第12条（退会）\n1. ユーザーは、本サービス内のお問い合わせ機能その他運営者の定める方法により、いつでも退会できます。\n2. 退会した場合、未使用のチケットは失効し、返金されません。\n3. 退会後の個人情報の取扱いは、プライバシーポリシーに従います。不正利用の防止のために必要な情報は、プライバシーポリシーに定める期間、保管されます。\n\n第13条（免責）\n1. 運営者は、本サービスについて、特定の目的への適合性、正確性、有用性および継続性を保証しません。\n2. 運営者は、ユーザー間で生じたトラブル、および本サービスの利用によりユーザーに生じた損害について、運営者の故意または重大な過失による場合を除き、責任を負いません。\n3. 本サービスは、ユーザーの婚姻の有無を利用の条件としていません。ユーザーの婚姻の状況に起因して、ユーザー間または当該ユーザーの配偶者その他の第三者との間に生じた紛争および損害について、運営者は、運営者に過失がある場合を除き、賠償その他の責任を負いません。\n4. 第2項により運営者が責任を負う場合であっても、賠償する額は、損害が発生した時点からさかのぼって12か月間に当該ユーザーが運営者に支払った金額を上限とし、通常生じうる直接かつ現実の損害に限るものとします。\n5. 消費者契約法その他の強行法規により第2項から前項までの全部または一部が適用されない場合、当該部分については、運営者は法令の定めに従って責任を負います。\n\n第14条（サービスの変更・中断・終了）\n1. 運営者は、本サービスの内容を変更することがあります。ユーザーに重大な影響を与える変更を行う場合は、原則として実施の30日前までに本サービス内で告知します。\n2. システムの保守、障害、天災その他やむを得ない事由により、事前の告知なく本サービスを一時的に中断することがあります。\n3. 運営者は、本サービスを終了することがあります。この場合、原則として終了の30日前までに告知し、第9条第3項に従い未使用チケットを返金します。\n\n第15条（知的財産権および投稿物）\n1. 本サービスに関する知的財産権は、運営者または正当な権利者に帰属します。\n2. ユーザーが登録・投稿した写真、文章その他の情報についての権利は、ユーザーに帰属します。ただし運営者は、本サービスの提供、不正利用の防止および紛争への対応のために必要な範囲で、これらを保存・確認・利用することができます。\n\n第16条（個人情報の取扱い）\n個人情報の取扱いは、別途定めるプライバシーポリシーに従います。\n\n第17条（通知・連絡）\n1. 運営者からユーザーへの連絡は、本サービス内の表示、登録されたメールアドレスへの送信、またはLINEを連携している場合はLINEのメッセージにより行います。\n2. ユーザーから運営者へのお問い合わせは、本サービス内のお問い合わせ機能により受け付けます。受付時間は11:00から23:00までとし、いただいた順に回答します。受付時間外のお問い合わせは、翌日以降の回答となります。内容の確認を要する場合、回答までに日数をいただくことがあります。\n\n第18条（本規約の変更）\n1. 運営者は、民法第548条の4の定めに従い、本規約を変更することがあります。\n2. 変更を行う場合、運営者は、変更後の内容および効力発生時期を、効力発生時期の7日前までに本サービス内で告知します。ユーザーに不利益となる重要な変更を行う場合は、30日前までに告知します。\n3. 告知の後、ユーザーが本サービスの利用を継続した場合、変更に同意したものとみなします。\n\n第19条（分離可能性）\n本規約のいずれかの条項が無効または執行不能と判断された場合であっても、その他の条項は引き続き効力を有します。\n\n第20条（準拠法および管轄）\n1. 本規約は日本法に準拠します。\n2. 本サービスに関して運営者とユーザーとの間に紛争が生じた場合、運営者の所在地を管轄する地方裁判所を第一審の合意管轄裁判所とします。ただし、消費者契約に関する法令により、ユーザーの住所地を管轄する裁判所に訴えを提起することを妨げるものではありません。\n\n制定日：2026年7月31日\n改定日：2026年9月10日'

function goFaqBot(){
  S.faqMsgs=[{type:'bot',content:'こんにちは！よくある質問にお答えします。気になることを聞いてみてください。'}];
  go('faqbot');
}

function findFaqAnswer(text){
  for(var i=0;i<FAQ_QA.length;i++){
    var kws=FAQ_QA[i].keywords;
    for(var j=0;j<kws.length;j++){
      if(text.indexOf(kws[j])!==-1)return FAQ_QA[i].answer;
    }
  }
  return null;
}

function sendFaqMsg(){
  var inp=document.getElementById('faq-input');
  var txt=inp?inp.value.trim():'';
  if(!txt)return;
  inp.value='';
  S.faqMsgs.push({type:'user',content:txt});
  var answer=findFaqAnswer(txt);
  if(answer){
    S.faqMsgs.push({type:'bot',content:answer});
  }else{
    S.faqMsgs.push({type:'bot',content:'申し訳ありません、うまくお答えできませんでした。',showInquiryBtn:true});
    DB.from('faq_misses').insert({user_id:S.user?S.user.id:null,question:txt}).then(function(){}).catch(function(){});
  }
  re('faqbot');
  setTimeout(function(){var el=document.querySelector('.chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

function tapFaqQuestion(label,answer){
  S.faqMsgs.push({type:'user',content:label});
  S.faqMsgs.push({type:'bot',content:answer});
  re('faqbot');
  setTimeout(function(){var el=document.querySelector('.chat-msgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

// 【2026/9/8 追加】FAQのクイックボタン用。答えの本文の書き出しで FAQ_QA を探す。
//   番号（配列の何番目か）で指定していたため、項目を挿入したときにボタンと答えが
//   ズレる事故が起きた。書き出しで引けば、項目を足しても順番が変わっても崩れない。
//   見つからない場合は空文字を返す（ボタンは表示されるが答えが出ない状態になるので、
//   FAQ_QA の本文を書き換えたときは、ここの文言も合わせて直すこと）。
function faqAnsBy(head){
  for(var i=0;i<FAQ_QA.length;i++){
    if(FAQ_QA[i].answer&&FAQ_QA[i].answer.indexOf(head)===0)return FAQ_QA[i].answer;
  }
  return '';
}

    return '<div class="screen"><div class="hdr"><button class="hdr-back" onclick="S._inquiryDone=false;go(\'splash\')">← 戻る</button><div class="hdr-info"><div class="hdr-title">お問い合わせ</div></div></div><div class="body" style="padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><div style="font-size:40px">✅</div><div style="font-size:16px;font-weight:800;color:var(--cream)">送信が完了しました。</div><div style="font-size:13px;color:var(--muted);line-height:1.7">お問い合わせありがとうございます。<br>内容を確認のうえ、対応いたします。</div></div><div class="ftr"><button class="btn btn-wine" onclick="S._inquiryDone=false;go(\'splash\')">トップに戻る</button></div></div>';
  }
  return '<div class="screen"><div class="hdr"><button class="hdr-back" onclick="go(\'splash\')">← 戻る</button><div class="hdr-info"><div class="hdr-step">お問い合わせ</div><div class="hdr-title">運営へ連絡する</div></div></div><div class="body" style="padding:24px;display:flex;flex-direction:column;gap:14px"><div class="sec-label" style="padding:0 0 8px">お名前（任意）</div><input id="inquiry-name" class="inp" type="text" placeholder="例：山田太郎"><div class="sec-label" style="padding:0 0 8px">メールアドレス（必須）</div><input id="inquiry-email" class="inp" type="email" placeholder="例：sample@mail.com"><div class="sec-label" style="padding:0 0 8px">お問い合わせ内容</div><textarea id="inquiry-content" class="inp" style="height:160px;resize:none" placeholder="ご質問・ご要望・お困りのことをご記入ください"></textarea><div id="inquiry-err" class="err-msg"></div></div><div class="ftr"><button class="btn btn-wine" id="inquiry-btn" onclick="submitInquiry()">送信する</button></div></div>';
}

document.addEventListener('visibilitychange',function(){
  if(document.hidden){sessionStorage.setItem('ngo_last_active',String(Date.now()));}
  else{resumeLineLinkCheck();}
});
window.addEventListener('pagehide',function(){
  sessionStorage.setItem('ngo_last_active',String(Date.now()));
});
// iPhoneではLINEアプリからSafariへ戻っても visibilitychange/pageshow が
// 発火しない場合があるため、フォーカス復帰時にも連携完了を確認する。
window.addEventListener('focus',function(){
  resumeLineLinkCheck();
});

// ===== 背景に上品な泡を漂わせる（LPと同じ演出） =====
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var layer=document.createElement('div');
  layer.id='ngo-fx';
  document.body.appendChild(layer);
  for(var i=0;i<7;i++){
    var b=document.createElement('div');
    b.className='ngo-bubble';
    var size=4+Math.random()*9;
    b.style.width=size+'px';b.style.height=size+'px';
    b.style.left=(5+Math.random()*90)+'%';
    b.style.animationDuration=(10+Math.random()*10)+'s';
    b.style.animationDelay=(Math.random()*10)+'s';
    layer.appendChild(b);
  }
})();

// ===== マッチ成立の瞬間に乾杯エフェクトを一度だけ出す =====
var _lastScreenForFx='';
var _origRender=render;
render=function(){
  _origRender();
  if(S.screen==='matched'&&_lastScreenForFx!=='matched'&&_lastScreenForFx!=='chat'&&_lastScreenForFx!=='review'&&_lastScreenForFx!=='report'){
    showCheersFx();
  }
  _lastScreenForFx=S.screen;
};
function showCheersFx(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var wrap=document.createElement('div');
  wrap.className='cheers-burst';
  var html='<div class="glass">\ud83e\udd42</div>';
  for(var i=0;i<10;i++){
    var ang=(Math.PI*2/10)*i;
    var dist=70+Math.random()*60;
    html+='<div class="spark" style="--dx:'+Math.round(Math.cos(ang)*dist)+'px;--dy:'+Math.round(Math.sin(ang)*dist)+'px"></div>';
  }
  wrap.innerHTML=html;
  document.body.appendChild(wrap);
  setTimeout(function(){if(wrap.parentNode)wrap.parentNode.removeChild(wrap);},1500);
}

init();
S._statsTimer=setInterval(function(){
  if(S.screen==='splash'&&!document.hidden)loadStats();
},30000);

// インストール可能なWebアプリとして認識させるための登録。
// sw.js は通信を横取り・キャッシュしないので、常に最新の本番画面を表示する。
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}

</script>
</body>
