<!-- 【起動を速くするための書き方 2026/8/18】
     以前はここで普通に読み込んでいたため、日本語フォント3書体（計11の太さ）の
     ダウンロードが終わるまで画面が一切表示されず、
     iPhoneのホーム画面から開くと6秒ほど何も出ない状態だった。

     media="print" を付けると、ブラウザは「印刷用だから今すぐは要らない」と判断し、
     画面の表示を止めずに裏側で読み込む。読み終わった時点で onload により
     media を all に戻し、フォントを適用する。
     これにより見た目は最終的に同じまま、表示までの待ち時間だけがなくなる。

     フォントの種類・太さは一切減らしていない。見た目は変わらない。
     ただし読み込みが終わるまでの一瞬だけ、端末の標準フォントで表示される。 -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet"></noscript>

<!-- 【Supabaseの部品：defer を付けてはいけない 2026/8/18】
     ページの一番下にある init() が supabase を直接使っており、
     defer を付けるとこの読み込みが後回しになって init() が先に走り、
     supabase が未定義のままアプリが起動しなくなる。
     ここは従来どおり同期的に読み込むこと。
     （将来 init() の呼び出しを DOMContentLoaded まで遅らせる形に直せば、
       defer を付けて更に速くできる余地がある） -->
<!-- 主要4画像はHTML内に埋め込み、単体のindex.htmlだけで表示できるようにする。 -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 【PAY.JP の読み込みを削除 2026/8/18】
     決済はCREDIXへ移行しており、PAY.JPは使っていない。
     2026/8/15にカード登録画面への導線もすべて撤去済み（No.56）。
     読み込むだけ起動が遅くなるため削除した。 -->
<style>
/* ===== デザイントークン（LPと統一） ===== */
:root{
  --ink:#12090B;--night:#1B0B0E;--hero:#351018;--bg:#160A0D;--surface:#211014;--card:#281216;
  --border:rgba(205,167,101,.34);--border2:rgba(245,236,223,.10);
  --wine:#6B1D29;--wine-bg:rgba(107,29,41,.22);--wine-true:#48131B;
  --cream:#F5ECDF;--muted:#BDAEA3;--lgray:#907E74;
  --gold:#CDA765;--gold-bright:#F0D8A7;--gold-bg:rgba(205,167,101,.14);
  --green:#7BC98F;--red:#FF8A6C;--red-bg:rgba(255,138,108,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
  /* 【日本語の折り返し 8/15】
     既定のままだと、日本語は文字の途中どこでも改行されるため、
     「使いま／す。」のように単語が割れて読みにくくなっていた。
     line-break:strict で句読点や小書き文字が行頭に来ないようにし、
     text-wrap:pretty で行末に1文字だけ残るような折り返しを減らす。
     どちらも対応していないブラウザでは無視されるだけで、害はない。 */
  line-break:strict;text-wrap:pretty;overflow-wrap:normal}
#app{min-height:100%;max-width:430px;margin:0 auto;background:transparent;display:flex;flex-direction:column;position:relative;z-index:1}
#ngo-fx{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;pointer-events:none;z-index:0;overflow:hidden}
#ngo-fx::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 320px 240px at 12% 4%,rgba(201,160,99,.10),transparent 60%),
  radial-gradient(ellipse 380px 300px at 90% 20%,rgba(107,26,36,.45),transparent 60%),
  radial-gradient(ellipse 300px 260px at 50% 100%,rgba(201,160,99,.06),transparent 60%);}
.ngo-bubble{position:absolute;bottom:-24px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 35% 30%,rgba(243,217,164,.35),rgba(243,217,164,.04));animation:bubbleRise linear infinite}
@keyframes bubbleRise{0%{transform:translateY(0);opacity:0}10%{opacity:.6}90%{opacity:.3}100%{transform:translateY(-105vh) translateX(24px);opacity:0}}
.screen,.match-wrap,.loading{position:relative;z-index:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* 無料チケットのお祝い（全画面） 2026/8/22 */
@keyframes ngoGiftIn{from{opacity:0}to{opacity:1}}
@keyframes ngoGiftPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.88);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes shine{0%{left:-80%}45%{left:130%}100%{left:130%}}
@keyframes glowSoft{0%,100%{box-shadow:0 8px 30px rgba(201,160,99,.22)}50%{box-shadow:0 10px 42px rgba(201,160,99,.4)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s !important;transition-duration:.01s !important}}
.verify-waiting{position:relative;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.verify-waiting-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:verifyPulse 2.6s ease-out infinite}
.verify-waiting-ring2{animation-delay:1.3s}
@keyframes verifyPulse{0%{transform:scale(.55);opacity:.7}70%{opacity:0}100%{transform:scale(1);opacity:0}}
.verify-waiting-core{width:56px;height:56px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;animation:breathe 2.6s ease-in-out infinite}
.verify-dots span{opacity:0;animation:verifyDot 1.4s infinite}
.verify-dots span:nth-child(1){animation-delay:0s}
.verify-dots span:nth-child(2){animation-delay:.2s}
.verify-dots span:nth-child(3){animation-delay:.4s}
@keyframes verifyDot{0%,80%,100%{opacity:0}40%{opacity:1}}
.screen{flex:1;display:flex;flex-direction:column}
/* 画面遷移のときだけ演出する。選択のたびに再生すると重く感じるため */
.anim-in{animation:fadeUp .32s cubic-bezier(.2,.8,.2,1) both}
.hdr{padding:16px 20px;border-bottom:1px solid var(--border2);flex-shrink:0;background:#241016;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.hdr-back{background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted);padding:4px 0;font-weight:600;flex-shrink:0;transition:color .2s}

.hdr-info{flex:1}

.hdr-title{font-size:20px;font-weight:800;letter-spacing:.01em;font-family:'Shippori Mincho',serif}
.body{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
/* 下タブバー（2026/8/26追加）
   トップ画面が縦に短くて寂しいという指摘を受け、他のアプリと同じように
   常時見える下部メニューを置いた。項目は実際に存在する画面のみで、
   ダミーのボタンは置かない。ログイン中だけ表示する。 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;
  background:rgba(36,16,22,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--border2);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-i{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
  padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);transition:color .2s}
.tabbar-i .ic{width:21px;height:21px;display:block}
.tabbar-i .lb{font-size:10px;font-weight:700;letter-spacing:.02em}
.tabbar-i.on{color:var(--gold-bright)}
.tabbar-i:active{color:var(--gold)}
/* タブバーの高さぶん、画面下に余白を作って内容が隠れないようにする */
/* 【2026/8/27修正】64px固定では足りず、画面下の利用規約などが
   タブバーに隠れていた。タブバー自体が safe-area-inset-bottom（iPhoneの
   ホームバー領域）ぶん高くなるのに、余白側がそれを足していなかったため。
   タブバーの実高（約56px）＋ホームバー領域＋余裕16pxで計算する。 */
/* 【2026/8/27修正・第2版】第1版で calc に直しても直らなかった。真の原因は
   トップ画面の div が style="padding:0" というHTML内の直接指定を持っており、
   CSSのクラス指定より直接指定が優先されるため、余白が常に0に上書きされていたこと。
   !important を付けて直接指定より強くする。 */
.has-tabbar{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px)) !important}
.ftr{padding:14px 20px 30px;flex-shrink:0;border-top:1px solid var(--border2);background:#241016}
.btn{display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;
  font-weight:900;border-radius:999px;transition:transform .18s,box-shadow .25s,opacity .2s;font-size:16px;padding:16px 20px;width:100%;letter-spacing:.04em}
/* 【動作の軽量化 8/15】
   以前はボタンの影を3.2秒周期で明滅させ（glowSoft）、光沢を3.4秒周期で
   横切らせていた（shine）。box-shadow と left のアニメーションは描画コストが高く、
   画面に何もしていない間もブラウザが計算し続けるため、
   画面切替の処理が後回しになり「押してから反応が遅い」原因になっていた。
   見た目の金色と影はそのまま残し、動き続ける部分だけを止めている。 */
.btn-wine{position:relative;overflow:hidden;color:var(--night);background:linear-gradient(135deg,var(--gold-bright),var(--gold));
  box-shadow:0 8px 30px rgba(201,160,99,.28)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;animation:none;box-shadow:none}
.btn:disabled::after{display:none}
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:rgba(244,233,220,.06);
  color:var(--cream);font-family:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
.inp::placeholder{color:rgba(196,178,161,.5)}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,160,99,.14);background:rgba(244,233,220,.09)}
.inp.filled{border-color:rgba(201,160,99,.6);background:rgba(201,160,99,.08)}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
  background-position:calc(100% - 18px) calc(50% + 2px),calc(100% - 13px) calc(50% + 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
select.inp option{color:#3A2020;background:#fff}
input[type=date].inp{color-scheme:dark}
.sel-btn{flex:1;padding:14px 8px;border-radius:14px;border:1.5px solid var(--border);background:rgba(244,233,220,.04);
  color:var(--muted);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .18s;font-size:13px;font-weight:700}
.sel-btn:active{transform:scale(.97)}
.sel-btn.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold-bright);box-shadow:0 0 16px rgba(201,160,99,.18)}
.choice-btn{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--border);background:rgba(244,233,220,.04);

.choice-btn:active{transform:scale(.98)}
.choice-btn.on{border-color:var(--gold);background:var(--gold-bg);color:var(--cream)}
.range-row{display:flex;gap:6px;padding:0 20px}
.range-btn{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);background:rgba(244,233,220,.04);
  color:var(--muted);font-family:inherit;cursor:pointer;font-size:11px;font-weight:700;text-align:center;transition:all .18s}
.range-btn.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold-bright)}
.check-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;width:100%;font-family:inherit;text-align:left}
.check-item.on{border-color:var(--gold);background:var(--gold-bg)}
.tag-chip{display:inline-flex;align-items:center;padding:9px 16px;border-radius:999px;background:rgba(244,233,220,.04);
  border:1.5px solid var(--border);cursor:pointer;transition:all .18s;font-family:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tag-chip:active{transform:scale(.95)}
.tag-chip.on{border-color:var(--gold);background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--night)}
.tab-btn{flex:1;padding:12px;border:none;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:all .2s;letter-spacing:.04em}
.sec-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.28em;padding:18px 20px 8px;font-family:'Zen Kaku Gothic New',sans-serif}
.err-msg{font-size:12px;color:var(--red);padding:4px 0;text-align:center}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
/* ===== 起動画面（グラスが満ちる演出） ===== */
/* 画像を使わずCSSのみで描く。起動を遅くしないための制約。 */
.nl-glow{position:absolute;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,160,99,.20) 0%,rgba(201,160,99,0) 68%);

.nl-cup{display:flex;flex-direction:column;align-items:center;gap:0}

.nl-liquid{position:absolute;left:0;right:0;bottom:0;height:12%;

  letter-spacing:.02em}
@keyframes nlFill{0%{height:12%}55%{height:76%}100%{height:12%}}
@keyframes nlWave{0%,100%{transform:translateX(-8%)}50%{transform:translateX(8%)}}
@keyframes nlGlow{0%,100%{opacity:.5}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .nl-liquid,.nl-wave,.nl-glow{animation:none}
  .nl-liquid{height:60%}
}
/* 待機画面のバー。
   起動画面のバーは読み込みの進み具合に応じてJavaScriptが幅を伸ばすが、
   待機画面はいつ終わるか分からないため、繰り返し流れる形にする。

  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
  animation:nlBusyBar 1.4s ease-in-out infinite}

  0%{transform:translateX(-110%)}

}
@media(prefers-reduced-motion:reduce){
  .nl-busy-bar{animation:none;width:100%;opacity:.5}
}
/* 起動時のバー。JavaScriptが動く前から進むよう、CSSだけで動かす。
   9割で止め、残りは実際に読み込みが完了した時点で画面が切り替わることで埋まる。 */
@keyframes bootbar{0%{width:8%}35%{width:55%}70%{width:78%}100%{width:90%}}

/* エリア選択を2列に並べる（2026/8/26）
   エリアが6つに増え縦一列だとスクロールが長すぎるため、2つずつ横に並べる。
   1枚あたりが小さくなるので、画像の高さとラベルの文字も少し詰める。 */
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area-grid .area-card img{height:120px}
.area-grid .area-card-title{font-size:14px}
.area-grid .area-live-badge,.area-grid .area-quiet-badge{font-size:10px;padding:4px 8px}
.area-grid .area-soon-ribbon{font-size:9px;letter-spacing:.06em}
.mode-card{position:relative;border-radius:20px;overflow:hidden;background:#2A1219;cursor:pointer;border:1.5px solid rgba(228,198,138,.2);transition:transform .3s,box-shadow .3s;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.mode-card:active{transform:scale(.98)}
.mode-card img{width:100%;height:180px;object-fit:cover;object-position:center;display:block;background:#2A1219}
.mode-card-square img{object-position:center 25%}
.mode-card-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(10,5,7,.9));padding:22px 16px 14px}
.mode-card-title{font-size:18px;font-weight:800;color:#fff;font-family:'Shippori Mincho',serif;letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.card-selected{border-color:var(--gold-bright) !important;box-shadow:0 0 0 3px rgba(243,217,164,.15),0 0 34px rgba(243,217,164,.45) !important;transition:box-shadow .15s,border-color .15s}
.area-card img{filter:saturate(.75) contrast(1.06) brightness(.85)}
.area-card-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,10,12,.2),rgba(21,10,12,.1) 40%,rgba(10,5,7,.75));pointer-events:none}
.area-card-label{position:absolute;bottom:0;left:0;right:0;padding:16px}
.area-card-title{font-size:22px;font-weight:800;color:var(--cream);letter-spacing:.05em;font-family:'Shippori Mincho',serif;text-shadow:0 2px 10px rgba(0,0,0,.7)}
/* 準備中エリア：LPと同じ斜めリボン */
.area-soon{opacity:.72;filter:grayscale(.3)}
.area-soon img{filter:saturate(.35) contrast(1) brightness(.5)}
.area-soon .area-card-title{font-size:17px;color:rgba(244,233,220,.55)}
.area-soon-ribbon-wrap{position:absolute;inset:0;overflow:hidden;border-radius:20px;pointer-events:none;z-index:3}
.area-soon-ribbon{position:absolute;top:16px;right:-42px;width:160px;transform:rotate(40deg);text-align:center;
  background:linear-gradient(135deg,rgba(228,198,138,.95),rgba(196,163,90,.95));color:var(--night);
  font-family:'Zen Kaku Gothic New',sans-serif;font-size:11px;font-weight:900;letter-spacing:.12em;padding:5px 0;
  box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(0,0,0,.15)}
.area-live-badge{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;z-index:3;
  background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:var(--night);font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:11px;font-weight:900;letter-spacing:.04em;padding:5px 11px;border-radius:999px;box-shadow:0 3px 10px rgba(201,160,99,.4)}
.area-live-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--night);animation:pulse 1.6s infinite}
.area-quiet-badge{position:absolute;top:12px;right:12px;z-index:3;background:rgba(10,5,7,.6);color:rgba(244,233,220,.7);
  font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid rgba(244,233,220,.15)}
/* カード登録：主役1枚＋同一書式の補足 */
.cardreg-hero{border-radius:18px;padding:22px 18px;text-align:center;background:linear-gradient(160deg,rgba(201,160,99,.20),rgba(201,160,99,.06));
  border:1.5px solid rgba(201,160,99,.45);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.cardreg-hero-icon{font-size:30px;margin-bottom:8px;line-height:1}
.cardreg-hero-title{font-family:'Shippori Mincho',serif;font-size:21px;font-weight:800;color:var(--gold-bright);letter-spacing:.02em;margin-bottom:6px}
.cardreg-hero-sub{font-size:13px;color:var(--muted);line-height:1.7}
.cardreg-field-label{font-family:'Zen Kaku Gothic New',sans-serif;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.24em;margin-bottom:8px}
.cardreg-input{background:#FFFFFF;border:1.5px solid var(--border);border-radius:14px;padding:16px;transition:border-color .2s,box-shadow .2s}
.cardreg-input:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,160,99,.16)}
.cardreg-notes{list-style:none;display:flex;flex-direction:column;gap:11px;background:rgba(244,233,220,.035);border:1px solid var(--border2);border-radius:14px;padding:16px}
.cardreg-notes li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.7;color:var(--muted)}
.cardreg-notes-mark{color:var(--gold);flex:none;font-size:12px;line-height:1.7;font-weight:900}
.cardreg-secure{font-size:11px;color:var(--lgray);line-height:1.7;text-align:center;padding:0 8px}
/* 乾杯演出 */
.cheers-burst{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;pointer-events:none;z-index:60;display:flex;align-items:center;justify-content:center}
.cheers-burst .glass{font-size:64px;animation:cheersPop 1.4s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 24px rgba(243,217,164,.7))}
@keyframes cheersPop{0%{transform:scale(.3) rotate(-12deg);opacity:0}30%{transform:scale(1.25) rotate(4deg);opacity:1}50%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}
.cheers-burst .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold-bright);animation:sparkFly 1.2s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.intro-anim{display:none}
/* マッチ後の流れ（①待ち合わせ →②評価）を段階として見せる */
/* 待機画面：条件は表ではなくタグで1行にまとめる */
.cond-wrap{margin:18px 20px 0;padding-top:16px;border-top:1px solid var(--border2)}
.cond-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.24em;margin-bottom:9px;font-family:'Zen Kaku Gothic New',sans-serif}
.cond-row{display:flex;flex-wrap:wrap;gap:7px}
.cond-chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(244,233,220,.05);
  border:1px solid var(--border2);font-size:12.5px;font-weight:700;color:var(--cream);white-space:nowrap}
/* 待機画面：情報を箱で積まず、1つのまとまりに行として並べる */
.wait-badges{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.wait-live{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;background:rgba(255,255,255,.1);font-size:12px;font-weight:700;color:rgba(237,229,224,.85)}
.wait-dot{width:7px;height:7px;border-radius:50%;background:#7BE090;display:inline-block;animation:pulse 1.5s infinite}
.wait-pill{display:inline-flex;align-items:center;padding:5px 14px;border-radius:20px;background:var(--gold-bg);border:1.5px solid rgba(201,160,99,.6);font-size:12.5px;font-weight:900;color:var(--gold-bright);letter-spacing:.02em}
.wait-info{margin:16px 20px 0;padding:2px 0}
.wait-row{display:flex;gap:11px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--border2)}
.wait-row:last-child{border-bottom:none}
.wait-ico{flex:none;font-size:16px;line-height:1.45}
.wait-t{font-size:14px;font-weight:800;color:var(--cream);letter-spacing:.01em;line-height:1.5}
.wait-s{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:3px}
.wait-num{color:var(--gold-bright);font-size:16px;font-weight:900;padding:0 1px}
/* 登録の進み具合 */
.stp-row{display:flex;align-items:center;gap:4px;margin-top:7px}
.stp{width:22px;height:3px;border-radius:2px;background:rgba(244,233,220,.16)}
.stp.done{background:var(--gold)}
.stp.cur{background:var(--gold-bright)}
.stp-rest{margin-left:7px;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.04em;font-family:'Zen Kaku Gothic New',sans-serif}
.flow-step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border2)}
.flow-step:last-child{border-bottom:none}
.flow-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-bg);border:1.5px solid rgba(201,160,99,.5);
  color:var(--gold-bright);font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.flow-body{flex:1;min-width:0}
.flow-title{font-size:15px;font-weight:800;color:var(--cream)}
.flow-note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:3px}
@keyframes faceCountPulse{0%{transform:scale(1.4);opacity:0}50%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes faceRingPulse{0%,100%{box-shadow:0 0 0 2000px rgba(0,0,0,.45),0 0 0 0 rgba(123,224,144,.5)}50%{box-shadow:0 0 0 2000px rgba(0,0,0,.45),0 0 0 14px rgba(123,224,144,0)}}
.face-ring-counting{animation:faceRingPulse 0.8s ease-out infinite}
.face-wrap-counting::after{content:"";position:absolute;inset:0;pointer-events:none}
@keyframes welcomeSlideIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes welcomeBounce{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-3px) rotate(-6deg)}}

/* ===== LPの実写・ワイン・ゴールド表現に合わせた共通仕上げ ===== */
body{background:
  radial-gradient(circle at 15% 0%,rgba(201,160,99,.08),transparent 28rem),
  radial-gradient(circle at 100% 32%,rgba(107,26,36,.34),transparent 34rem),
  var(--night)}
#app{box-shadow:0 0 70px rgba(0,0,0,.32)}
.hdr{background:rgba(36,16,22,.94);border-bottom-color:rgba(201,160,99,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ftr{background:rgba(36,16,22,.96);border-top-color:rgba(201,160,99,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.home-visual{position:relative;width:calc(100% + 40px);height:218px;margin:-20px -20px 16px;overflow:hidden;border-bottom:1px solid rgba(201,160,99,.32);background:var(--night)}
.home-visual img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.04)}
.home-visual::after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,var(--hero));pointer-events:none}
.home-metric{flex:1;min-width:0;background:linear-gradient(150deg,rgba(244,233,220,.075),rgba(244,233,220,.025));border:1px solid rgba(201,160,99,.16);border-radius:14px;padding:12px 7px;text-align:center}
.mode-card{border-color:rgba(201,160,99,.34);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.mode-card img{height:196px;filter:saturate(.88) contrast(1.04)}
.mode-card-label{padding:50px 18px 16px;background:linear-gradient(transparent,rgba(10,5,7,.96))}
.mode-card-sub{display:block;margin-top:4px;color:rgba(244,233,220,.68);font-size:11px;font-weight:600;letter-spacing:.03em;font-family:'Noto Sans JP',sans-serif}
.match-hero{position:relative;border-bottom:1px solid rgba(201,160,99,.28);overflow:hidden}
.match-hero>img{width:100%;height:238px;object-fit:cover;object-position:center;display:block;filter:saturate(.9) contrast(1.05)}
.match-hero-copy{position:absolute;inset:auto 0 0;background:linear-gradient(transparent,rgba(10,5,7,.96));padding:62px 20px 18px;text-align:center}

/* ===== 2026/8/29 アプリ全画面ラグジュアリーUI ===== */
html,body{background:var(--ink);color-scheme:dark}
body{font-feature-settings:"palt" 1;letter-spacing:.012em}
#app{background:radial-gradient(ellipse 360px 260px at 100% 0%,rgba(107,29,41,.24),transparent 70%),linear-gradient(180deg,var(--night),var(--ink));border-left:1px solid rgba(205,167,101,.07);border-right:1px solid rgba(205,167,101,.07)}
.screen,.match-wrap{background:linear-gradient(180deg,rgba(53,16,24,.16),rgba(18,9,11,.18) 45%,rgba(18,9,11,.5))}\n.match-wrap{min-height:100%}
.body{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 220px);scrollbar-width:none}
.hdr,.head{min-height:72px;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:rgba(18,9,11,.9);border-bottom:1px solid rgba(205,167,101,.18);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.hdr::after,.head::after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(240,216,167,.62),transparent);pointer-events:none}
.hdr-info{min-width:0}
.hdr-step{font-size:9px;line-height:1.4;font-weight:800;color:var(--gold);letter-spacing:.26em;text-transform:uppercase}
.hdr-title,.head-title{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;line-height:1.35;letter-spacing:.035em;color:var(--cream)}
.hdr-back,.back{appearance:none;background:transparent;border:0;color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;min-width:44px;min-height:40px;padding:8px 6px 8px 0;cursor:pointer}
.back{font-size:20px;color:var(--gold-bright)}
.hdr-back:active,.back:active{color:var(--gold-bright)}
.ftr{padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));background:rgba(18,9,11,.94);border-top:1px solid rgba(205,167,101,.18);box-shadow:0 -18px 36px rgba(18,9,11,.38)}

/* CTAと入力欄 */
.btn{min-height:52px;border:1px solid transparent;font-size:15px;letter-spacing:.055em;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn-wine{color:#241014;background:linear-gradient(135deg,#F3DEB4 0%,#CDA765 58%,#B98C45 100%);border-color:rgba(240,216,167,.7);box-shadow:0 12px 30px rgba(205,167,101,.22),inset 0 1px 0 rgba(255,255,255,.52),inset 0 -1px 0 rgba(66,34,12,.18)}
.btn-wine:active{box-shadow:0 5px 16px rgba(205,167,101,.18),inset 0 1px 0 rgba(255,255,255,.34)}
.btn:disabled{filter:saturate(.4);opacity:.38}
.btn:focus-visible,.inp:focus-visible,.sel-btn:focus-visible,.choice-btn:focus-visible,.range-btn:focus-visible,.tag-chip:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
.inp,.chat-inp{background:linear-gradient(180deg,rgba(245,236,223,.075),rgba(245,236,223,.035));border:1px solid rgba(205,167,101,.26);color:var(--cream);box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 8px 24px rgba(0,0,0,.12)}
.inp{min-height:52px;border-radius:12px;padding:14px 15px;font-size:15px}
.inp:hover{border-color:rgba(205,167,101,.4)}
.inp:focus,.chat-inp:focus{border-color:var(--gold);background:rgba(245,236,223,.075);box-shadow:0 0 0 3px rgba(205,167,101,.11),0 10px 28px rgba(0,0,0,.18)}
.inp.filled{border-color:rgba(205,167,101,.52);background:rgba(205,167,101,.07)}
.inp:disabled{background:rgba(245,236,223,.025);color:var(--muted)}
select.inp option{color:var(--cream);background:#211014}
button[style*="background:#FFFFFF"]:not(.chat-send):not([onclick*="captureFacePhoto"]),button[style*="background:#fff"]:not(.chat-send):not([onclick*="captureFacePhoto"]){background:linear-gradient(180deg,rgba(245,236,223,.08),rgba(245,236,223,.035)) !important;color:var(--gold-bright) !important;border-color:rgba(205,167,101,.34) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
span[style*="background:#FFFFFF"][style*="width:20px"]{background:rgba(245,236,223,.04) !important;border-color:rgba(205,167,101,.42) !important}
input[type="checkbox"]{accent-color:var(--gold)}

/* 選択UI */
.sel-btn,.choice-btn,.range-btn,.check-item,.tag-chip{background:linear-gradient(180deg,rgba(245,236,223,.055),rgba(245,236,223,.025));border-color:rgba(205,167,101,.22);color:var(--muted);box-shadow:inset 0 1px 0 rgba(255,255,255,.018)}
.sel-btn{min-height:48px;border-radius:12px}
.choice-btn{min-height:54px;border-radius:12px;padding:15px 16px}
.range-btn{min-height:43px;border-radius:10px}
.check-item{border-radius:12px}
.sel-btn.on,.choice-btn.on,.range-btn.on,.check-item.on{border-color:rgba(240,216,167,.72);background:linear-gradient(135deg,rgba(107,29,41,.62),rgba(53,16,24,.86));color:var(--cream);box-shadow:0 8px 22px rgba(0,0,0,.22),inset 0 1px 0 rgba(240,216,167,.12)}
.choice-btn.on span:last-child{color:var(--gold-bright) !important}
.tag-chip{padding:8px 14px}
.tag-chip.on{border-color:rgba(240,216,167,.72);background:linear-gradient(135deg,var(--wine),#48131B);color:var(--gold-bright);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sec-label{display:flex;align-items:center;gap:10px;font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.24em;text-transform:uppercase}
.sec-label::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(205,167,101,.38),transparent)}
.sec-label[style*="text-align:center"]{justify-content:center}
.sec-label[style*="text-align:center"]::after{display:none}
.err-msg{border-radius:8px;color:#FF9B83}

/* 下部ナビ */
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(18,9,11,.94);border-top:1px solid rgba(205,167,101,.2);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 -16px 34px rgba(0,0,0,.34)}
.tabbar-i{position:relative;min-height:58px;color:#8D7E75;padding-top:10px}
.tabbar-i::before{content:"";position:absolute;top:0;left:32%;right:32%;height:1px;background:transparent}
.tabbar-i.on{color:var(--gold-bright)}
.tabbar-i.on::before{background:linear-gradient(90deg,transparent,var(--gold-bright),transparent);box-shadow:0 0 10px rgba(240,216,167,.5)}
.tabbar-i .ic{width:20px;height:20px;stroke-width:1.5}
.tabbar-i .lb{font-size:9px;letter-spacing:.08em}

/* トップ */
.home-stage{padding:20px 20px 26px;background:linear-gradient(180deg,#351018 0%,#241014 56%,#180B0E 100%);position:relative;overflow:hidden}
.home-stage::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-130px;bottom:30px;background:radial-gradient(circle,rgba(205,167,101,.09),transparent 68%);pointer-events:none}
.home-visual{height:232px;margin-bottom:18px;border-bottom-color:rgba(205,167,101,.38)}
.home-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;position:relative;z-index:1}
.home-wordmark{font:700 28px/1.04 'Shippori Mincho',serif;letter-spacing:.045em;color:var(--gold-bright);text-shadow:0 5px 22px rgba(0,0,0,.34)}
.home-live{display:flex;align-items:center;gap:6px;background:rgba(18,9,11,.55);border:1px solid rgba(123,201,143,.34);border-radius:999px;padding:6px 11px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.home-title{position:relative;z-index:1;font:700 34px/1.25 'Shippori Mincho',serif;letter-spacing:.025em;margin-bottom:10px;color:var(--cream)}
.home-lead{position:relative;z-index:1;font-size:13px;color:rgba(245,236,223,.68);line-height:1.75;margin-bottom:22px;letter-spacing:.04em}
.home-metric{background:linear-gradient(155deg,rgba(245,236,223,.065),rgba(245,236,223,.018));border-color:rgba(205,167,101,.2);border-radius:12px;padding:13px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.022)}
.home-status-card,.home-announcement,.home-ticket{position:relative;border-radius:14px !important;box-shadow:0 12px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.025)}
.home-menu{background:rgba(33,16,20,.98) !important;border:1px solid rgba(205,167,101,.28) !important;border-radius:14px !important;box-shadow:0 22px 55px rgba(0,0,0,.52) !important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.home-menu>div{border-bottom-color:rgba(205,167,101,.12) !important;color:var(--cream)}
button[onclick*="_showProfileMenu=!S._showProfileMenu"]{display:grid;place-items:center;width:42px;height:42px;padding:0 !important;border:1px solid rgba(205,167,101,.28) !important;border-radius:50% !important;background:rgba(18,9,11,.45) !important;color:var(--gold-bright) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* エリア・人数・候補カード */
.area-grid{gap:12px}
.area-card,.mode-card{background:#211014;border:1px solid rgba(205,167,101,.26);border-radius:18px;box-shadow:0 16px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.025)}
.area-grid .area-card img{height:130px}
.area-card img{filter:saturate(.7) contrast(1.08) brightness(.76)}
.area-card-tint{background:linear-gradient(180deg,rgba(18,9,11,.08),rgba(18,9,11,.2) 42%,rgba(12,6,8,.92))}
.area-card-label{padding:15px}
.area-card-title{font-size:16px !important;font-weight:700;letter-spacing:.08em}
.area-live-badge,.area-quiet-badge{top:10px;right:10px}
.area-live-badge{background:linear-gradient(135deg,#F0D8A7,#CDA765);box-shadow:0 8px 20px rgba(0,0,0,.28)}
.area-soon{opacity:.66}
.area-soon-ribbon-wrap{border-radius:18px}
.mode-card img{height:204px}
.mode-card-title{font-size:20px;font-weight:700;letter-spacing:.065em}
.mode-card-sub{color:rgba(245,236,223,.62);letter-spacing:.045em}
.card-selected{border-color:var(--gold-bright) !important;box-shadow:0 0 0 2px rgba(240,216,167,.14),0 18px 42px rgba(0,0,0,.42) !important}

/* 待機・マッチ・評価 */
.wait-hero{background:linear-gradient(180deg,#351018,#211014);padding:30px 20px 27px;text-align:center;border-bottom:1px solid rgba(205,167,101,.2);position:relative;overflow:hidden}
.wait-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(205,167,101,.11),transparent 52%);pointer-events:none}
.wait-info,.cond-wrap{margin-left:20px;margin-right:20px;padding:6px 16px;background:linear-gradient(150deg,rgba(245,236,223,.045),rgba(245,236,223,.015));border:1px solid rgba(205,167,101,.16);border-radius:14px}
.cond-wrap{padding:15px 16px;margin-top:16px}
.wait-row{padding:13px 0;border-bottom-color:rgba(245,236,223,.08)}
.wait-ico{filter:saturate(.72)}
.cond-chip{border-color:rgba(205,167,101,.2);background:rgba(245,236,223,.035);color:var(--cream)}
.match-hero>img{height:248px}
.member-row{margin:0 16px;padding:15px 4px;border-bottom-color:rgba(245,236,223,.09)}
.flow-step{margin:0 0 10px;padding:15px 16px;border:1px solid rgba(205,167,101,.15);border-radius:13px;background:rgba(245,236,223,.025)}
.flow-num{background:linear-gradient(135deg,var(--wine),#48131B);border-color:rgba(240,216,167,.55);color:var(--gold-bright)}
.review-hero{padding:32px 20px 24px;text-align:center;border-bottom:1px solid rgba(205,167,101,.18);background:radial-gradient(circle at 50% 0%,rgba(205,167,101,.12),transparent 65%)}
.review-hero-icon{font-size:30px;margin-bottom:12px;filter:saturate(.72)}
.review-hero-title{font:700 21px/1.5 'Shippori Mincho',serif;letter-spacing:.04em}

/* チャット */
.chat-msgs{padding:20px 18px;gap:14px;background:radial-gradient(circle at 100% 0%,rgba(107,29,41,.12),transparent 45%)}
.msg-system{background:rgba(245,236,223,.035);border-color:rgba(205,167,101,.16);color:var(--muted);font-size:10px;letter-spacing:.03em}
.msg-bubble{border-radius:16px;max-width:232px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.msg-row.mine .msg-bubble{background:linear-gradient(135deg,#792331,#48131B) !important;border:1px solid rgba(240,216,167,.16)}
.msg-row:not(.mine) .msg-bubble{background:linear-gradient(180deg,#2A151A,#211014) !important;border-color:rgba(205,167,101,.16)}
.chat-input{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(18,9,11,.94);border-top-color:rgba(205,167,101,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.chat-inp{min-height:44px;border-radius:999px}
.chat-send{background:linear-gradient(135deg,#F0D8A7,#CDA765);box-shadow:0 8px 22px rgba(205,167,101,.22)}

/* 本人確認・プロフィール・決済 */
.verify-waiting-core{background:linear-gradient(145deg,#351018,#211014);border-color:rgba(205,167,101,.42);box-shadow:0 14px 38px rgba(0,0,0,.34)}
#pf-prev-wrap>img,#pf-prev-wrap>div{border:1px solid rgba(205,167,101,.38);box-shadow:0 10px 28px rgba(0,0,0,.28)}
.cardreg-hero{border-radius:16px;background:linear-gradient(155deg,rgba(107,29,41,.55),rgba(33,16,20,.92));border-color:rgba(205,167,101,.44);box-shadow:0 18px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(240,216,167,.08)}
.cardreg-hero-title{font-size:22px;font-weight:700;letter-spacing:.05em}
.cardreg-input{border-radius:12px;border-color:rgba(205,167,101,.32);box-shadow:0 12px 28px rgba(0,0,0,.2)}
.cardreg-notes{background:rgba(245,236,223,.025);border-color:rgba(205,167,101,.16)}
.head-title{flex:1}
#app[data-screen="payconsent"] #payconsent-scroll{border-color:rgba(205,167,101,.18) !important;background:rgba(245,236,223,.025) !important}

/* 認証・完了・法務画面 */
#app[data-screen="email"] .body::before{content:"Nomi Go";display:block;text-align:center;margin:8px 0 10px;color:var(--gold-bright);font:700 28px/1.2 'Shippori Mincho',serif;letter-spacing:.08em;text-shadow:0 8px 26px rgba(0,0,0,.38)}
#app[data-screen="email"] .tab-btn{min-height:46px;background:transparent;color:var(--muted)}
#app[data-screen="email"] .tab-btn[style*="var(--wine)"]{background:linear-gradient(135deg,var(--wine),#48131B) !important;color:var(--gold-bright) !important;box-shadow:inset 0 1px 0 rgba(240,216,167,.1)}
#app[data-screen="email_verify"] #everify-inp{font-size:24px;text-align:center;letter-spacing:.24em;font-weight:800;font-variant-numeric:tabular-nums}
#app[data-screen="line_connect"] .body>div:nth-child(2){background:linear-gradient(150deg,rgba(107,29,41,.5),rgba(33,16,20,.9)) !important;border:1px solid rgba(205,167,101,.36);box-shadow:0 16px 36px rgba(0,0,0,.25)}
#app[data-screen="reset_sent"] .body>div[style*="font-size:44px"],#app[data-screen="id_verify_pending"] .body>div[style*="font-size:40px"],#app[data-screen="report"] .body>div[style*="font-size:40px"],#app[data-screen="inquiry"] .body>div[style*="font-size:40px"]{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:linear-gradient(145deg,rgba(107,29,41,.54),rgba(33,16,20,.9));border:1px solid rgba(205,167,101,.36);box-shadow:0 16px 34px rgba(0,0,0,.28)}
#app[data-screen="faqbot"] button[onclick="go('inquiry')"]{border-color:rgba(205,167,101,.5) !important;color:var(--gold-bright) !important;background:rgba(205,167,101,.06) !important}
#app[data-screen="loading"] .nl-brand,.loading .nl-brand{font:700 28px/1.2 'Shippori Mincho',serif;letter-spacing:.08em;color:var(--gold-bright);text-shadow:0 8px 28px rgba(0,0,0,.38)}
#app[data-screen="loading"] .nl-bar,.loading .nl-bar{background:rgba(245,236,223,.08);border:1px solid rgba(205,167,101,.16);overflow:hidden}
#app[data-screen="loading"] .nl-fill,.loading .nl-fill{background:linear-gradient(90deg,#B98C45,#F0D8A7,#CDA765);box-shadow:0 0 16px rgba(240,216,167,.34)}
#app[data-screen="terms"] .body>div,#app[data-screen="privacy"] .body>div,#app[data-screen="tokushoho"] .body>div{padding:20px !important;background:rgba(245,236,223,.025);border:1px solid rgba(205,167,101,.16);border-top-color:rgba(205,167,101,.52);border-radius:0 0 16px 16px;box-shadow:0 16px 36px rgba(0,0,0,.18)}
#app[data-screen="choose"] .body>div[style*="display:flex"]>div{border-color:rgba(205,167,101,.3) !important;background:linear-gradient(180deg,#281216,#1B0B0E) !important;box-shadow:0 16px 34px rgba(0,0,0,.28)}

/* ===== 2026/8/29 人気アプリの情報設計を反映した最終UI調整 =====
   目立たせる対象を「現在地・主操作・選択中」に限定し、
   それ以外は面と余白で整理する。機能・画面遷移・入力項目は変更しない。 */
:root{
  --ink:#10090B;--night:#160D10;--hero:#2A1117;--bg:#120A0C;
  --surface:#1B1114;--card:#211518;--card-raised:#28191D;
  --cream:#F7F0E6;--muted:#C8BBB1;--lgray:#94867E;
  --gold:#D4AA63;--gold-bright:#F0D7A6;--gold-bg:rgba(212,170,99,.12);
  --border:rgba(247,240,230,.11);--border2:rgba(247,240,230,.075);
  --wine:#682332;--wine-true:#4A1721;
}
html{background:var(--ink)}
body{font-size:15px;background:
  radial-gradient(ellipse 520px 360px at 88% -10%,rgba(104,35,50,.28),transparent 68%),
  radial-gradient(ellipse 420px 360px at 4% 92%,rgba(212,170,99,.055),transparent 70%),
  var(--ink)}
#app{background:linear-gradient(180deg,#160D10 0%,#10090B 62%);box-shadow:0 0 80px rgba(0,0,0,.46)}
.screen,.match-wrap{background:transparent}
.body{background:none;overscroll-behavior-y:contain}

/* 軽いアプリバー。金線や装飾を外し、タイトルを主役にする */
.hdr,.head{min-height:64px;padding:10px 18px;background:rgba(16,9,11,.88);border-bottom:1px solid var(--border2);box-shadow:0 8px 28px rgba(0,0,0,.12)}
.hdr::after,.head::after{display:none}
.hdr-info{display:flex;flex-direction:column;justify-content:center}
.hdr-step{font-size:10px;line-height:1.35;letter-spacing:.16em;color:var(--gold);margin-bottom:2px}
.hdr-title,.head-title{font-size:19px;line-height:1.35;letter-spacing:.025em}
.hdr-back,.back{min-width:48px;min-height:44px;font-size:12px;color:var(--muted)}
.back{font-size:20px;color:var(--gold-bright)}

/* 主要ボタンは角丸長方形、補助操作は面を持たない */
.btn{min-height:54px;border-radius:14px;font-size:15px;line-height:1.35;padding:15px 18px}
.btn-wine{background:linear-gradient(135deg,#F3DEB7 0%,#D4AA63 58%,#BF9148 100%);border-color:rgba(240,215,166,.48);box-shadow:0 12px 26px rgba(212,170,99,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.ftr{padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(16,9,11,.8),rgba(16,9,11,.98) 24%);border-top:1px solid var(--border2);box-shadow:0 -18px 34px rgba(16,9,11,.48)}
.inp,.chat-inp{border-color:var(--border);background:rgba(247,240,230,.055);box-shadow:none}
.inp{min-height:54px;border-radius:12px;font-size:16px}
.inp:focus,.chat-inp:focus{border-color:rgba(240,215,166,.72);box-shadow:0 0 0 3px rgba(212,170,99,.10)}

/* ラベルと補足を読みやすくする */
.sec-label{font-size:10.5px;line-height:1.5;letter-spacing:.14em;color:var(--gold);padding:22px 20px 9px}
.sec-label::after{background:linear-gradient(90deg,rgba(212,170,99,.24),transparent)}
.choice-btn,.sel-btn,.range-btn,.check-item,.tag-chip{border-color:var(--border);background:rgba(247,240,230,.045);box-shadow:none}
.choice-btn{min-height:56px;font-size:14px}
.sel-btn{min-height:50px;font-size:13px}
.choice-btn.on,.sel-btn.on,.range-btn.on,.check-item.on{border-color:rgba(240,215,166,.55);background:linear-gradient(145deg,rgba(104,35,50,.72),rgba(74,23,33,.88));box-shadow:0 8px 20px rgba(0,0,0,.16)}
.tag-chip.on{border-color:rgba(240,215,166,.5);background:var(--wine);box-shadow:none}

/* 下部ナビは4つの最上位画面だけ。選択中を面で示す */
.tabbar{padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(16,9,11,.94);border-top:1px solid var(--border2);box-shadow:0 -14px 34px rgba(0,0,0,.34)}
.tabbar-i{min-height:52px;margin:0 2px;padding:7px 4px 6px;border-radius:13px;gap:3px;color:#998B82}
.tabbar-i::before{display:none}
.tabbar-i.on{color:var(--gold-bright);background:rgba(212,170,99,.105)}
.tabbar-i .ic{width:21px;height:21px;stroke-width:1.65}
.tabbar-i .lb{font-size:11px;line-height:1.2;letter-spacing:.025em}
.has-tabbar{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px)) !important}

/* トップ：他画面と同じ黒に近いダークワインへ統一。金色は文字と操作部だけに使う */
#app[data-screen="splash"]{background:linear-gradient(180deg,var(--night),var(--ink))}
#app[data-screen="splash"] .screen{background:linear-gradient(180deg,rgba(53,16,24,.16),rgba(18,9,11,.18) 45%,rgba(18,9,11,.5))}
#app[data-screen="splash"] .body{background:linear-gradient(180deg,#1B0B0E 0%,#12090B 100%)}
.home-stage{padding:0 18px 30px;background:linear-gradient(180deg,#241016 0%,#1B0B0E 46%,#12090B 100%)}
.home-stage::before{content:"";position:absolute;inset:240px 0 0;pointer-events:none;background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.012) 48%,transparent 72%)}
.home-stage::after{display:none}
.home-visual{width:calc(100% + 36px);height:270px;margin:0 -18px 24px;border-bottom:1px solid rgba(240,215,166,.16);box-shadow:0 18px 42px rgba(28,7,12,.24)}
.home-visual img{object-position:center;filter:saturate(1.04) contrast(1.035) brightness(1.04)}
.home-visual::after{inset:auto 0 0;height:24%;background:linear-gradient(180deg,transparent,rgba(49,17,27,.76) 72%,#32111C 100%)}
.home-bar{position:absolute;z-index:4;top:14px;left:18px;right:18px;margin:0}
.home-wordmark{font-size:24px;color:var(--cream);text-shadow:0 3px 18px rgba(0,0,0,.7)}
.home-live{padding:7px 10px;background:rgba(18,9,12,.68);border-color:rgba(247,240,230,.20);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.home-title{font-size:36px;line-height:1.29;margin-bottom:9px;letter-spacing:.035em;font-weight:800;text-shadow:0 7px 24px rgba(0,0,0,.30)}
.home-title-accent{display:inline-block;color:var(--gold-bright);text-shadow:0 0 24px rgba(212,170,99,.18),0 7px 24px rgba(0,0,0,.32)}
.home-lead{font-size:14px;line-height:1.7;margin-bottom:20px;color:#D8CBC2}
.home-primary-action{position:relative;z-index:2;margin-bottom:20px}
.home-primary-action::before{display:none}
.home-primary-action .btn-wine{border-color:rgba(240,216,167,.70);box-shadow:0 12px 30px rgba(205,167,101,.18),inset 0 1px 0 rgba(255,255,255,.56)}
.home-context-card{position:relative;z-index:2;display:flex;align-items:center;gap:13px;padding:15px 14px;margin:3px 0 12px;border:1px solid rgba(205,167,101,.16);border-radius:15px;background:linear-gradient(145deg,#241016,#1B0B0E);box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 12px 28px rgba(0,0,0,.18)}
.home-context-icon{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;color:var(--gold-bright);background:linear-gradient(145deg,#32141B,#211014);border:1px solid rgba(205,167,101,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 7px 20px rgba(0,0,0,.18)}
.home-context-icon svg{width:28px;height:28px;display:block;overflow:visible;filter:drop-shadow(0 3px 7px rgba(0,0,0,.22))}
.home-context-icon--first{background:linear-gradient(145deg,#381720,#211014)}
.home-context-title{font-size:14.5px;font-weight:800;color:var(--cream);line-height:1.5}
.home-context-sub{font-size:12.5px;color:#D0C1B7;line-height:1.6;margin-top:2px}
.home-feed{margin:14px 0 8px;padding:15px 16px;border:1px solid rgba(205,167,101,.14);border-radius:15px;background:linear-gradient(145deg,#241016,#1B0B0E)}
.home-facts{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 4px;border:1px solid rgba(205,167,101,.14);border-radius:15px;overflow:hidden;background:linear-gradient(145deg,#241016,#1B0B0E);box-shadow:inset 0 1px 0 rgba(255,255,255,.02)}
.home-fact{min-width:0;padding:14px 6px;text-align:center;position:relative}
.home-fact+.home-fact::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:1px;background:rgba(240,215,166,.12)}
.home-fact-k{font-size:11px;color:#D0C1B7;margin-bottom:4px}
.home-fact-v{font-size:17px;font-weight:800;color:var(--cream);line-height:1.35}
.home-fact-s{font-size:10.5px;color:#AFA097;margin-top:3px;line-height:1.35}
.home-status-card,.home-announcement,.home-ticket{border:1px solid rgba(240,215,166,.16) !important;border-radius:15px !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 12px 28px rgba(0,0,0,.17) !important}
.home-status-card,.home-announcement,.home-ticket{background:linear-gradient(145deg,#241016,#1B0B0E) !important}
.home-announcement [style*="rgba(237,229,224,.62)"],.home-ticket [style*="rgba(237,229,224,.55)"],.home-ticket [style*="rgba(237,229,224,.6)"]{color:#CFC0B6 !important}
.home-status-card{margin-top:14px !important}
.home-secondary-link{display:block;width:100%;margin-top:7px;padding:9px;border:0;background:transparent;color:var(--muted);font:700 12px/1.4 inherit;text-decoration:underline;cursor:pointer}
.home-menu{top:60px !important;background:rgba(27,17,20,.98) !important;border-color:var(--border) !important;box-shadow:0 24px 58px rgba(0,0,0,.52) !important}
#app[data-screen="splash"] .tabbar-i.on{background:rgba(107,29,41,.30);box-shadow:inset 0 1px 0 rgba(240,215,166,.05)}

/* エリア・人数選択：冒頭で目的を一行だけ説明 */
.screen-intro{padding:18px 2px 14px}
.screen-intro-title{font:700 21px/1.45 'Shippori Mincho',serif;color:var(--cream);letter-spacing:.035em}
.screen-intro-note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:4px}
#app[data-screen="area_select"] .body,#app[data-screen="mode_select"] .body{padding:0 18px 24px !important}
.area-grid{gap:10px}
.area-card,.mode-card{border-color:var(--border);background:var(--surface);border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.area-grid .area-card img{height:142px}
.area-card-label{padding:13px}
.area-card-title{font-size:15px !important}
.mode-card img{height:186px}
.mode-card-label{padding:46px 16px 15px}
.mode-card-title{font-size:19px}
.card-selected{border-color:rgba(240,215,166,.72) !important;box-shadow:0 0 0 2px rgba(212,170,99,.11),0 16px 32px rgba(0,0,0,.28) !important}

/* 募集条件：各質問を独立した一まとまりにし、情報の塊を4つに限定 */
.recruit-context{display:flex;align-items:center;gap:8px;padding:14px 20px 2px;color:var(--muted);font-size:12px}
.recruit-context span{display:inline-flex;align-items:center;min-height:30px;padding:5px 10px;border-radius:999px;background:rgba(247,240,230,.05);border:1px solid var(--border2)}
.form-section{margin:14px 16px 0;padding:0 4px 16px;border-bottom:1px solid var(--border2)}
.form-section .sec-label{padding:7px 0 10px}
.form-section>.sec-label::after{display:none}
.form-section>div[style*="padding:0 20px"],.form-section>div[style*="padding:4px 20px"],.form-section>div[style*="padding:8px 20px"]{padding-left:0 !important;padding-right:0 !important}
.age-range-row .inp{flex:1;min-width:0;max-width:none !important;text-align:center;font-variant-numeric:tabular-nums}
.form-footnote{padding:16px 20px 0;font-size:12px;color:var(--lgray);line-height:1.75}
#app[data-screen="recruit"] .ftr{position:sticky;bottom:0;z-index:18}
#app[data-screen="recruit"] [style*="font-size:11px"]{font-size:12px !important}

/* 募集中・マッチ・チャット：状態を一つ、行動を一つ */
.wait-hero{padding:34px 20px 30px;background:radial-gradient(circle at 50% 0%,rgba(212,170,99,.13),transparent 62%),linear-gradient(180deg,#2A1117,#1B1114);border-bottom-color:var(--border2)}
.wait-hero-title{font:700 27px/1.45 'Shippori Mincho',serif;letter-spacing:.035em;margin:15px 0 8px}
.wait-info,.cond-wrap{background:transparent;border:0;border-radius:0;padding:4px 0;margin-left:20px;margin-right:20px}
.wait-info{margin-top:14px}
.cond-wrap{padding-top:14px;border-top:1px solid var(--border2)}
.wait-t{font-size:14px}.wait-s{font-size:12.5px}
.wait-pill{border-width:1px;background:rgba(212,170,99,.10)}
.cond-label{font-size:10.5px;letter-spacing:.14em}
.cond-chip{border-color:var(--border);background:rgba(247,240,230,.045)}
.match-hero>img{height:224px}
.match-hero-copy{padding:68px 20px 18px}
.member-row{margin:0 18px;padding:16px 0}
.flow-step{padding:16px 0;margin:0;border:0;border-bottom:1px solid var(--border2);border-radius:0;background:transparent}
.flow-step:last-child{border-bottom:0}
.flow-num{width:28px;height:28px;background:rgba(212,170,99,.10);border-color:rgba(212,170,99,.32)}
.flow-title{font-size:15px}.flow-note{font-size:12.5px}
.chat-msgs{padding:18px 16px;gap:13px;background:none}

.msg-row.mine .msg-bubble{background:linear-gradient(145deg,#6B2634,#4A1721) !important;border-color:rgba(247,240,230,.08)}

<script>
(function(){
  var FIRST_KEY='ngo_first_attribution';
  var LAST_KEY='ngo_last_attribution';
  var ATTRIBUTION_DAYS=30;
  function readTouch(key){
    try{
      var value=JSON.parse(localStorage.getItem(key)||'null');
      if(!value)return null;
      if(value.expires_at&&new Date(value.expires_at).getTime()<=Date.now()){
        localStorage.removeItem(key);
        return null;
      }
      if(value.landing_url)value.landing_url=sanitizeAttributionUrl(value.landing_url);
      if(value.referrer)value.referrer=sanitizeAttributionUrl(value.referrer);
      try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}
      return value;
    }catch(e){return null;}
  }
  function sanitizeAttributionUrl(raw){
    if(!raw)return '';
    try{
      var url=new URL(raw,window.location.origin);
      url.hash='';
      ['access_token','refresh_token','provider_token','provider_refresh_token','token','token_hash','code'].forEach(function(key){
        url.searchParams.delete(key);
      });
      return url.toString().slice(0,1000);
    }catch(e){return '';}
  }
  function classifySource(q,ref){
    var source=(q.get('utm_source')||'').toLowerCase();
    var medium=q.get('utm_medium')||'';
    var fbclid=q.get('fbclid')||'';
    var clickId=fbclid||q.get('ttclid')||q.get('gclid')||q.get('msclkid')||'';
    var refCode=q.get('ref')||q.get('ref_code')||'';
    var hasExplicit=!!(source||medium||q.get('utm_campaign')||q.get('utm_content')||q.get('utm_term')||clickId||refCode);
    var sameOrigin=false;
    try{sameOrigin=!!ref&&new URL(ref).origin===window.location.origin;}catch(e){}
    if(!hasExplicit&&sameOrigin)return null;
    if(!source){
      if(fbclid)source='meta';
      else if(q.get('ttclid'))source='tiktok';
      else if(q.get('gclid'))source='google';
      else if(q.get('msclkid'))source='bing';
      else if(/instagram\.com/i.test(ref))source='instagram';
      else if(/facebook\.com/i.test(ref))source='facebook';
      else if(/tiktok\.com/i.test(ref))source='tiktok';
      else if(/line\.me|liff\.line\.me/i.test(ref))source='line';
      else if(/google\./i.test(ref))source='google';
      else if(refCode||ref)source='referral';
      else source='direct';
    }
    if(!medium){
      if(source==='direct')medium='none';
      else if(fbclid||q.get('ttclid'))medium='paid_social';
      else if(q.get('gclid')||q.get('msclkid'))medium='paid_search';
      else if(source==='instagram'||source==='facebook'||source==='tiktok')medium='organic_social';
      else if(source==='referral'||source==='line')medium='referral';
      else medium='organic';
    }
    return {source:source,medium:medium,fbclid:fbclid,click_id:clickId,ref_code:refCode};
  }
  window.ngoCaptureAttribution=function(){
    try{
      var q=new URLSearchParams(window.location.search);
      var ref=document.referrer||'';
      var classified=classifySource(q,ref);
      if(!classified)return;
      var now=new Date();
      var expires=new Date(now.getTime()+ATTRIBUTION_DAYS*86400000).toISOString();
      var touch={
        source:classified.source,
        medium:classified.medium,
        campaign:q.get('utm_campaign')||q.get('campaign')||'',
        adset:q.get('utm_term')||q.get('adset')||'',
        ad:q.get('utm_content')||q.get('ad')||'',
        fbclid:classified.fbclid,
        click_id:classified.click_id,
        ref_code:classified.ref_code,
        landing_url:sanitizeAttributionUrl(window.location.href),
        referrer:sanitizeAttributionUrl(ref),
        recorded_at:now.toISOString(),
        expires_at:expires
      };
      var first=readTouch(FIRST_KEY);
      var last=readTouch(LAST_KEY);
      if(!first){
        localStorage.setItem(FIRST_KEY,JSON.stringify(touch));
        first=touch;
      }
      if(touch.source!=='direct'||!last)localStorage.setItem(LAST_KEY,JSON.stringify(touch));
      localStorage.setItem('ngo_utm_first',JSON.stringify(first));
      localStorage.setItem('ngo_utm_last',JSON.stringify(touch.source!=='direct'||!last?touch:last));
    }catch(e){}
  };
  window.ngoCaptureAttribution();
  window.ngoTrackCompleteRegistration=function(userId){
    try{
      var key='ngo_complete_registration_'+String(userId||'unknown');
      if(localStorage.getItem(key))return;
      var first=readTouch(FIRST_KEY),last=readTouch(LAST_KEY)||first;
      window.dataLayer=window.dataLayer||[];
      window.dataLayer.push({event:'complete_registration',user_id:userId||null,attribution_first:first,attribution_last:last});
      if(typeof window.fbq==='function')window.fbq('track','CompleteRegistration');
      localStorage.setItem(key,new Date().toISOString());
    }catch(e){}
  };
})();
</script>

<script>

// ===== 一時保存（sessionStorage）の失敗で画面が止まらないようにする =====
// プロフィール写真は文字データに変換されると容量が大きく、保存の上限を超えることがある。
// 従来はここで例外が発生し、後続の「画面の描き直し」に到達しないため、
// 写真を選んだ時点で以降のボタンがすべて反応しなくなっていた。
// 保存に失敗した場合は写真を除いて保存し直し、それも失敗したら黙って諦める。
// 保存はあくまで入力内容の一時退避であり、失敗しても画面の動作は続けてよい。
(function(){
  try{
    var _origSet=sessionStorage.setItem.bind(sessionStorage);
    sessionStorage.setItem=function(k,v){
      try{
        _origSet(k,v);
      }catch(e){
        try{
          var o=JSON.parse(v);
          if(o&&typeof o==='object'){
            delete o.photoPreview;
            delete o.photoFile;
            _origSet(k,JSON.stringify(o));
          }
        }catch(e2){}

})();

// ===== 流入元の初回・最終記録（2026/9/4） =====

// 直接流入も保存するが、広告・検索・紹介の後に直接戻ってきた場合は最終の有効な流入元を維持する。
const ATTRIBUTION_STORAGE_KEY='ngo_first_attribution';
const LAST_ATTRIBUTION_STORAGE_KEY='ngo_last_attribution';
function captureFirstAttribution(){
  try{if(window.ngoCaptureAttribution)window.ngoCaptureAttribution();}catch(e){}
}
captureFirstAttribution();

function readStoredAttribution(key){
  try{
    var value=JSON.parse(localStorage.getItem(key)||'null');
    if(!value)return null;
    if(value.expires_at&&new Date(value.expires_at).getTime()<=Date.now()){
      localStorage.removeItem(key);
      return null;
    }
    return value;
  }catch(e){return null;}
}
function attributionValue(touch,key){
  return touch&&touch[key]?String(touch[key]).slice(0,1000):null;
}
async function saveUserAttribution(){
  if(!S.user)return;
  try{
    captureFirstAttribution();
    var first=readStoredAttribution(ATTRIBUTION_STORAGE_KEY);
    var last=readStoredAttribution(LAST_ATTRIBUTION_STORAGE_KEY)||first;
    if(!first&&!last)return;
    var effective=last||first;
    var completedAt=new Date().toISOString();
    var saved=await DB.from('user_attributions').upsert({
      user_id:S.user.id,
      source:attributionValue(effective,'source'),
      medium:attributionValue(effective,'medium'),
      campaign:attributionValue(effective,'campaign'),
      adset:attributionValue(effective,'adset'),
      ad:attributionValue(effective,'ad'),
      fbclid:attributionValue(effective,'fbclid'),
      click_id:attributionValue(effective,'click_id'),
      ref_code:attributionValue(effective,'ref_code'),
      landing_url:attributionValue(effective,'landing_url'),
      referrer:attributionValue(effective,'referrer'),
      first_source:attributionValue(first,'source'),
      first_medium:attributionValue(first,'medium'),
      first_campaign:attributionValue(first,'campaign'),
      first_adset:attributionValue(first,'adset'),
      first_ad:attributionValue(first,'ad'),
      first_fbclid:attributionValue(first,'fbclid'),
      first_click_id:attributionValue(first,'click_id'),
      first_ref_code:attributionValue(first,'ref_code'),
      first_landing_url:attributionValue(first,'landing_url'),
      first_referrer:attributionValue(first,'referrer'),
      first_recorded_at:attributionValue(first,'recorded_at'),
      last_source:attributionValue(last,'source'),
      last_medium:attributionValue(last,'medium'),
      last_campaign:attributionValue(last,'campaign'),
      last_adset:attributionValue(last,'adset'),
      last_ad:attributionValue(last,'ad'),
      last_fbclid:attributionValue(last,'fbclid'),
      last_click_id:attributionValue(last,'click_id'),
      last_ref_code:attributionValue(last,'ref_code'),
      last_landing_url:attributionValue(last,'landing_url'),
      last_referrer:attributionValue(last,'referrer'),
      last_recorded_at:attributionValue(last,'recorded_at'),
      attribution_expires_at:attributionValue(last||first,'expires_at'),
      registration_completed_at:completedAt,
      tracking_version:2
    },{onConflict:'user_id'});
    if(saved.error)console.warn('Attribution save failed',saved.error);
  }catch(e){console.warn('Attribution save failed',e);}
}

const MAX_TAGS=3;
function toggleProfileTag(tag,screenName){
  if(!S.pf.tags)S.pf.tags=[];
  var idx=S.pf.tags.indexOf(tag);
  if(idx!==-1){S.pf.tags.splice(idx,1);}
  else{
    if(S.pf.tags.length>=MAX_TAGS){alert('タグは'+MAX_TAGS+'つまで選べます');return;}
    S.pf.tags.push(tag);
  }
  sessionStorage.setItem('ngo_pf',JSON.stringify(S.pf));
  re(screenName);
}

function areaName(id){var a=AREAS.find(function(x){return x.id===id;});return a?a.name:id||'';}

function clampAgeMin(val,defaultMin){
  var n=parseInt(val);
  if(isNaN(n))return defaultMin;
  if(n>defaultMin)n=defaultMin;
  if(n<20)n=20;
  return n;
}
function clampAgeMax(val,defaultMax){
  var n=parseInt(val);
  if(isNaN(n))return defaultMax;
  if(n<defaultMax)n=defaultMax;
  if(n>99)n=99;
  return n;
}

function ageMatches(isAny,minAge,maxAge,otherAge){
  if(isAny)return true;
  if(otherAge==null||minAge==null||maxAge==null)return true;
  return otherAge>=minAge&&otherAge<=maxAge;
}

// ===== 日本語を意味の区切りで折り返すための部品 =====
//
// 日本語は単語の間にスペースがないため、ブラウザは
// 「どこで切ってよいか」を判断できず、文字の途中どこでも改行する。
// その結果「ご入力くださ／い。」のように語が割れて読みにくくなる。
//
// CSSの line-break や text-wrap では、この「文節で切る」制御はできない
// （それを行う word-break:auto-phrase は一部のブラウザにしか実装がない）。
//
// そこで、割りたくない塊を display:inline-block で囲む。
// inline-block は中身が入りきる限り内部で改行されないため、
// 塊ごとに折り返されるようになる。
// 長すぎる塊を渡すと結局その中で折り返されるので、
// 20文字前後を目安に区切って使うこと。
function nb(t){return '<span style="display:inline-block">'+t+'</span>';}

function escapeHtml(str){
  if(str==null)return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function calcAgeFromBirthdate(bd){
  if(!bd)return null;
  var b=new Date(bd);
  var today=new Date();
  var age=today.getFullYear()-b.getFullYear();
  var mdiff=today.getMonth()-b.getMonth();
  if(mdiff<0||(mdiff===0&&today.getDate()<b.getDate()))age--;
  return age;
}
// ランダムなIDを1つ作る
function newUuid(){
  try{ if(window.crypto&&window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0, v=(c==='x')?r:((r&0x3)|0x8);
    return v.toString(16);
  });
}

function digitsOnly(el){
  var v=el.value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  el.value=v.replace(/[^0-9]/g,'');
}

// ===== 候補が尽きていないかの確認 =====
// 一度マッチした相手は候補から外れるため、利用者が少ない時期は
// 「条件に合う人はいるが、全員すでに会ったことがある」状態になりうる。
// 黙って待たせ続けないよう、待機画面で状況を伝える。
async function checkCandidatePool(){
  try{
    var res=await DB.rpc('count_new_candidates');
    var row=res.data&&res.data[0];
    if(!row)return;
    S._poolWaiting=row.waiting_total;
    S._poolNew=row.new_candidates;
    if(S.screen==='waiting')render();
  }catch(e){}
}
function startPoolCheck(){
  if(S._poolTimer)clearInterval(S._poolTimer);
  if(S._remainTimer)clearInterval(S._remainTimer);
  S._remainTimer=setInterval(function(){
    if(S.screen!=='waiting'){clearInterval(S._remainTimer);S._remainTimer=null;return;}
    render();
  },60000);
  checkCandidatePool();
  S._poolTimer=setInterval(function(){
    if(S.screen!=='waiting'){clearInterval(S._poolTimer);S._poolTimer=null;return;}
    expireMyRegistrationIfNeeded().then(function(ended){
      if(ended){render();return;}
      checkCandidatePool();
    });
  },5000);
}
function stopPoolCheck(){
  if(S._poolTimer){clearInterval(S._poolTimer);S._poolTimer=null;}
  if(S._remainTimer){clearInterval(S._remainTimer);S._remainTimer=null;}
  S._poolWaiting=null;S._poolNew=null;
}
// ===== 登録ステップの表示 =====
// 登録は全5段階。今どこまで来たか、あといくつで終わるかを常に示す。
var SIGNUP_STEPS=5;
function stepHeadH(n,label,title){
  var seg='';
  for(var i=1;i<=SIGNUP_STEPS;i++){
    seg+='<span class="stp'+(i<n?' done':(i===n?' cur':''))+'"></span>';
  }
  var rest=SIGNUP_STEPS-n;
  var restText=rest>0?('あと'+rest+'つ'):'これで最後です';
  return '<div class="hdr-step">登録 '+n+' / '+SIGNUP_STEPS+'　'+label+'</div>'
    +'<div class="hdr-title">'+title+'</div>'
    +'<div class="stp-row">'+seg+'<span class="stp-rest">'+restText+'</span></div>';
}

  return '<span class="wait-pill">⏳ あと'+label+'</span>';

  try{

// =====================================================================
// アフィリエイト（レントラックス）の成果計測
// =====================================================================
//
// 【成果地点】
//   レントラックスとの契約上の成果地点は
//   「男女ともに初回マッチでの体験・参加」であり、
//   マッチが成立した時点を指す（2026/8/28に運営経由で確認）。
//
// 【当初の実装との違い】
//   当初は決済完了ページ（thanks.html）で購入を成果としていたが、
//   これは契約と食い違っていた。
//   ①9月中は男性のチケットが無料のため購入が発生せず成果が0件になる
//   ②女性はそもそも購入しないため女性経由の成果が永久に0件になる
//   という重大な問題があったため、マッチ成立時点へ移した。
//
// 【なぜ判定をDB側で行うか】
//   「初回のマッチかどうか」を画面側で判定すると、
//   書き換えによって何度でも成果を発生させられる。
//   成果は報酬の支払いに直結するため、判定は必ずサーバー側で行う。
//   画面側は get_my_first_match_for_affiliate() を呼び、
//   1行返ってきたときにだけタグを動かす。
//
// 【注文番号】
//   DB側が「マッチID＋利用者ID」を返す。
//   同じ人が同じマッチ画面を何度開いても同一の番号になるため、
//   レントラックス側で重複が排除される。
//
// 【10月以降の切り替えについて（重要）】
//   10月からはチケットの購入を成果地点とする方針である。
//   その際は、この処理を止めたうえで thanks.html 側を有効にすること。
//   両方が動いていると二重に成果が計上される。自動では切り替わらない。
// =====================================================================

// 同じ画面で何度も動かさないための札。
// 画面の再描画のたびに通信が走るのを防ぐ。
var _affiliateFired = false;

function fireAffiliateTag(orderId, genderCode){
  if(!orderId) return;

  // ここから下はレントラックスから受領したタグの中身。
  // 読み込み処理は原文のまま。
  (function(){
    function loadScriptRTCV(callback){
      var script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://www.rentracks.jp/js/itp/rt.track.js?t=' + (new Date()).getTime();
      if ( script.readyState ) {
        script.onreadystatechange = function() {
          if ( script.readyState === 'loaded' || script.readyState === 'complete' ) {
            script.onreadystatechange = null;
            callback();
          };
        };
      } else {
        script.onload = function() {
          callback();
        };
      };
      document.getElementsByTagName('head')[0].appendChild(script);
    }

    loadScriptRTCV(function(){
      try{
        // _rt.sid / _rt.pid は先方指定の固定値。変更しない。
        // _rt.price は定額案件のため0固定。
        // _rt.ctel / _rt.cemail は電話・メールを入れる欄だが、
        //   成果の特定は注文番号だけで足り、個人情報を外部へ渡すことは
        //   プライバシーポリシー第4条・第6条の説明と食い違うため空にする。
        //   ここに個人情報を入れてはいけない。
        // _rt.cname は本来は氏名を入れる欄だが、2026/9/2のレントラックスの
        //   依頼（No.274）により、男女の別を示す固定記号だけを入れる。
        //   男性＝'M'／女性＝'F'。先方はこの値で成果単価を出し分ける。
        //   氏名は絶対に入れないこと。
        _rt.sid    = 11469;
        _rt.pid    = 16351;
        _rt.price  = 0;
        _rt.reward = -1;
        _rt.cname  = (genderCode==='M'||genderCode==='F') ? genderCode : '';
        _rt.ctel   = '';
        _rt.cemail = '';
        _rt.cinfo  = encodeURIComponent(String(orderId));
        rt_tracktag();
      }catch(e){}
    });
  })();
}

// マッチ画面を開いたときに呼ばれる。
// 初回のマッチであることをDBが認めた場合にだけ成果を送る。
// 通信に失敗しても画面の動作には影響させない。
async function checkFirstMatchAndFire(){
  if(_affiliateFired) return;
  try{
    var res = await DB.rpc('get_my_first_match_for_affiliate');
    if(res.error) return;
    var row = res.data && res.data[0];
    if(row && row.out_ok === true && row.out_order_id){
      _affiliateFired = true;
      // 自分の性別を M / F に変換して渡す。値が取れないときは空のまま送る。
      var g = (S.profile && S.profile.gender==='male') ? 'M'
            : (S.profile && S.profile.gender==='female') ? 'F' : '';
      fireAffiliateTag(row.out_order_id, g);
    }
  }catch(e){}
}

function go(sc){
  if(sc!=='chat'&&S._chatTimer){clearInterval(S._chatTimer);S._chatTimer=null;_sendingMsg=false;}
  // 画面固有の定期通信は、その画面を離れた時点で必ず止める。
  // 募集・マッチ・チャットの状態自体は保持し、対象画面へ戻った時だけ再開する。
  if(sc!=='waiting')stopPolling();
  if(sc!=='matched'&&sc!=='chat'&&S._meetingPlanTimer){
    clearInterval(S._meetingPlanTimer);S._meetingPlanTimer=null;
  }
  S.screen=sc;S.error='';S.info='';
  _animateNext=true;
  sessionStorage.setItem('ngo_screen',sc);
  sessionStorage.setItem('ngo_form',JSON.stringify(S.form));
  sessionStorage.setItem('ngo_pf',JSON.stringify(S.pf));
  render();
  if(sc==='recruit'){
    // 経路によらず、募集画面に入った時点で「送信中」の札は必ず下ろす（押せなくなるのを防ぐ保険）
    _isSubmitting=false;
  }
  // 【アフィリエイトの成果計測 2026/8/28・No.211】
  // 成果地点は「男女ともに初回マッチでの体験・参加」＝マッチが成立した時点。
  // マッチ画面へ入る経路は複数あるが、すべてこの go() を通るため、ここに置く。
  // 判定はDB側で行うので、ここでは呼ぶだけ。画面の動作には一切影響しない。
  if(sc==='matched'&&S.user){ checkFirstMatchAndFire(); }
  if(sc==='splash'&&S.user){
    syncTicketCount();
  }
  if(sc==='line_connect'){
    startLineLinkPolling();
  }else if(S._lineLinkTimer){
    clearInterval(S._lineLinkTimer);S._lineLinkTimer=null;
  }
  if(sc==='waiting'){
    if(S.registration&&S.registration.status==='waiting')startPolling();
    startWaitMessageRotation();
    startPoolCheck();
    if(S._waitLineTimer)clearTimeout(S._waitLineTimer);
    S._waitShowLineCta=false;
    S._waitLineTimer=setTimeout(function(){
      S._waitShowLineCta=true;
      if(S.screen==='waiting')render();
    },3*60*1000);
  }else{
    stopWaitMessageRotation();
    stopPoolCheck();
  }
  if(sc!=='id_verify_pending'&&S._idVerifyTimer){
    clearInterval(S._idVerifyTimer);S._idVerifyTimer=null;
  }
  if(sc==='splash'){startWaitFeed();}else{stopWaitFeed();}
  if((sc==='matched'||sc==='chat')&&S.match&&S.registration&&S.registration.status==='matched'){
    startMeetingPlanTimer();
  }
  if(sc==='splash')loadStats();
}

// 【画面の作り直しでスクロール位置が戻る問題 2026/9/2・No.252】
//   re() は render() で画面をまるごと作り直す。作り直した直後の画面は
//   必ず一番上から表示されるため、性別・タバコ・お酒の強さ・タグなどを
//   選ぶたびに、見ていた位置が画面の先頭へ戻っていた。
//   利用者からは「スライド（スクロール）できない」「下まで進めない」と見える。
//   go()（画面の切り替え）は先頭から見せるのが正しいので、そのままにする。
//   ここで直すのは re()（同じ画面の作り直し）だけ。
function re(sc){
  var oldBody=document.querySelector('.body');
  var keepTop=oldBody?oldBody.scrollTop:0;
  var keepWin=window.scrollY||document.documentElement.scrollTop||0;
  S.screen=sc;
  sessionStorage.setItem('ngo_screen',sc);
  sessionStorage.setItem('ngo_pf',JSON.stringify(S.pf));
  render();
  // 端末によって、中身の枠が動く場合と画面全体が動く場合がある。両方を戻す。
  if(keepTop){
    var newBody=document.querySelector('.body');
    if(newBody)newBody.scrollTop=keepTop;
  }
  if(keepWin){window.scrollTo(0,keepWin);}
}

    try{_lineReturn=_params.get('line_return')==='1';}catch(e){}
    if(_lineReturn){
      try{window.history.replaceState({},'',window.location.pathname);}catch(e){}
      if(sess&&sess.user&&S.profile&&S.profile.line_user_id){
        await routeAfterLoad();
        loadStats();
        return;
      }
      if(sess&&sess.user){
        try{await DB.auth.signOut();}catch(e){}
        S.user=null;S.profile=null;S.registration=null;S.match=null;
      }
      S.authTab='login';
      S._lineReturnNotice=true;
      go('email');
      loadStats();
      return;
    }

    var _startMode=null;
    try{_startMode=_params.get('start');}catch(e){}
    if(!sess&&S._pendingRecruitmentId){
      S.authTab='login';
      go('email');
      loadStats();
      return;
    }
    if(!sess&&_startMode==='register'){
      S.authTab='register';
      go('email');
      loadStats();
      return;
    }

    if(sess&&sess.user){routeAfterLoad();}
    else{go('splash');}
    loadStats();
  }catch(e){go('splash');}
}

async function doSignUp(){

  var emailEl2=document.getElementById('einp2');
  var email2=emailEl2?emailEl2.value.trim():'';
  var pass=document.getElementById('pinp').value;
  if(!email||!pass){S.error='メールとパスワードを入力してください';re('email');return;}
  // 確認用の欄と一致しない場合は登録させない。
  // 間違ったアドレスで登録されると確認コードが届かず、詰んでしまうため。
  if(emailEl2){
    if(!email2){S.error='確認のため、メールアドレスをもう一度入力してください';re('email');return;}
    if(email.toLowerCase()!==email2.toLowerCase()){S.error='メールアドレスが一致していません。もう一度ご確認ください';re('email');return;}
  }
  if(pass.length<6){S.error='パスワードは6文字以上です';re('email');return;}
  go('loading');
  var res=await DB.auth.signUp({email:email,password:pass});
  if(res.error){var r2=await DB.auth.signInWithPassword({email:email,password:pass});if(r2.error){S.error='登録に失敗しました';go('email');return;}S.user=r2.data.user;await loadProfile();routeAfterLoad();return;}
  if(res.data&&res.data.session){S.user=res.data.user;await loadProfile();if(!S.profile){await goEmailVerify();}else{routeAfterLoad();}return;}
  if(res.data&&res.data.user){var r3=await DB.auth.signInWithPassword({email:email,password:pass});if(r3.error){S.error='ログインタブからサインインしてください';go('email');return;}S.user=r3.data.user;await loadProfile();if(!S.profile){await goEmailVerify();}else{routeAfterLoad();}return;}
